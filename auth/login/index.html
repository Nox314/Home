<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X!Login - nox!314</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --proton-blue: #624aff;
            --proton-blue-hover: #4f37e0;
            --proton-dark: #1c1c1c;
            --proton-light: #f5f7fa;
            --proton-border: #e0e4eb;
            --proton-text: #333333;
            --proton-success-bg: #e6fffa;
            --proton-success-text: #00b894;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--proton-light);
            color: var(--proton-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #topMenu {
            background-color: white;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .wrap {
            margin: 0 auto;
            padding: 0 20px;
            max-width: 1200px;
            width: 100%;
        }

        #topMenu .wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
            flex-wrap: nowrap;
        }

        .logo {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: var(--proton-dark);
            text-decoration: none;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }

        .logo span {
            color: var(--proton-blue);
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--proton-text);
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: rgba(98, 74, 255, 0.1);
            color: var(--proton-blue);
        }

        .btn-register {
            background-color: var(--proton-blue);
            color: white !important;
            padding: 10px 20px !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 12px rgba(98, 74, 255, 0.2);
            transition: all 0.3s !important;
        }

        .btn-register:hover {
            background-color: var(--proton-blue-hover) !important;
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 16px rgba(98, 74, 255, 0.3) !important;
        }

        .hamburger {
            display: none;
        }

        .main-container {
            flex: 1;
            padding: 60px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: white;
            border-radius: var(--radius);
            padding: 60px;
            box-shadow: var(--shadow-md);
            max-width: 450px;
            width: 100%;
            border: 1px solid var(--proton-border);
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--proton-dark);
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: var(--proton-dark);
            font-size: 14px;
        }

        .form-group input {
            padding: 12px 16px;
            border: 1px solid var(--proton-border);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--proton-blue);
            box-shadow: 0 0 0 3px rgba(98, 74, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #999;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .form-row a {
            color: var(--proton-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .form-row a:hover {
            color: var(--proton-blue-hover);
            text-decoration: underline;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .login-btn {
            background: linear-gradient(135deg, var(--proton-blue), #8a7bff);
            color: white;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(98, 74, 255, 0.2);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(98, 74, 255, 0.3);
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #999;
            font-size: 13px;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--proton-border);
        }

        .social-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--proton-border);
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--proton-text);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn:hover {
            background-color: var(--proton-light);
            border-color: var(--proton-blue);
            color: var(--proton-blue);
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-footer a {
            color: var(--proton-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .login-footer a:hover {
            color: var(--proton-blue-hover);
            text-decoration: underline;
        }

        footer {
            background-color: white;
            padding: 30px 0;
            border-top: 1px solid var(--proton-border);
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-top: auto;
        }

        .footer-links {
            margin-top: 15px;
        }

        .footer-links a {
            color: var(--proton-blue);
            text-decoration: none;
            margin: 0 10px;
            font-weight: 500;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            #topMenu .wrap {
                flex-direction: column;
                height: auto;
                padding: 15px 0;
            }

            .hamburger {
                display: flex;
                flex-direction: column;
                gap: 6px;
                background: none;
                border: none;
                cursor: pointer;
                padding: 8px;
                z-index: 101;
            }

            .hamburger span {
                width: 24px;
                height: 3px;
                background-color: var(--proton-dark);
                border-radius: 2px;
                transition: all 0.3s cubic-bezier(0.645, 0.045, 0.355, 1);
                transform-origin: center;
            }

            .hamburger.active span:nth-child(1) {
                transform: rotate(45deg) translateY(11px);
            }

            .hamburger.active span:nth-child(2) {
                opacity: 0;
                transform: translateX(-10px);
            }

            .hamburger.active span:nth-child(3) {
                transform: rotate(-45deg) translateY(-11px);
            }

            .nav-links {
                display: none;
                position: fixed;
                top: 70px;
                left: 0;
                right: 0;
                flex-direction: column;
                gap: 0;
                background-color: white;
                box-shadow: var(--shadow-md);
                padding: 20px;
                width: 100%;
                max-height: calc(100vh - 70px);
                overflow-y: auto;
                animation: slideDown 0.3s ease-out;
            }

            @keyframes slideDown {
                from {
                    opacity: 0;
                    transform: translateY(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links a {
                padding: 12px 15px;
                border-radius: 6px;
                width: 100%;
                box-sizing: border-box;
            }

            .btn-register {
                width: 100%;
                text-align: center !important;
                box-sizing: border-box !important;
            }

            .main-container {
                padding: 40px 20px;
            }

            .login-card {
                padding: 40px 25px;
            }

            .login-header h1 {
                font-size: 28px;
            }

            .social-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <nav id="topMenu">
        <div class="wrap">
            <a href="/Home/index.html" class="logo">nox<span>!</span>314</a>
            <button class="hamburger" id="hamburger" aria-label="Menü öffnen" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="/Home/index.html">Start</a>
                <a href="/Home/date.html">Weltuhr</a>
                <a href="/Home/iss.html">Iss</a>
                <a href="/Home/info.html">Info</a>
                <a href="/Home/auth/login/index.html" class="active">Login</a>
                <a href="/Home/register.html" class="btn-register">Registrieren</a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Willkommen zurück</h1>
                <p>Melden Sie sich an, um auf all Ihre X!Apps zuzugreifen.</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="social-buttons">
                    <button type="button" class="social-btn" onclick="alert('Google Sign-In ist derzeit nicht verfügbar')">
                        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Google
                    </button>
                    <button type="button" class="social-btn" onclick="alert('Apple Sign-In ist derzeit nicht verfügbar')">
                        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.05 13.5c-.91 2.06-.39 3.81 1.02 4.84 1.01.71 2.56.26 3.38-1 .82-1.27.78-3.18 0-4.56-.32-.57-1.05-.97-1.76-.97-.6 0-1.23.26-1.64.69M12.5 5.5c1.31 0 2.37 1.06 2.37 2.37 0 1.31-1.06 2.37-2.37 2.37S10.13 9.18 10.13 7.87c0-1.31 1.06-2.37 2.37-2.37M3.5 12c0-1.32.8-2.45 1.95-2.96-.23-.7-.35-1.48-.35-2.28C5.1 5.3 6.4 4 8 4c.68 0 1.31.23 1.84.62.82-.77 1.93-1.25 3.16-1.25 2.76 0 5 2.24 5 5 0 .8-.19 1.56-.53 2.24C19.2 10.49 20 11.7 20 13c0 2.21-1.79 4-4 4-1.15 0-2.19-.49-2.93-1.28-.65.24-1.35.37-2.07.37-1.6 0-3-1.34-3-3v-.5c-1.15-.51-1.95-1.64-1.95-2.96"/>
                        </svg>
                        Apple
                    </button>
                </div>

                <div class="login-divider">oder mit E-Mail anmelden</div>

                <div class="form-group">
                    <label for="email">E-Mail</label>
                    <input type="email" id="email" name="email" placeholder="ihre@email.com" required>
                </div>

                <div class="form-group">
                    <div class="form-row">
                        <label for="password">Passwort</label>
                        <a href="#forgot">Passwort vergessen?</a>
                    </div>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember" checked>
                    <label for="remember" style="margin: 0; cursor: pointer;">Anmeldung auf diesem Gerät speichern</label>
                </div>

                <button type="submit" class="login-btn">Anmelden</button>

                <div class="login-footer">
                    Noch kein Konto? <a href="/Home/register.html">Jetzt kostenlos registrieren</a>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="wrap">
            <div>&copy; 2026 nox!314</div>
            <div class="footer-links">
                <a href="/Home/sourcecodes.html">Quellcode</a>
                <a href="/Home/news.html">News</a>
                <a href="/Home/sitemap.html">Sitemap</a>
            </div>
        </div>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        const loginForm = document.getElementById('loginForm');

        hamburger.addEventListener('click', () => {
            const isExpanded = hamburger.getAttribute('aria-expanded') === 'true';
            hamburger.setAttribute('aria-expanded', String(!isExpanded));
            hamburger.classList.toggle('active');
            navLinks.classList.toggle('active');
        });

        navLinks.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                hamburger.setAttribute('aria-expanded', 'false');
                navLinks.classList.remove('active');
            });
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            alert(`Anmeldung erfolgreich! E-Mail: ${email}\n\nHinweis: Dies ist ein Demo-Formular.`);
            loginForm.reset();
        });
    </script>

</body>
</html>
