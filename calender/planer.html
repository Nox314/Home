<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X!Planer Pro - nox!314</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --proton-blue: #624aff;
            --proton-blue-hover: #4f37e0;
            --proton-dark: #1c1c1c;
            --proton-light: #f5f7fa;
            --proton-border: #e0e4eb;
            --proton-text: #333333;
            --card-bg: #ffffff;
            --cell-bg: #fafbfc;
            --shadow-sm: 0 4px 12px rgba(98, 74, 255, 0.06);
            --shadow-md: 0 12px 32px rgba(0,0,0,0.08);
            --radius: 14px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--proton-light);
            color: var(--proton-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #topMenu {
            background-color: var(--card-bg);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--proton-border);
        }

        .wrap {
            margin: 0 auto;
            padding: 0 20px;
            max-width: 1200px;
        }

        #topMenu .wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-weight: 700;
            font-size: 24px;
            color: var(--proton-dark);
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .logo span { color: var(--proton-blue); }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--proton-text);
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: rgba(98, 74, 255, 0.1);
            color: var(--proton-blue);
        }

        .main-container {
            flex: 1;
            padding: 40px 0;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 20px 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--proton-border);
            flex-wrap: wrap;
            gap: 15px;
        }

        .calendar-header h1 {
            margin: 0;
            font-size: 22px;
            color: var(--proton-dark);
        }

        .view-switchers {
            display: flex;
            background: var(--proton-light);
            padding: 4px;
            border-radius: 10px;
            gap: 4px;
            border: 1px solid var(--proton-border);
        }

        .view-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--proton-text);
            transition: all 0.2s;
        }

        .view-btn.active {
            background: var(--card-bg);
            color: var(--proton-blue);
            box-shadow: var(--shadow-sm);
        }

        .calendar-nav-btns, .action-btns {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            background-color: var(--proton-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(98, 74, 255, 0.2);
        }

        .btn:hover {
            background-color: var(--proton-blue-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--card-bg);
            color: var(--proton-text);
            border: 1px solid var(--proton-border);
            box-shadow: none;
        }

        .btn-secondary:hover {
            background-color: rgba(98, 74, 255, 0.05);
            color: var(--proton-blue);
            border-color: var(--proton-blue);
        }

        .calendar-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
        }

        @media(max-width: 950px) {
            .calendar-layout {
                grid-template-columns: 1fr;
            }
        }

        .calendar-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--proton-border);
        }

        /* Month View */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: #888;
            font-size: 13px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .day-cell {
            min-height: 105px;
            background: var(--cell-bg);
            border: 1px solid var(--proton-border);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .day-cell:hover {
            border-color: var(--proton-blue);
            background: var(--card-bg);
            box-shadow: var(--shadow-sm);
            transform: translateY(-2px);
        }

        .day-cell.other-month {
            opacity: 0.3;
        }

        .day-cell.today {
            border-color: var(--proton-blue);
            background: rgba(98, 74, 255, 0.04);
        }

        .day-number {
            font-size: 13px;
            font-weight: 700;
            color: var(--proton-dark);
            margin-bottom: 6px;
        }

        .day-events-preview {
            display: flex;
            flex-direction: column;
            gap: 3px;
            font-size: 11px;
        }

        .preview-badge {
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
            color: white;
        }

        /* Kategorien Farben */
        .cat-work { background-color: #624aff; }
        .cat-personal { background-color: #00b894; }
        .cat-sport { background-color: #ff9f43; }
        .cat-important { background-color: #ff5252; }

        /* Sidebar / Event Manager */
        .sidebar-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--proton-border);
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: fit-content;
        }

        .sidebar-card h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            color: var(--proton-dark);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 12px;
        }

        .form-group label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .form-group input, .form-group textarea, .form-group select {
            padding: 10px;
            border: 1px solid var(--proton-border);
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            background: var(--cell-bg);
            color: var(--proton-text);
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--proton-blue);
            background: var(--card-bg);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            accent-color: var(--proton-blue);
            cursor: pointer;
        }

        .events-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        .event-item {
            background: var(--cell-bg);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--proton-border);
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            transition: border-color 0.2s;
        }
        .event-item:hover {
            border-color: var(--proton-blue);
        }

        .event-info h4 {
            margin: 0 0 3px 0;
            font-size: 13px;
            color: var(--proton-dark);
        }

        .event-info p {
            margin: 0 0 4px 0;
            color: #666;
            font-size: 12px;
            word-break: break-word;
        }

        .event-meta {
            font-size: 11px;
            color: #888;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
            font-weight: 700;
        }
        .delete-btn:hover { color: #ff0000; }

        .stats-badge-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            background: var(--cell-bg);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--proton-border);
            font-size: 12px;
            font-weight: 500;
        }

        footer {
            background-color: var(--card-bg);
            padding: 25px 0;
            margin-top: auto;
            border-top: 1px solid var(--proton-border);
            text-align: center;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <nav id="topMenu">
        <div class="wrap">
            <a href="index.html" class="logo">nox<span>!</span>314</a>
            <div class="nav-links">
                <a href="index.html">Start</a>
                <a href="date.html" class="active">X!Planer Pro</a>
                <a href="iss.html">Iss</a>
                <a href="info.html">Info</a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="wrap">
            
            <div class="calendar-header">
                <h1 id="headerTitle">Monat Jahr</h1>
                
                <div class="view-switchers">
                    <button class="view-btn active" id="btnMonthView" onclick="switchView('month')">Monat</button>
                    <button class="view-btn" id="btnWeekView" onclick="switchView('week')">Woche</button>
                    <button class="view-btn" id="btnDayView" onclick="switchView('day')">Tag</button>
                    <button class="view-btn" id="btnAgendaView" onclick="switchView('agenda')">Agenda</button>
                </div>

                <div class="calendar-nav-btns">
                    <button class="btn btn-secondary" onclick="navigate(-1)">← Zurück</button>
                    <button class="btn btn-secondary" onclick="goToToday()">Heute</button>
                    <button class="btn btn-secondary" onclick="navigate(1)">Weiter →</button>
                </div>
                
                <div class="action-btns">
                    <input type="text" id="searchInput" placeholder="Suche..." oninput="renderView()" style="padding: 9px 12px; border-radius:10px; border:1px solid var(--proton-border); background:var(--cell-bg); color:var(--proton-text); font-size:13px; width:130px;">
                    
                    <select id="categoryFilter" onchange="renderView()" style="padding: 9px; border-radius:10px; border:1px solid var(--proton-border); background:var(--cell-bg); color:var(--proton-text); font-size:13px;">
                        <option value="all">Alle Kategorien</option>
                        <option value="work">Arbeit</option>
                        <option value="personal">Privat</option>
                        <option value="sport">Sport</option>
                        <option value="important">Wichtig</option>
                    </select>

                    <button class="btn" onclick="document.getElementById('fileInput').click()">📥 Import</button>
                    <input type="file" id="fileInput" style="display:none" accept=".ics,.txt" onchange="importEvents(event)">
                    <button class="btn btn-secondary" onclick="exportEvents()">📤 Export iCal</button>
                </div>
            </div>

            <div class="calendar-layout">
                <div class="calendar-card" id="calendarCard">
                    <!-- Dynamischer Content -->
                </div>

                <div class="sidebar-card">
                    <h3>Termin hinzufügen</h3>
                    <form id="eventForm" onsubmit="addEvent(event)">
                        <div class="form-group">
                            <label for="eventTitle">Titel</label>
                            <input type="text" id="eventTitle" placeholder="z.B. Projekt-Meeting" required>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="eventDate">Datum</label>
                                <input type="date" id="eventDate" required>
                            </div>
                            <div class="form-group">
                                <label for="eventCategory">Kategorie</label>
                                <select id="eventCategory">
                                    <option value="work">Arbeit</option>
                                    <option value="personal">Privat</option>
                                    <option value="sport">Sport</option>
                                    <option value="important">Wichtig</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="eventLocation">Ort (optional)</label>
                            <input type="text" id="eventLocation" placeholder="z.B. Büro / Zoom">
                        </div>

                        <label class="checkbox-group">
                            <input type="checkbox" id="isAllDay" onchange="toggleAllDay(this)"> Ganztägig
                        </label>

                        <div class="form-row" id="timeRow">
                            <div class="form-group">
                                <label for="eventStartTime">Von</label>
                                <input type="time" id="eventStartTime" value="09:00">
                            </div>
                            <div class="form-group">
                                <label for="eventEndTime">Bis</label>
                                <input type="time" id="eventEndTime" value="10:00">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="eventDesc">Beschreibung</label>
                            <textarea id="eventDesc" rows="2" placeholder="Details..."></textarea>
                        </div>

                        <button type="submit" class="btn" style="width:100%; justify-content:center;">Speichern ✨</button>
                    </form>

                    <hr style="border:0; border-top:1px solid var(--proton-border); margin: 5px 0;">

                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>Gespeicherte Events</h3>
                        <span id="eventCountBadge" style="font-size: 11px; background: rgba(98, 74, 255, 0.1); color: var(--proton-blue); padding: 2px 8px; border-radius: 20px; font-weight: 600;">0 Events</span>
                    </div>

                    <div class="events-list" id="eventsList"></div>

                    <div class="stats-badge-box" id="statsBox">
                        <div>📊 Gesamt: <span id="statTotal">0</span></div>
                        <div>⚡ Wichtig: <span id="statImportant">0</span></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <div class="wrap">&copy; 2026 nox!314 &bull; Advanced X!Planer Pro (Clean Light Edition)</div>
    </footer>

    <script>
        let currentDate = new Date();
        let currentView = 'month'; 
        
        let events = JSON.parse(localStorage.getItem('nox_events_clean_pro')) || [
            { date: '2026-06-15', title: 'Release X!Secure', desc: 'Beta-Launch des neuen Passwort-Managers', isAllDay: true, startTime: '', endTime: '', location: 'Online', category: 'work' },
            { date: '2026-06-28', title: 'Server Wartung', desc: 'Kurzer Downtime-Check', isAllDay: false, startTime: '14:00', endTime: '15:30', location: 'Serverraum', category: 'important' }
        ];

        function initApp() {
            renderView();
            renderEventsList();
            if(!document.getElementById('eventDate').value) {
                document.getElementById('eventDate').value = new Date().toISOString().split('T')[0];
            }
        }

        function switchView(view) {
            currentView = view;
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn${view.charAt(0).toUpperCase() + view.slice(1)}View`).classList.add('active');
            renderView();
        }

        function renderView() {
            if (currentView === 'month') renderMonthView();
            else if (currentView === 'week') renderWeekView();
            else if (currentView === 'day') renderDayView();
            else if (currentView === 'agenda') renderAgendaView();
            updateStats();
        }

        function navigate(dir) {
            if (currentView === 'month' || currentView === 'agenda') {
                currentDate.setMonth(currentDate.getMonth() + dir);
            } else if (currentView === 'week') {
                currentDate.setDate(currentDate.getDate() + (dir * 7));
            } else if (currentView === 'day') {
                currentDate.setDate(currentDate.getDate() + dir);
            }
            renderView();
        }

        function goToToday() {
            currentDate = new Date();
            renderView();
        }

        function toggleAllDay(checkbox) {
            document.getElementById('timeRow').style.display = checkbox.checked ? 'none' : 'grid';
        }

        function getFilteredEvents() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const catFilter = document.getElementById('categoryFilter').value;
            
            return events.filter(e => {
                const matchesQuery = !query || e.title.toLowerCase().includes(query) || (e.desc && e.desc.toLowerCase().includes(query));
                const matchesCat = catFilter === 'all' || e.category === catFilter;
                return matchesQuery && matchesCat;
            });
        }

        // --- MONTH VIEW ---
        function renderMonthView() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthNames = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
            document.getElementById('headerTitle').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; 
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevTotalDays = new Date(year, month, 0).getDate();
            const activeEvents = getFilteredEvents();

            let gridHTML = `<div class="weekdays"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div><div class="days-grid">`;

            for (let i = firstDayIndex; i > 0; i--) {
                gridHTML += `<div class="day-cell other-month"><div class="day-number">${prevTotalDays - i + 1}</div></div>`;
            }

            const todayStr = new Date().toISOString().split('T')[0];
            for (let i = 1; i <= totalDays; i++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const isToday = dateStr === todayStr ? 'today' : '';
                const dayEvents = activeEvents.filter(e => e.date === dateStr);
                
                let badgesHTML = '<div class="day-events-preview">';
                dayEvents.slice(0, 2).forEach(ev => {
                    let timeStr = ev.isAllDay ? '' : `${ev.startTime} `;
                    badgesHTML += `<div class="preview-badge cat-${ev.category || 'work'}">${timeStr}${ev.title}</div>`;
                });
                if(dayEvents.length > 2) badgesHTML += `<span style="font-size:10px; color:#888; font-weight:600;">+${dayEvents.length - 2} weitere</span>`;
                badgesHTML += '</div>';

                gridHTML += `<div class="day-cell ${isToday}" onclick="selectDate('${dateStr}')"><div class="day-number">${i}</div>${badgesHTML}</div>`;
            }
            gridHTML += `</div>`;
            document.getElementById('calendarCard').innerHTML = gridHTML;
        }

        // --- WEEK VIEW ---
        function renderWeekView() {
            let curr = new Date(currentDate);
            let day = curr.getDay();
            let diff = curr.getDate() - day + (day === 0 ? -6 : 1);
            let monday = new Date(curr.setDate(diff));
            document.getElementById('headerTitle').innerText = `Woche ab ${monday.toLocaleDateString('de-DE')}`;

            let weekHTML = `<div style="display:grid; grid-template-columns: repeat(7, 1fr); gap:10px;">`;
            const todayStr = new Date().toISOString().split('T')[0];
            const activeEvents = getFilteredEvents();

            for(let i=0; i<7; i++) {
                let loopDate = new Date(monday);
                loopDate.setDate(monday.getDate() + i);
                let dateStr = loopDate.toISOString().split('T')[0];
                let isToday = dateStr === todayStr ? 'border-color:var(--proton-blue); background:rgba(98, 74, 255, 0.02);' : '';
                let dayEvents = activeEvents.filter(e => e.date === dateStr);

                weekHTML += `<div style="background:var(--cell-bg); border:1px solid var(--proton-border); border-radius:10px; padding:10px; min-height:400px; ${isToday}" onclick="selectDate('${dateStr}')">
                    <div style="font-size:13px; font-weight:600; text-align:center; padding-bottom:8px; border-bottom:1px solid var(--proton-border);">${loopDate.toLocaleDateString('de-DE', {weekday: 'short', day: '2-digit', month: '2-digit'})}</div>
                    <div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">`;

                dayEvents.forEach(ev => {
                    weekHTML += `<div style="background:var(--card-bg); border:1px solid var(--proton-border); border-radius:8px; padding:6px; font-size:12px;">
                        <strong style="color:var(--proton-blue);">${ev.title}</strong>
                        <div style="font-size:10px; color:#888;">${ev.isAllDay ? 'Ganztägig' : ev.startTime}</div>
                    </div>`;
                });
                weekHTML += `</div></div>`;
            }
            weekHTML += `</div>`;
            document.getElementById('calendarCard').innerHTML = weekHTML;
        }

        // --- DAY VIEW ---
        function renderDayView() {
            const dateStr = currentDate.toISOString().split('T')[0];
            document.getElementById('headerTitle').innerText = currentDate.toLocaleDateString('de-DE', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'});
            const activeEvents = getFilteredEvents().filter(e => e.date === dateStr);

            let dayHTML = `<div style="display:flex; flex-direction:column; gap:10px;">`;
            if(activeEvents.length === 0) {
                dayHTML += `<p style="color:#888; text-align:center; padding: 40px;">Keine Termine an diesem Tag.</p>`;
            } else {
                activeEvents.forEach(ev => {
                    dayHTML += `<div class="event-item">
                        <div class="event-info">
                            <h4>${ev.title}</h4>
                            <p>${ev.desc || ''}</p>
                            <div class="event-meta"><span>🕒 ${ev.isAllDay ? 'Ganztägig' : ev.startTime + ' - ' + ev.endTime}</span> ${ev.location ? '<span>📍 ' + ev.location + '</span>' : ''}</div>
                        </div>
                    </div>`;
                });
            }
            dayHTML += `</div>`;
            document.getElementById('calendarCard').innerHTML = dayHTML;
        }

        // --- AGENDA VIEW ---
        function renderAgendaView() {
            document.getElementById('headerTitle').innerText = `Komplette Agenda`;
            let sorted = [...getFilteredEvents()].sort((a,b) => new Date(a.date) - new Date(b.date));
            
            let agendaHTML = `<div style="display:flex; flex-direction:column; gap:12px;">`;
            if(sorted.length === 0) {
                agendaHTML += `<p style="color:#888; text-align:center; padding: 40px;">Keine Termine gefunden.</p>`;
            } else {
                sorted.forEach((ev, idx) => {
                    agendaHTML += `<div class="event-item" style="align-items:center;">
                        <div class="event-info">
                            <h4>${ev.title} <span style="font-weight:400; color:#888;">(${ev.date})</span></h4>
                            <p>${ev.desc ? escapeHtml(ev.desc) : 'Keine Beschreibung'}</p>
                            <div class="event-meta"><span>🕒 ${ev.isAllDay ? 'Ganztägig' : ev.startTime + ' Uhr'}</span> ${ev.location ? '<span>📍 ' + ev.location + '</span>' : ''}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteEvent(${idx})" title="Löschen">&times;</button>
                    </div>`;
                });
            }
            agendaHTML += `</div>`;
            document.getElementById('calendarCard').innerHTML = agendaHTML;
        }

        function selectDate(dateStr) {
            document.getElementById('eventDate').value = dateStr;
            document.getElementById('eventTitle').focus();
        }

        function addEvent(e) {
            e.preventDefault();
            events.push({
                title: document.getElementById('eventTitle').value,
                date: document.getElementById('eventDate').value,
                category: document.getElementById('eventCategory').value,
                location: document.getElementById('eventLocation').value,
                isAllDay: document.getElementById('isAllDay').checked,
                startTime: document.getElementById('eventStartTime').value,
                endTime: document.getElementById('eventEndTime').value,
                desc: document.getElementById('eventDesc').value
            });
            saveAndRefresh();
            document.getElementById('eventForm').reset();
            document.getElementById('timeRow').style.display = 'grid';
        }

        function deleteEvent(index) {
            let sorted = [...events].sort((a,b) => new Date(a.date) - new Date(b.date));
            const target = sorted[index];
            events = events.filter(ev => !(ev.date === target.date && ev.title === target.title));
            saveAndRefresh();
        }

        function saveAndRefresh() {
            localStorage.setItem('nox_events_clean_pro', JSON.stringify(events));
            renderView();
            renderEventsList();
        }

        function renderEventsList() {
            const listContainer = document.getElementById('eventsList');
            document.getElementById('eventCountBadge').innerText = `${events.length} Events`;
            if (events.length === 0) {
                listContainer.innerHTML = '<p style="color:#888; font-size:13px; text-align:center;">Keine Events vorhanden.</p>';
                return;
            }
            let sorted = [...events].sort((a,b) => new Date(a.date) - new Date(b.date));
            let html = '';
            sorted.forEach((ev, idx) => {
                html += `<div class="event-item">
                    <div class="event-info">
                        <h4>${ev.title} <span style="font-weight:400; color:#888;">(${ev.date})</span></h4>
                        <p>${ev.desc ? escapeHtml(ev.desc) : ''}</p>
                    </div>
                    <button class="delete-btn" onclick="deleteEvent(${idx})">&times;</button>
                </div>`;
            });
            listContainer.innerHTML = html;
        }

        function updateStats() {
            document.getElementById('statTotal').innerText = events.length;
            document.getElementById('statImportant').innerText = events.filter(e => e.category === 'important').length;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function exportEvents() {
            let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//nox!314//X!Planer Pro//DE\n";
            events.forEach(e => {
                icsContent += "BEGIN:VEVENT\n";
                icsContent += `SUMMARY:${e.title}\n`;
                icsContent += `DESCRIPTION:${e.desc || ''}\n`;
                icsContent += `LOCATION:${e.location || ''}\n`;
                if(e.isAllDay) {
                    let dClean = e.date.replace(/-/g, '');
                    icsContent += `DTSTART;VALUE=DATE:${dClean}\n`;
                } else {
                    let stClean = e.date.replace(/-/g, '') + 'T' + e.startTime.replace(/:/g, '') + '00';
                    let etClean = e.date.replace(/-/g, '') + 'T' + e.endTime.replace(/:/g, '') + '00';
                    icsContent += `DTSTART:${stClean}\nDTEND:${etClean}\n`;
                }
                icsContent += "END:VEVENT\n";
            });
            icsContent += "END:VCALENDAR";

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'calendar_export.ics';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importEvents(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                // Einfacher Parser für SUMMARY und DTSTART im .ics Format
                const summaryMatch = text.match(/SUMMARY:(.*)/);
                const dateMatch = text.match(/DTSTART(?:;VALUE=DATE)?:([0-9]{8})/);

                if (summaryMatch && dateMatch) {
                    const title = summaryMatch[1].trim();
                    const rawDate = dateMatch[1];
                    const formattedDate = `${rawDate.slice(0,4)}-${rawDate.slice(4,6)}-${rawDate.slice(6,8)}`;
                    
                    events.push({
                        title: title,
                        date: formattedDate,
                        category: 'work',
                        location: 'Importiert',
                        isAllDay: true,
                        startTime: '',
                        endTime: '',
                        desc: 'Aus .ics Datei importiert'
                    });
                    saveAndRefresh();
                    alert("Termin erfolgreich aus iCal-Datei importiert! 🚀");
                } else {
                    alert("Konnte keine gültigen Event-Daten in der .ics finden.");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        window.onload = initApp;
    </script>
</body>
</html>
