<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X!Time - nox!314</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --proton-blue: #624aff;
            --proton-blue-hover: #4f37e0;
            --proton-dark: #1c1c1c;
            --proton-light: #f5f7fa;
            --proton-border: #e0e4eb;
            --proton-text: #333333;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
            --radius: 12px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--proton-light);
            color: var(--proton-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #topMenu {
            background-color: white;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .wrap {
            margin: 0 auto;
            padding: 0 20px;
            max-width: 1200px;
        }

        #topMenu .wrap {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 70px;
        }

        .logo {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 24px;
            color: var(--proton-dark);
            text-decoration: none;
            letter-spacing: -0.5px;
        }
        .logo span { color: var(--proton-blue); }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--proton-text);
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav-links a:hover, .nav-links a.active {
            background-color: rgba(98, 74, 255, 0.1);
            color: var(--proton-blue);
        }

        .btn-register {
            background-color: var(--proton-blue);
            color: white !important;
            padding: 10px 20px !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 12px rgba(98, 74, 255, 0.2);
        }

        .btn-register:hover {
            background-color: var(--proton-blue-hover) !important;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(98, 74, 255, 0.3);
        }

        .main-container {
            flex: 1;
            padding: 40px 0;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-section h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: var(--proton-dark);
        }

        .header-section p {
            color: #666;
            font-size: 16px;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 40px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            border: 1px solid var(--proton-border);
            border-radius: var(--radius);
            font-size: 16px;
            background-color: white;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--proton-blue);
            box-shadow: 0 0 0 3px rgba(98, 74, 255, 0.1);
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            max-height: 300px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            margin-top: 5px;
        }

        .search-item {
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--proton-border);
            transition: background 0.2s;
        }

        .search-item:last-child { border-bottom: none; }
        .search-item:hover { background-color: var(--proton-light); }
        .search-item strong { color: var(--proton-blue); }

        .clock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }

        .clock-card {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s;
            animation: fadeIn 0.3s ease;
        }

        .clock-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .clock-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .clock-city {
            font-weight: 600;
            font-size: 16px;
            color: var(--proton-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .clock-timezone {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .clock-remove {
            background: none;
            border: none;
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
            line-height: 1;
            flex-shrink: 0;
        }

        .clock-remove:hover {
            background-color: rgba(255, 0, 0, 0.08);
            color: #e33;
        }

        .clock-time {
            font-size: 32px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            color: var(--proton-dark);
            margin-bottom: 4px;
        }

        .clock-date {
            font-size: 14px;
            color: #777;
            margin-bottom: 10px;
        }

        .clock-offset {
            font-size: 12px;
            font-weight: 500;
            color: var(--proton-blue);
            background: rgba(98, 74, 255, 0.08);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        .empty-state {
            text-align: center;
            color: #aaa;
            padding: 60px 20px;
            font-size: 18px;
            grid-column: 1 / -1;
        }

        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            font-size: 14px;
            border-top: 1px solid var(--proton-border);
            background: white;
        }

        @media (max-width: 640px) {
            .header-section h1 { font-size: 28px; }
            .clock-time { font-size: 28px; }
            .nav-links a:not(.btn-register) { display: none; }
        }
    </style>
</head>
<body>

    <div id="topMenu">
        <div class="wrap">
            <a href="#" class="logo">X!<span>Time</span></a>
            <nav class="nav-links">
                <a href="#" class="active">Start</a>
                <a href="#">Uhrzeit</a>
                <a href="#">Weltzeit</a>
                <a href="#">Einstellungen</a>
                <a href="#" class="btn-register">Registrieren</a>
            </nav>
        </div>
    </div>

    <div class="main-container">
        <div class="wrap">
            <div class="header-section">
                <h1>X!Time – Ihre Weltzeit</h1>
                <p>Fügen Sie Städte hinzu und behalten Sie alle Zeitzonen im Blick.</p>
            </div>

            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Stadt oder Zeitzone suchen..." autocomplete="off">
                <div class="search-results" id="searchResults"></div>
            </div>

            <div class="clock-grid" id="clockGrid">
                <div class="empty-state">
                    <span class="empty-icon">🕐</span>
                    Noch keine Uhren hinzugefügt<br>
                    <small style="font-size:14px;">Suchen Sie oben nach einer Stadt oder Zeitzone</small>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <span>© 2025 X!Time · nox!314</span>
    </footer>

    <script>
        // Verfügbare Zeitzonen
        const timeZones = Intl.supportedValuesOf('timeZone');
        
        // Gespeicherte Zeitzonen (localStorage)
        let savedZones = [];
        try {
            savedZones = JSON.parse(localStorage.getItem('xtime_zones') || '[]');
        } catch(e) { savedZones = []; }

        // DOM-Elemente
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const clockGrid = document.getElementById('clockGrid');

        // Formatierer
        const timeFormatter = new Intl.DateTimeFormat('de-DE', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });

        const dateFormatter = new Intl.DateTimeFormat('de-DE', {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        const offsetFormatter = (tz) => {
            try {
                const now = new Date();
                const dtf = new Intl.DateTimeFormat('de-DE', {
                    timeZone: tz,
                    timeZoneName: 'shortOffset'
                });
                const parts = dtf.formatToParts(now);
                const offset = parts.find(p => p.type === 'timeZoneName').value;
                return offset || '';
            } catch {
                return '';
            }
        };

        // Uhrzeit aktualisieren
        function getTimeInZone(tz) {
            const now = new Date();
            return {
                time: timeFormatter.formatToParts(now).map(p => {
                    if (p.type === 'hour') return p.value;
                    if (p.type === 'minute') return p.value;
                    if (p.type === 'second') return p.value;
                    if (p.type === 'dayPeriod') return p.value;
                    return '';
                }).filter((v, i, arr) => arr[i-1] !== ' ' && v !== '').join(':').replace(/(:+)$/, ''),
                date: dateFormatter.format(now),
                offset: offsetFormatter(tz)
            };
        }

        // Zeitzonen durchsuchen
        function searchZones(query) {
            if (!query || query.length < 2) return [];
            const q = query.toLowerCase();
            return timeZones.filter(tz => tz.toLowerCase().includes(q)).slice(0, 8);
        }

        // Suche anzeigen
        function showResults(results) {
            if (results.length === 0) {
                searchResults.style.display = 'none';
                return;
            }
            searchResults.innerHTML = results.map(tz => {
                const city = tz.split('/').pop().replace(/_/g, ' ');
                return `<div class="search-item" data-zone="${tz}"><strong>${esc(city)}</strong><br><small>${esc(tz)} · ${offsetFormatter(tz)}</small></div>`;
            }).join('');
            searchResults.style.display = 'block';
        }

        function esc(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Clock-Karte rendern
        function renderClock(tz) {
            // Entferne Empty-State
            const empty = clockGrid.querySelector('.empty-state');
            if (empty) empty.remove();

            const existing = document.querySelector(`[data-clock="${CSS.escape(tz)}"]`);
            if (existing) {
                existing.classList.remove('remove-anim');
                void existing.offsetWidth;
                existing.classList.add('remove-anim');
                return;
            }

            const card = document.createElement('div');
            card.className = 'clock-card';
            card.dataset.clock = tz;

            const { time, date, offset } = getTimeInZone(tz);
            const city = tz.split('/').pop().replace(/_/g, ' ');

            card.innerHTML = `
                <div class="clock-card-header">
                    <div>
                        <div class="clock-city">${esc(city)}</div>
                        <div class="clock-timezone">${esc(tz)}</div>
                    </div>
                    <button class="clock-remove" title="Entfernen">&times;</button>
                </div>
                <div class="clock-time" data-part="time">${time}</div>
                <div class="clock-date" data-part="date">${date}</div>
                <div class="clock-offset">${offset}</div>
            `;

            card.querySelector('.clock-remove').addEventListener('click', () => {
                card.remove();
                savedZones = savedZones.filter(z => z !== tz);
                localStorage.setItem('xtime_zones', JSON.stringify(savedZones));
                checkEmpty();
            });

            clockGrid.appendChild(card);
        }

        // Alle Karten aktualisieren
        function updateAllClocks() {
            document.querySelectorAll('.clock-card').forEach(card => {
                const tz = card.dataset.clock;
                const { time, date, offset } = getTimeInZone(tz);
                card.querySelector('[data-part="time"]').textContent = time;
                card.querySelector('[data-part="date"]').textContent = date;
                card.querySelector('.clock-offset').textContent = offset;
            });
        }

        // Empty-State prüfen
        function checkEmpty() {
            if (clockGrid.children.length === 0) {
                clockGrid.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-icon">🕐</span>
                        Noch keine Uhren hinzugefügt<br>
                        <small style="font-size:14px;">Suchen Sie oben nach einer Stadt oder Zeitzone</small>
                    </div>
                `;
            }
        }

        // Event-Listener für Suche
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            const query = e.target.value;
            searchTimeout = setTimeout(() => {
                const results = searchZones(query);
                showResults(results);
            }, 150);
        });

        // Klick auf Suchergebnis
        searchResults.addEventListener('click', (e) => {
            const item = e.target.closest('.search-item');
            if (!item) return;
            const tz = item.dataset.zone;
            if (!savedZones.includes(tz)) {
                savedZones.push(tz);
                localStorage.setItem('xtime_zones', JSON.stringify(savedZones));
            }
            renderClock(tz);
            searchInput.value = '';
            searchResults.style.display = 'none';
        });

        // Klick außerhalb schließt Suche
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                searchResults.style.display = 'none';
            }
        });

        // Initiale Uhren aus localStorage
        savedZones.forEach(tz => renderClock(tz));

        // Alle Sekunde aktualisieren
        setInterval(updateAllClocks, 1000);

        // Anzeige-Offset bei Änderung
        updateAllClocks();
    </script>
</body>
</html>
