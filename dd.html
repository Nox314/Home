<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Doodle Jump Ultra</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050817;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10;
}

.top{
  display:flex;
  justify-content:space-between;
  padding:16px;
}

.panel{
  min-width:120px;
  padding:9px 14px;
  border-radius:16px;
  background:rgba(5,10,30,.55);
  border:1px solid rgba(255,255,255,.13);
  backdrop-filter:blur(10px);
  color:#fff;
}

.label{
  font-size:10px;
  color:#9da9ce;
  text-transform:uppercase;
  letter-spacing:2px;
}

.value{
  font-size:23px;
  font-weight:900;
  margin-top:2px;
}

#lives{
  position:fixed;
  top:76px;
  left:16px;
  padding:8px 13px;
  border-radius:14px;
  background:rgba(5,10,30,.55);
  color:#ff5c7c;
  font-size:20px;
}

#power{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  padding:8px 16px;
  border-radius:999px;
  background:rgba(5,10,30,.65);
  color:#fff;
  opacity:0;
  transition:.2s;
}

#power.show{
  opacity:1;
}

#combo{
  position:fixed;
  top:135px;
  left:50%;
  transform:translateX(-50%) scale(.7);
  color:#ffe66d;
  font-size:25px;
  font-weight:900;
  opacity:0;
  transition:.18s;
  text-shadow:0 0 20px #ffe66d;
}

#combo.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}

#pauseBtn{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  width:44px;
  height:44px;
  padding:0;
  border-radius:50%;
  background:rgba(5,10,30,.65);
  color:#fff;
  border:1px solid rgba(255,255,255,.15);
  z-index:20;
}

.overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.62);
  z-index:50;
}

.menu{
  width:min(520px,94vw);
  padding:35px;
  text-align:center;
  color:#fff;
  border-radius:28px;
  background:linear-gradient(
    145deg,
    rgba(19,29,70,.96),
    rgba(4,8,24,.97)
  );
  border:1px solid rgba(255,255,255,.13);
  box-shadow:0 30px 100px #0009;
  backdrop-filter:blur(20px);
}

.logo{
  font-size:clamp(45px,10vw,75px);
  font-weight:1000;
  letter-spacing:-5px;
  background:linear-gradient(
    135deg,
    #5ee7ff,
    #7165ff,
    #ff4fd8
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.subtitle{
  color:#aab5d4;
  margin:8px 0 28px;
}

button{
  border:0;
  border-radius:15px;
  padding:14px 25px;
  color:#fff;
  font-size:17px;
  font-weight:800;
  background:linear-gradient(
    135deg,
    #635cff,
    #b747ff
  );
  cursor:pointer;
  box-shadow:0 10px 30px #7065ff55;
}

button:active{
  transform:scale(.97);
}

.controls{
  margin-top:24px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  color:#8996bb;
  font-size:12px;
}

.control{
  padding:10px;
  border-radius:12px;
  background:#ffffff08;
}

.bigScore{
  font-size:48px;
  font-weight:900;
  margin:15px 0 25px;
}

.hidden{
  display:none!important;
}

#touch{
  position:fixed;
  bottom:20px;
  left:0;
  right:0;
  display:none;
  justify-content:space-between;
  padding:0 20px;
  z-index:30;
  pointer-events:none;
}

.touchBtn{
  width:76px;
  height:76px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  color:#fff;
  background:#ffffff15;
  border:1px solid #ffffff22;
  backdrop-filter:blur(10px);
  pointer-events:auto;
  user-select:none;
}

@media(pointer:coarse){
  #touch{
    display:flex;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div class="top">

    <div class="panel">
      <div class="label">Score</div>
      <div class="value" id="score">0</div>
    </div>

    <div class="panel">
      <div class="label">Best</div>
      <div class="value" id="best">0</div>
    </div>

  </div>

  <div id="lives">♥ ♥ ♥</div>
  <div id="power"></div>
  <div id="combo"></div>

</div>

<button id="pauseBtn" class="hidden">Ⅱ</button>

<!-- START -->

<div id="start" class="overlay">

  <div class="menu">

    <div class="logo">DOODLE</div>

    <div class="subtitle">
      Jump. Dodge. Collect. Survive.
    </div>

    <button id="startBtn">
      🚀 START GAME
    </button>

    <div class="controls">

      <div class="control">
        ← →<br>
        Bewegen
      </div>

      <div class="control">
        SPACE<br>
        Pause
      </div>

      <div class="control">
        📱<br>
        Touch
      </div>

    </div>

  </div>

</div>

<!-- PAUSE -->

<div id="pause" class="overlay hidden">

  <div class="menu">

    <div class="logo" style="font-size:52px">
      PAUSE
    </div>

    <div class="subtitle">
      Das Spiel wartet auf dich.
    </div>

    <button id="resume">
      ▶ WEITER
    </button>

  </div>

</div>

<!-- GAME OVER -->

<div id="gameover" class="overlay hidden">

  <div class="menu">

    <div class="logo" style="font-size:50px">
      GAME OVER
    </div>

    <div class="subtitle">
      Du bist gefallen.
    </div>

    <div class="bigScore" id="finalScore">
      0
    </div>

    <button id="restart">
      🔄 NOCHMAL
    </button>

  </div>

</div>

<!-- TOUCH -->

<div id="touch">

  <div class="touchBtn" id="left">
    ◀
  </div>

  <div class="touchBtn" id="right">
    ▶
  </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = 1;

function resize(){

  W = innerWidth;
  H = innerHeight;

  DPR =
    Math.min(
      devicePixelRatio || 1,
      2
    );

  canvas.width =
    W * DPR;

  canvas.height =
    H * DPR;

  canvas.style.width =
    W + "px";

  canvas.style.height =
    H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );
}

addEventListener(
  "resize",
  resize
);

resize();

/* =========================================================
   DOM
========================================================= */

const scoreEl =
  document.getElementById("score");

const bestEl =
  document.getElementById("best");

const livesEl =
  document.getElementById("lives");

const powerEl =
  document.getElementById("power");

const comboEl =
  document.getElementById("combo");

const startScreen =
  document.getElementById("start");

const pauseScreen =
  document.getElementById("pause");

const gameOverScreen =
  document.getElementById("gameover");

const pauseBtn =
  document.getElementById("pauseBtn");

const finalScore =
  document.getElementById("finalScore");

/* =========================================================
   AUDIO
========================================================= */

let audio = null;

function initAudio(){

  if(!audio){

    audio =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(audio.state === "suspended"){
    audio.resume();
  }
}

function beep(
  frequency,
  duration = .08,
  type = "sine",
  volume = .035
){

  if(!audio) return;

  const osc =
    audio.createOscillator();

  const gain =
    audio.createGain();

  osc.type = type;

  osc.frequency.value =
    frequency;

  gain.gain.setValueAtTime(
    volume,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audio.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audio.destination);

  osc.start();

  osc.stop(
    audio.currentTime +
    duration
  );
}

/* =========================================================
   INPUT
========================================================= */

const input = {
  left:false,
  right:false
};

addEventListener(
  "keydown",
  e => {

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      input.left = true;

    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      input.right = true;

    }

    if(e.code === "Space"){

      e.preventDefault();

      if(
        state === "playing" ||
        state === "paused"
      ){

        togglePause();

      }

    }

  }
);

addEventListener(
  "keyup",
  e => {

    if(
      e.key === "ArrowLeft" ||
      e.key.toLowerCase() === "a"
    ){

      input.left = false;

    }

    if(
      e.key === "ArrowRight" ||
      e.key.toLowerCase() === "d"
    ){

      input.right = false;

    }

  }
);

/* Touch */

function bindTouch(
  element,
  direction
){

  element.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      input[direction] = true;

    }
  );

  [
    "pointerup",
    "pointercancel",
    "pointerleave"
  ].forEach(event => {

    element.addEventListener(
      event,
      () => {
        input[direction] = false;
      }
    );

  });
}

bindTouch(
  document.getElementById("left"),
  "left"
);

bindTouch(
  document.getElementById("right"),
  "right"
);

/* =========================================================
   GAME STATE
========================================================= */

let state = "menu";

let score = 0;

let best =
  Number(
    localStorage.getItem(
      "doodleBest"
    ) || 0
  );

let lives = 3;

let combo = 0;

let comboTimer = 0;

let cameraY = 0;

let highestY = 0;

let gameTime = 0;

let difficulty = 1;

let lastTime = 0;

const WORLD_WIDTH = 2600;

/* =========================================================
   PLAYER
========================================================= */

const player = {

  x:0,
  y:0,

  w:42,
  h:48,

  vx:0,
  vy:0,

  maxSpeed:850,

  acceleration:4000,

  gravity:1900,

  jump:-850,

  rotation:0,

  squash:1,

  stretch:1,

  invincible:0,

  shield:0,

  jetpack:0,

  trail:[]

};

/* =========================================================
   OBJECT ARRAYS
========================================================= */

const platforms = [];
const coins = [];
const powerups = [];
const enemies = [];
const particles = [];
const stars = [];
const clouds = [];

/* =========================================================
   STAR FIELD
========================================================= */

for(
  let i = 0;
  i < 300;
  i++
){

  stars.push({

    x:
      Math.random() *
      WORLD_WIDTH,

    y:
      Math.random() *
      10000,

    size:
      Math.random() *
      2.3 +
      .4,

    alpha:
      Math.random() *
      .8 +
      .2,

    speed:
      Math.random() *
      .45 +
      .1

  });

}

/* =========================================================
   CLOUDS
========================================================= */

for(
  let i = 0;
  i < 50;
  i++
){

  clouds.push({

    x:
      Math.random() *
      WORLD_WIDTH,

    y:
      Math.random() *
      10000,

    scale:
      Math.random() *
      .7 +
      .4

  });

}

/* =========================================================
   HELPERS
========================================================= */

function rand(a,b){

  return Math.random() *
    (b-a) +
    a;

}

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(max,value)
  );

}

function lerp(
  a,
  b,
  t
){

  return a +
    (b-a) *
    t;

}

/* =========================================================
   PLATFORM GENERATION
========================================================= */

function createPlatform(
  y,
  forceNormal = false
){

  const width =
    rand(110,190);

  let type = "normal";

  if(!forceNormal){

    const r =
      Math.random();

    if(
      difficulty > 2 &&
      r < .11
    ){

      type = "break";

    }
    else if(
      difficulty > 1.3 &&
      r < .28
    ){

      type = "moving";

    }
    else if(
      r < .55
    ){

      type = "spring";

    }

  }

  platforms.push({

    x:
      rand(
        30,
        WORLD_WIDTH -
        width -
        30
      ),

    y,

    width,

    height:18,

    type,

    vx:
      type === "moving"
        ? rand(80,180) *
          (
            Math.random()<.5
              ? -1
              : 1
          )
        : 0,

    broken:false

  });

}

/* =========================================================
   COINS
========================================================= */

function spawnCoin(
  x,
  y
){

  coins.push({

    x,
    y,

    r:10,

    rot:
      Math.random() *
      Math.PI *
      2,

    collected:false

  });

}

/* =========================================================
   POWERUPS
========================================================= */

function spawnPowerup(
  x,
  y
){

  powerups.push({

    x,
    y,

    r:16,

    rot:0,

    type:
      Math.random()<.5
        ? "shield"
        : "jetpack",

    collected:false

  });

}

/* =========================================================
   ENEMIES
========================================================= */

function spawnEnemy(
  x,
  y
){

  enemies.push({

    x,
    y,

    w:44,
    h:44,

    vx:
      rand(70,160) *
      (
        Math.random()<.5
          ? -1
          : 1
      ),

    phase:
      Math.random() *
      Math.PI *
      2,

    dead:false

  });

}

/* =========================================================
   PARTICLES
========================================================= */

function burst(
  x,
  y,
  color,
  count = 15,
  speed = 250
){

  for(
    let i=0;
    i<count;
    i++
  ){

    const angle =
      Math.random() *
      Math.PI *
      2;

    const velocity =
      Math.random() *
      speed;

    particles.push({

      x,
      y,

      vx:
        Math.cos(angle) *
        velocity,

      vy:
        Math.sin(angle) *
        velocity,

      life:
        rand(.3,.8),

      max:.8,

      size:
        rand(2,6),

      color

    });

  }

}

/* =========================================================
   WORLD GENERATION
========================================================= */

function generateWorld(){

  platforms.length = 0;
  coins.length = 0;
  powerups.length = 0;
  enemies.length = 0;

  /*
    WICHTIG:
    Die erste Plattform befindet sich
    garantiert direkt unter dem Spieler.
  */

  const startY =
    H - 95;

  platforms.push({

    x:
      WORLD_WIDTH / 2 -
      125,

    y:startY,

    width:250,

    height:20,

    type:"normal",

    vx:0,

    broken:false

  });

  /*
    Spieler exakt über der
    Startplattform positionieren.
  */

  player.x =
    WORLD_WIDTH / 2 -
    player.w / 2;

  player.y =
    startY -
    player.h -
    4;

  player.vx = 0;

  player.vy =
    player.jump;

  highestY =
    startY;

  /*
    Weitere Plattformen oberhalb.
  */

  for(
    let i=0;
    i<50;
    i++
  ){

    highestY -=
      rand(
        120,
        190
      );

    createPlatform(
      highestY
    );

    const p =
      platforms[
        platforms.length-1
      ];

    /*
      Coins
    */

    if(
      Math.random() < .65
    ){

      spawnCoin(
        p.x +
        p.width / 2,

        p.y - 35
      );

    }

    /*
      Powerups
    */

    if(
      Math.random() < .045
    ){

      spawnPowerup(
        p.x +
        p.width / 2,

        p.y - 55
      );

    }

    /*
      Gegner nicht direkt am Start.
    */

    if(
      i > 5 &&
      difficulty > 1.2 &&
      Math.random() < .08
    ){

      spawnEnemy(

        rand(
          100,
          WORLD_WIDTH - 100
        ),

        p.y - 80

      );

    }

  }

}

/* =========================================================
   RESET
========================================================= */

function reset(){

  score = 0;

  lives = 3;

  combo = 0;

  comboTimer = 0;

  cameraY = 0;

  gameTime = 0;

  difficulty = 1;

  player.vx = 0;

  player.vy = 0;

  player.rotation = 0;

  player.squash = 1;

  player.stretch = 1;

  player.invincible = 0;

  player.shield = 0;

  player.jetpack = 0;

  player.trail = [];

  particles.length = 0;

  generateWorld();

  updateHUD();

}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  scoreEl.textContent =
    Math.floor(score);

  bestEl.textContent =
    Math.floor(best);

  livesEl.textContent =
    "♥ ".repeat(lives).trim();

  const powers = [];

  if(player.shield > 0){

    powers.push(
      `🛡️ Shield ${Math.ceil(
        player.shield
      )}s`
    );

  }

  if(player.jetpack > 0){

    powers.push(
      `🚀 Jetpack ${Math.ceil(
        player.jetpack
      )}s`
    );

  }

  powerEl.textContent =
    powers.join("   ");

  powerEl.classList.toggle(
    "show",
    powers.length > 0
  );

}

/* =========================================================
   START
========================================================= */

function startGame(){

  initAudio();

  reset();

  state = "playing";

  startScreen.classList.add(
    "hidden"
  );

  pauseScreen.classList.add(
    "hidden"
  );

  gameOverScreen.classList.add(
    "hidden"
  );

  pauseBtn.classList.remove(
    "hidden"
  );

}

/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

  if(state === "playing"){

    state = "paused";

    pauseScreen.classList.remove(
      "hidden"
    );

  }

  else if(
    state === "paused"
  ){

    state = "playing";

    pauseScreen.classList.add(
      "hidden"
    );

  }

}

/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

  state = "gameover";

  if(score > best){

    best =
      Math.floor(score);

    localStorage.setItem(
      "doodleBest",
      best
    );

  }

  finalScore.textContent =
    Math.floor(score);

  gameOverScreen.classList.remove(
    "hidden"
  );

  pauseBtn.classList.add(
    "hidden"
  );

  beep(
    100,
    .2,
    "sawtooth",
    .04
  );

}

/* =========================================================
   DAMAGE
========================================================= */

function damage(){

  if(
    player.invincible > 0 ||
    state !== "playing"
  ){

    return;

  }

  lives--;

  player.invincible = 2;

  burst(
    player.x +
      player.w / 2,

    player.y +
      player.h / 2,

    "#ff416c",

    35,

    350
  );

  beep(
    110,
    .15,
    "sawtooth",
    .04
  );

  if(lives <= 0){

    gameOver();

    return;

  }

  /*
    Respawn auf einer sicheren Position.
  */

  player.x =
    WORLD_WIDTH / 2 -
    player.w / 2;

  player.y =
    cameraY +
    H * .35;

  player.vx = 0;

  player.vy =
    player.jump;

}

/* =========================================================
   UPDATE
========================================================= */

function update(dt){

  if(state !== "playing")
    return;

  gameTime += dt;

  difficulty =
    1 +
    Math.min(
      6,
      score / 100
    );

  /* INPUT */

  let direction = 0;

  if(input.left)
    direction--;

  if(input.right)
    direction++;

  if(direction !== 0){

    player.vx +=
      direction *
      player.acceleration *
      dt;

  }
  else{

    player.vx *=
      Math.pow(
        .0008,
        dt
      );

  }

  player.vx =
    clamp(
      player.vx,
      -player.maxSpeed,
      player.maxSpeed
    );

  /* GRAVITY */

  let gravity =
    player.gravity;

  if(player.jetpack > 0){

    gravity *= .25;

    player.vy -=
      950 * dt;

    player.jetpack -= dt;

  }

  player.vy +=
    gravity * dt;

  const oldY =
    player.y;

  player.x +=
    player.vx * dt;

  player.y +=
    player.vy * dt;

  /* WORLD WRAP */

  if(
    player.x <
    -player.w
  ){

    player.x =
      WORLD_WIDTH;

  }

  if(
    player.x >
    WORLD_WIDTH
  ){

    player.x =
      -player.w;

  }

  /* ANIMATION */

  player.rotation =
    lerp(
      player.rotation,
      player.vx / 1500,
      dt * 8
    );

  player.squash =
    lerp(
      player.squash,
      1,
      dt * 10
    );

  player.stretch =
    lerp(
      player.stretch,
      1,
      dt * 10
    );

  /* TRAIL */

  if(
    Math.abs(
      player.vy
    ) > 300
  ){

    player.trail.push({

      x:
        player.x +
        player.w / 2,

      y:
        player.y +
        player.h / 2,

      life:.35

    });

  }

  for(
    let i =
      player.trail.length - 1;

    i >= 0;

    i--
  ){

    player.trail[i].life -= dt;

    if(
      player.trail[i].life <= 0
    ){

      player.trail.splice(
        i,
        1
      );

    }

  }

  /* PLATFORMS */

  for(
    const p of platforms
  ){

    if(
      p.type === "moving"
    ){

      p.x +=
        p.vx * dt;

      if(
        p.x < 20 ||
        p.x +
        p.width >
        WORLD_WIDTH - 20
      ){

        p.vx *= -1;

      }

    }

  }

  /* PLATFORM COLLISION */

  if(
    player.vy > 0
  ){

    for(
      const p of platforms
    ){

      if(p.broken)
        continue;

      const previousBottom =
        oldY +
        player.h;

      const currentBottom =
        player.y +
        player.h;

      if(

        player.x +
          player.w >
          p.x &&

        player.x <
          p.x +
          p.width &&

        previousBottom <=
          p.y &&

        currentBottom >=
          p.y

      ){

        player.y =
          p.y -
          player.h;

        if(
          p.type ===
          "spring"
        ){

          player.vy =
            player.jump *
            1.45;

          burst(
            player.x +
              player.w / 2,

            p.y,

            "#ffe66d",

            22,

            300
          );

          beep(
            850,
            .1,
            "square",
            .035
          );

        }
        else{

          player.vy =
            player.jump;

          beep(
            420,
            .06,
            "square",
            .025
          );

          setTimeout(
            () =>
              beep(
                650,
                .06,
                "square",
                .02
              ),
            30
          );

        }

        score +=
          1 +
          combo * .2;

        combo++;

        comboTimer = 2;

        if(combo >= 3){

          comboEl.textContent =
            `COMBO x${combo}`;

          comboEl.classList.add(
            "show"
          );

        }

        burst(
          player.x +
            player.w / 2,

          p.y,

          p.type === "break"
            ? "#ff765c"
            : "#65ff8c",

          12,

          180
        );

        if(
          p.type ===
          "break"
        ){

          p.broken = true;

          setTimeout(
            () => {

              const index =
                platforms.indexOf(p);

              if(index >= 0){

                platforms.splice(
                  index,
                  1
                );

              }

            },
            400
          );

        }

        break;

      }

    }

  }

  /* COMBO */

  if(
    comboTimer > 0
  ){

    comboTimer -= dt;

  }
  else{

    combo = 0;

    comboEl.classList.remove(
      "show"
    );

  }

  /* COINS */

  for(
    const c of coins
  ){

    if(c.collected)
      continue;

    c.rot +=
      dt * 5;

    const dx =
      player.x +
      player.w / 2 -
      c.x;

    const dy =
      player.y +
      player.h / 2 -
      c.y;

    if(
      Math.hypot(
        dx,
        dy
      ) <
      c.r +
      player.w / 2
    ){

      c.collected = true;

      score += 10;

      burst(
        c.x,
        c.y,
        "#ffe66d",
        18,
        250
      );

      beep(
        900,
        .06,
        "sine",
        .035
      );

      setTimeout(
        () =>
          beep(
            1300,
            .08,
            "sine",
            .025
          ),
        40
      );

    }

  }

  /* POWERUPS */

  for(
    const p of powerups
  ){

    if(p.collected)
      continue;

    p.rot +=
      dt * 3;

    const dx =
      player.x +
      player.w / 2 -
      p.x;

    const dy =
      player.y +
      player.h / 2 -
      p.y;

    if(
      Math.hypot(
        dx,
        dy
      ) <
      p.r +
      player.w / 2
    ){

      p.collected = true;

      if(
        p.type ===
        "shield"
      ){

        player.shield = 8;

        score += 25;

        burst(
          p.x,
          p.y,
          "#42d9ff",
          25,
          300
        );

        beep(
          600,
          .15,
          "sine",
          .04
        );

      }
      else{

        player.jetpack = 5;

        score += 30;

        burst(
          p.x,
          p.y,
          "#ff9238",
          25,
          300
        );

        beep(
          250,
          .2,
          "sawtooth",
          .035
        );

      }

    }

  }

  /* POWER TIMERS */

  if(
    player.shield > 0
  ){

    player.shield -= dt;

  }

  if(
    player.invincible > 0
  ){

    player.invincible -= dt;

  }

  /* ENEMIES */

  for(
    const e of enemies
  ){

    if(e.dead)
      continue;

    e.x +=
      e.vx * dt;

    e.phase +=
      dt * 5;

    e.y +=
      Math.sin(
        e.phase
      ) *
      20 *
      dt;

    if(
      e.x < 0 ||
      e.x +
        e.w >
        WORLD_WIDTH
    ){

      e.vx *= -1;

    }

    if(
      player.invincible <= 0 &&
      player.x < e.x + e.w &&
      player.x + player.w > e.x &&
      player.y < e.y + e.h &&
      player.y + player.h > e.y
    ){

      if(
        player.shield > 0
      ){

        player.shield = 0;

        e.dead = true;

        burst(
          e.x +
            e.w / 2,

          e.y +
            e.h / 2,

          "#42d9ff",

          30,

          350
        );

        beep(
          1200,
          .12,
          "square",
          .04
        );

      }
      else{

        damage();

      }

    }

  }

  /* CAMERA */

  const targetCamera =
    player.y -
    H * .43;

  cameraY =
    lerp(
      cameraY,
      targetCamera,
      1 -
      Math.pow(
        .001,
        dt
      )
    );

  /* GENERATE WORLD */

  const worldTop =
    cameraY -
    500;

  while(
    highestY >
    worldTop
  ){

    highestY -=
      rand(
        120,
        Math.max(
          145,
          225 -
          difficulty * 10
        )
      );

    createPlatform(
      highestY
    );

    const p =
      platforms[
        platforms.length - 1
      ];

    if(
      Math.random() < .65
    ){

      spawnCoin(
        p.x +
          p.width / 2,

        p.y - 35
      );

    }

    if(
      Math.random() < .045
    ){

      spawnPowerup(
        p.x +
          p.width / 2,

        p.y - 55
      );

    }

    if(
      difficulty > 1.2 &&
      Math.random() < .1
    ){

      spawnEnemy(

        rand(
          100,
          WORLD_WIDTH - 100
        ),

        highestY - 80

      );

    }

  }

  /* CLEANUP */

  for(
    let i =
      platforms.length - 1;

    i >= 0;

    i--
  ){

    if(
      platforms[i].y >
      cameraY +
      H +
      500
    ){

      platforms.splice(
        i,
        1
      );

    }

  }

  for(
    let i =
      coins.length - 1;

    i >= 0;

    i--
  ){

    if(
      coins[i].collected ||
      coins[i].y >
      cameraY +
      H +
      500
    ){

      coins.splice(
        i,
        1
      );

    }

  }

  for(
    let i =
      powerups.length - 1;

    i >= 0;

    i--
  ){

    if(
      powerups[i].collected ||
      powerups[i].y >
      cameraY +
      H +
      500
    ){

      powerups.splice(
        i,
        1
      );

    }

  }

  for(
    let i =
      enemies.length - 1;

    i >= 0;

    i--
  ){

    if(
      enemies[i].dead ||
      enemies[i].y >
      cameraY +
      H +
      500
    ){

      enemies.splice(
        i,
        1
      );

    }

  }

  /* PARTICLES */

  for(
    let i =
      particles.length - 1;

    i >= 0;

    i--
  ){

    const p =
      particles[i];

    p.life -= dt;

    p.x +=
      p.vx * dt;

    p.y +=
      p.vy * dt;

    p.vy +=
      500 * dt;

    if(
      p.life <= 0
    ){

      particles.splice(
        i,
        1
      );

    }

  }

  /* FALL */

  if(
    player.y >
    cameraY +
    H +
    200
  ){

    damage();

  }

  updateHUD();

}

/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  gradient.addColorStop(
    0,
    "#05091f"
  );

  gradient.addColorStop(
    .5,
    "#101d4e"
  );

  gradient.addColorStop(
    1,
    "#35134d"
  );

  ctx.fillStyle =
    gradient;

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  /* STARS */

  for(
    const s of stars
  ){

    const y =
      s.y -
      cameraY *
      s.speed;

    if(
      y < -10 ||
      y > H + 10
    )
      continue;

    ctx.globalAlpha =
      s.alpha *
      (
        .65 +
        Math.sin(
          gameTime * 2 +
          s.x
        ) *
        .35
      );

    ctx.fillStyle =
      "#fff";

    ctx.beginPath();

    ctx.arc(
      s.x,
      y,
      s.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

  ctx.globalAlpha = 1;

  /* MOON */

  const moonX =
    W * .8;

  const moonY =
    125;

  const glow =
    ctx.createRadialGradient(
      moonX,
      moonY,
      10,
      moonX,
      moonY,
      140
    );

  glow.addColorStop(
    0,
    "rgba(160,190,255,.3)"
  );

  glow.addColorStop(
    1,
    "rgba(160,190,255,0)"
  );

  ctx.fillStyle =
    glow;

  ctx.fillRect(
    moonX - 150,
    moonY - 150,
    300,
    300
  );

  ctx.fillStyle =
    "#e9efff";

  ctx.beginPath();

  ctx.arc(
    moonX,
    moonY,
    42,
    0,
    Math.PI * 2
  );

  ctx.fill();

}

/* =========================================================
   CLOUDS
========================================================= */

function drawClouds(){

  for(
    const c of clouds
  ){

    const y =
      c.y -
      cameraY *
      .35;

    if(
      y < -200 ||
      y > H + 200
    )
      continue;

    ctx.save();

    ctx.translate(
      c.x,
      y
    );

    ctx.scale(
      c.scale,
      c.scale
    );

    ctx.fillStyle =
      "rgba(255,255,255,.05)";

    ctx.beginPath();

    ctx.arc(
      0,
      20,
      35,
      0,
      Math.PI * 2
    );

    ctx.arc(
      40,
      5,
      50,
      0,
      Math.PI * 2
    );

    ctx.arc(
      85,
      20,
      35,
      0,
      Math.PI * 2
    );

    ctx.fill();

    ctx.restore();

  }

}

/* =========================================================
   PLATFORM DRAW
========================================================= */

function drawPlatform(p){

  const y =
    p.y -
    cameraY;

  if(
    y < -60 ||
    y > H + 60
  )
    return;

  const color =
    p.type === "moving"
      ? "#35d7ff"
      : p.type === "spring"
        ? "#ffe66d"
        : p.type === "break"
          ? "#ff765c"
          : "#63e67a";

  ctx.shadowColor =
    color;

  ctx.shadowBlur =
    15;

  ctx.fillStyle =
    color;

  ctx.beginPath();

  ctx.roundRect(
    p.x,
    y,
    p.width,
    p.height,
    8
  );

  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.fillStyle =
    "rgba(255,255,255,.35)";

  ctx.fillRect(
    p.x + 8,
    y + 3,
    p.width - 16,
    3
  );

  if(
    p.type === "spring"
  ){

    ctx.strokeStyle =
      "#fff4a3";

    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
      p.x +
      p.width / 2 -
      20,
      y - 5
    );

    ctx.lineTo(
      p.x +
      p.width / 2 -
      8,
      y - 13
    );

    ctx.lineTo(
      p.x +
      p.width / 2 +
      4,
      y - 5
    );

    ctx.lineTo(
      p.x +
      p.width / 2 +
      16,
      y - 13
    );

    ctx.stroke();

  }

  if(
    p.type === "break"
  ){

    ctx.strokeStyle =
      "rgba(80,20,20,.5)";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
      p.x + 20,
      y + 3
    );

    ctx.lineTo(
      p.x + 45,
      y + 15
    );

    ctx.lineTo(
      p.x + 65,
      y + 4
    );

    ctx.moveTo(
      p.x + 80,
      y + 4
    );

    ctx.lineTo(
      p.x + 105,
      y + 15
    );

    ctx.stroke();

  }

}

/* =========================================================
   COIN DRAW
========================================================= */

function drawCoin(c){

  if(c.collected)
    return;

  const y =
    c.y -
    cameraY;

  if(
    y < -50 ||
    y > H + 50
  )
    return;

  const scale =
    Math.max(
      .15,
      Math.abs(
        Math.cos(c.rot)
      )
    );

  ctx.save();

  ctx.translate(
    c.x,
    y
  );

  ctx.scale(
    scale,
    1
  );

  ctx.shadowColor =
    "#ffe66d";

  ctx.shadowBlur =
    20;

  ctx.fillStyle =
    "#ffd83d";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    c.r,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.fillStyle =
    "#fff1a8";

  ctx.beginPath();

  ctx.arc(
    -3,
    -3,
    4,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.restore();

}

/* =========================================================
   POWERUP DRAW
========================================================= */

function drawPowerup(p){

  if(p.collected)
    return;

  const y =
    p.y -
    cameraY;

  if(
    y < -70 ||
    y > H + 70
  )
    return;

  const color =
    p.type === "shield"
      ? "#42d9ff"
      : "#ff9238";

  ctx.save();

  ctx.translate(
    p.x,
    y
  );

  ctx.rotate(
    p.rot
  );

  ctx.shadowColor =
    color;

  ctx.shadowBlur =
    25;

  ctx.fillStyle =
    color;

  ctx.beginPath();

  ctx.moveTo(
    0,
    -p.r
  );

  ctx.lineTo(
    p.r,
    0
  );

  ctx.lineTo(
    0,
    p.r
  );

  ctx.lineTo(
    -p.r,
    0
  );

  ctx.closePath();

  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.fillStyle =
    "#fff";

  ctx.font =
    "bold 18px Arial";

  ctx.textAlign =
    "center";

  ctx.textBaseline =
    "middle";

  ctx.fillText(
    p.type === "shield"
      ? "S"
      : "J",
    0,
    0
  );

  ctx.restore();

}

/* =========================================================
   ENEMY DRAW
========================================================= */

function drawEnemy(e){

  if(e.dead)
    return;

  const y =
    e.y -
    cameraY;

  if(
    y < -70 ||
    y > H + 70
  )
    return;

  ctx.save();

  ctx.translate(
    e.x,
    y
  );

  ctx.shadowColor =
    "#ff3864";

  ctx.shadowBlur =
    18;

  ctx.fillStyle =
    "#ff3864";

  ctx.beginPath();

  ctx.arc(
    22,
    22,
    21,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.shadowBlur = 0;

  /* Eyes */

  ctx.fillStyle =
    "#fff";

  ctx.beginPath();

  ctx.arc(
    14,
    16,
    7,
    0,
    Math.PI * 2
  );

  ctx.arc(
    30,
    16,
    7,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle =
    "#15152a";

  ctx.beginPath();

  ctx.arc(
    15,
    17,
    3,
    0,
    Math.PI * 2
  );

  ctx.arc(
    31,
    17,
    3,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* Teeth */

  ctx.fillStyle =
    "#fff";

  ctx.fillRect(
    14,
    29,
    6,
    7
  );

  ctx.fillRect(
    24,
    29,
    6,
    7
  );

  ctx.restore();

}

/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer(){

  const y =
    player.y -
    cameraY;

  /* TRAIL */

  for(
    const t of player.trail
  ){

    ctx.globalAlpha =
      t.life /
      .35 *
      .25;

    ctx.fillStyle =
      "#ff4f81";

    ctx.beginPath();

    ctx.arc(
      t.x,
      t.y - cameraY,
      10 * t.life,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

  ctx.globalAlpha = 1;

  ctx.save();

  ctx.translate(
    player.x +
      player.w / 2,

    y +
      player.h / 2
  );

  ctx.rotate(
    player.rotation
  );

  const flip =
    player.vx < -20
      ? -1
      : 1;

  ctx.scale(
    flip *
      player.squash,

    player.stretch
  );

  /* SHIELD */

  if(
    player.shield > 0
  ){

    const pulse =
      1 +
      Math.sin(
        gameTime * 8
      ) *
      .06;

    ctx.save();

    ctx.scale(
      pulse,
      pulse
    );

    ctx.strokeStyle =
      "rgba(66,217,255,.9)";

    ctx.lineWidth = 5;

    ctx.shadowColor =
      "#42d9ff";

    ctx.shadowBlur =
      25;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      35,
      0,
      Math.PI * 2
    );

    ctx.stroke();

    ctx.restore();

  }

  /* BODY */

  ctx.shadowColor =
    "#ff416c";

  ctx.shadowBlur =
    20;

  ctx.fillStyle =
    player.invincible > 0 &&
    Math.floor(
      gameTime * 15
    ) % 2 === 0
      ? "#fff"
      : "#ff416c";

  ctx.beginPath();

  ctx.roundRect(
    -21,
    -24,
    42,
    48,
    12
  );

  ctx.fill();

  ctx.shadowBlur = 0;

  /* EYES */

  ctx.fillStyle =
    "#fff";

  ctx.beginPath();

  ctx.arc(
    -8,
    -6,
    6,
    0,
    Math.PI * 2
  );

  ctx.arc(
    8,
    -6,
    6,
    0,
    Math.PI * 2
  );

  ctx.fill();

  ctx.fillStyle =
    "#19152b";

  ctx.beginPath();

  ctx.arc(
    -7,
    -5,
    3,
    0,
    Math.PI * 2
  );

  ctx.arc(
    9,
    -5,
    3,
    0,
    Math.PI * 2
  );

  ctx.fill();

  /* SMILE */

  ctx.strokeStyle =
    "#19152b";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.arc(
    0,
    4,
    10,
    0,
    Math.PI
  );

  ctx.stroke();

  /* JETPACK */

  if(
    player.jetpack > 0
  ){

    ctx.fillStyle =
      "#596579";

    ctx.fillRect(
      -29,
      -7,
      8,
      25
    );

    ctx.fillRect(
      21,
      -7,
      8,
      25
    );

    ctx.fillStyle =
      "#ffad32";

    ctx.shadowColor =
      "#ff6a00";

    ctx.shadowBlur =
      15;

    ctx.beginPath();

    ctx.moveTo(
      -25,
      18
    );

    ctx.lineTo(
      -29,
      40 +
      Math.random() * 8
    );

    ctx.lineTo(
      -20,
      18
    );

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(
      25,
      18
    );

    ctx.lineTo(
      21,
      40 +
      Math.random() * 8
    );

    ctx.lineTo(
      30,
      18
    );

    ctx.fill();

  }

  ctx.restore();

}

/* =========================================================
   PARTICLES DRAW
========================================================= */

function drawParticles(){

  for(
    const p of particles
  ){

    ctx.globalAlpha =
      Math.max(
        0,
        p.life /
        p.max
      );

    ctx.fillStyle =
      p.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y - cameraY,
      p.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

  }

  ctx.globalAlpha = 1;

}

/* =========================================================
   DRAW
========================================================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  drawBackground();

  drawClouds();

  for(
    const p of platforms
  ){

    drawPlatform(p);

  }

  for(
    const c of coins
  ){

    drawCoin(c);

  }

  for(
    const p of powerups
  ){

    drawPowerup(p);

  }

  for(
    const e of enemies
  ){

    drawEnemy(e);

  }

  drawParticles();

  drawPlayer();

}

/* =========================================================
   GAME LOOP
========================================================= */

function loop(timestamp){

  if(!lastTime)
    lastTime = timestamp;

  let dt =
    (timestamp -
      lastTime) /
    1000;

  lastTime =
    timestamp;

  dt =
    Math.min(
      dt,
      .033
    );

  update(dt);

  draw();

  requestAnimationFrame(
    loop
  );

}

/* =========================================================
   BUTTONS
========================================================= */

document
  .getElementById("startBtn")
  .addEventListener(
    "click",
    startGame
  );

document
  .getElementById("restart")
  .addEventListener(
    "click",
    startGame
  );

document
  .getElementById("resume")
  .addEventListener(
    "click",
    togglePause
  );

pauseBtn.addEventListener(
  "click",
  togglePause
);

/* =========================================================
   MOUSE CONTROL
========================================================= */

canvas.addEventListener(
  "pointermove",
  e => {

    if(
      e.pointerType !== "mouse" ||
      state !== "playing"
    ){

      return;

    }

    const dx =
      e.clientX -
      W / 2;

    if(
      Math.abs(dx) < 35
    ){

      input.left = false;
      input.right = false;

    }
    else if(
      dx < 0
    ){

      input.left = true;
      input.right = false;

    }
    else{

      input.right = true;
      input.left = false;

    }

  }
);

canvas.addEventListener(
  "pointerleave",
  () => {

    input.left = false;
    input.right = false;

  }
);

/* =========================================================
   INITIALIZATION
========================================================= */

bestEl.textContent =
  best;

reset();

requestAnimationFrame(
  loop
);
</script>

</body>
</html>
