<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chrome Dino - Playable (dino.html)</title>
  <style>
    :root{--bg:#f7f7f7;--ground:#f2f2f2;--dino:#222;--ob:#2b7a2b}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:Inter,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial}
    .wrap{width:900px;max-width:95%;}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    h1{font-size:16px;margin:0}
    .hint{color:#555;font-size:13px}
    canvas{width:100%;background:linear-gradient(#fff,#fff);border:1px solid #e6e6e6;display:block}
    .footer{margin-top:8px;color:#666;font-size:13px}
    .controls{margin-top:6px;color:#444;font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Chrome Dino - Playable (dino.html)</h1>
      <div class="hint">Space / Up = jump • R = restart • Click canvas to jump</div>
    </header>
    <canvas id="game" width="900" height="200" aria-label="Chrome Dino clone game"></canvas>
    <div class="controls">Score: <span id="score">0</span> • Highscore: <span id="high">0</span></div>
    <div class="footer">This is a lightweight clone for playing the offline dinosaur runner in your browser.</div>
  </div>

  <script>
    // Simple Chrome Dino-like runner using canvas
    (function(){
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score');
      const highEl = document.getElementById('high');

      // logical size (so resizing the canvas CSS doesn't change coordinates)
      const W = canvas.width;
      const H = canvas.height;

      // Game state
      let dino, obstacles, speed, spawnTimer, score, highscore, running, lastTime;

      function reset(){
        dino = {x:60, y:H-40, w:44, h:44, vy:0, onGround:true};
        obstacles = [];
        speed = 6;
        spawnTimer = 0;
        score = 0;
        running = true;
        lastTime = performance.now();
        highscore = Number(localStorage.getItem('dino-high')) || 0;
        highEl.textContent = highscore;
      }

      function spawnObstacle(){
        // random width and gap
        const w = 12 + Math.random()*18;
        const h = 20 + Math.random()*30;
        obstacles.push({x:W + 10, y:H-20-h, w:w, h:h});
      }

      function update(dt){
        if(!running) return;
        // speed up slowly
        speed += dt * 0.001; // slow acceleration

        // Dino physics
        const gravity = 0.0016 * dt;
        if(!dino.onGround){
          dino.vy += gravity;
          dino.y += dino.vy * dt;
          if(dino.y >= H-40){ dino.y = H-40; dino.vy = 0; dino.onGround = true; }
        }

        // Obstacles
        for(let i=obstacles.length-1;i>=0;i--){
          obstacles[i].x -= speed * (dt/16);
          // remove off screen
          if(obstacles[i].x + obstacles[i].w < -50) obstacles.splice(i,1);
        }

        // spawn logic
        spawnTimer -= dt;
        if(spawnTimer <= 0){
          spawnObstacle();
          // spawn in 700-1400ms scaled by speed
          spawnTimer = 700 + Math.random()*800 - Math.min(400, speed*10);
        }

        // collision
        for(const ob of obstacles){
          if(rectsCollide(dino.x, dino.y, dino.w, dino.h, ob.x, ob.y, ob.w, ob.h)){
            running = false;
            // update highscore
            if(score > highscore){ highscore = score; localStorage.setItem('dino-high', String(Math.floor(highscore))); highEl.textContent = Math.floor(highscore); }
          }
        }

        // score
        score += dt * 0.05; // increase by time
        scoreEl.textContent = Math.floor(score);
      }

      function rectsCollide(ax,ay,aw,ah,bx,by,bw,bh){
        return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
      }

      function draw(){
        // clear
        ctx.clearRect(0,0,W,H);
        // sky
        ctx.fillStyle = '#fff';
        ctx.fillRect(0,0,W,H);

        // ground line
        ctx.fillStyle = '#ddd';
        ctx.fillRect(0,H-20,W,20);

        // dino (simple rectangle with eye)
        ctx.fillStyle = '#333';
        ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
        // eye
        ctx.fillStyle = '#fff';
        ctx.fillRect(dino.x + dino.w - 12, dino.y + 8, 6, 6);

        // obstacles
        ctx.fillStyle = '#2b7a2b';
        for(const ob of obstacles){
          ctx.fillRect(Math.round(ob.x), Math.round(ob.y), Math.round(ob.w), Math.round(ob.h));
        }

        // game over text
        if(!running){
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.font = 'bold 28px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER — Press R or Click to Restart', W/2, H/2);
        }
      }

      function loop(now){
        const dt = Math.min(40, now - lastTime);
        lastTime = now;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }

      // controls
      function jump(){
        if(!running){ reset(); return; }
        if(dino.onGround){ dino.vy = -0.48; dino.onGround = false; }
      }

      document.addEventListener('keydown', (e)=>{
        if(e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); jump(); }
        if(e.key === 'r' || e.key === 'R'){ reset(); }
      });

      canvas.addEventListener('click', ()=>{ if(!running) reset(); else jump(); });

      // touch support
      canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); if(!running) reset(); else jump(); }, {passive:false});

      // init
      reset();
      requestAnimationFrame(loop);

      // expose for debugging
      window._dinoGame = {reset: reset};
    })();
  </script>
</body>
</html>
