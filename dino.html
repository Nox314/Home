<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chrome Dino Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      position: relative;
      width: 100%;
      max-width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    canvas {
      display: block;
      border: none;
      background: #f7f7f7;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    .info {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 14px;
      color: #555;
    }

    .game-over {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 100;
      pointer-events: none;
    }

    .game-over.show {
      display: block;
    }

    .game-over-text {
      font-size: 32px;
      font-weight: bold;
      color: #333;
      margin-bottom: 10px;
    }

    .restart-hint {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="info">
      <span>Press SPACE or UP ARROW to jump • R to restart</span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div class="game-over" id="gameOver">
      <div class="game-over-text">GAME OVER</div>
      <div class="restart-hint">Press R or click to restart</div>
    </div>
  </div>

  <script>
    class DinoGame {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.gameOverElement = document.getElementById('gameOver');

        // Set canvas size to window size
        this.resizeCanvas();
        window.addEventListener('resize', () => this.resizeCanvas());

        // Game constants
        this.GRAVITY = 0.6;
        this.DINO_START_X = 50;
        this.DINO_START_Y = 0;
        this.GROUND_Y = this.canvas.height - 60;
        this.DINO_WIDTH = 44;
        this.DINO_HEIGHT = 47;
        this.GROUND_HEIGHT = 12;

        this.gameState = {
          score: 0,
          highScore: this.loadHighScore(),
          gameOver: false,
          running: true,
          distance: 0
        };

        this.dino = {
          x: this.DINO_START_X,
          y: this.GROUND_Y,
          width: this.DINO_WIDTH,
          height: this.DINO_HEIGHT,
          velocityY: 0,
          jumping: false,
          jumpPower: 16,
          grounded: true,
          running: true,
          runningCycle: 0
        };

        this.obstacles = [];
        this.clouds = [];
        this.gameSpeed = 6;
        this.spawnRate = 0.7;
        this.spawnCounter = 0;
        this.lastTime = Date.now();

        // Generate initial clouds
        for (let i = 0; i < 3; i++) {
          this.clouds.push({
            x: Math.random() * this.canvas.width,
            y: Math.random() * (this.canvas.height * 0.3) + 50,
            width: 46,
            height: 27
          });
        }

        this.init();
      }

      resizeCanvas() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
        this.GROUND_Y = this.canvas.height - 60;
      }

      init() {
        this.gameState.score = 0;
        this.gameState.gameOver = false;
        this.gameState.running = true;
        this.gameSpeed = 6;
        this.spawnCounter = 0;

        this.dino = {
          x: this.DINO_START_X,
          y: this.GROUND_Y,
          width: this.DINO_WIDTH,
          height: this.DINO_HEIGHT,
          velocityY: 0,
          jumping: false,
          jumpPower: 16,
          grounded: true,
          running: true,
          runningCycle: 0
        };

        this.obstacles = [];
        this.gameOverElement.classList.remove('show');
        this.lastTime = Date.now();
        this.gameLoop();
      }

      loadHighScore() {
        return parseInt(localStorage.getItem('dinoHighScore') || '0');
      }

      saveHighScore() {
        localStorage.setItem('dinoHighScore', this.gameState.highScore);
      }

      update() {
        if (!this.gameState.running) return;

        const currentTime = Date.now();
        const deltaTime = currentTime - this.lastTime;
        this.lastTime = currentTime;

        // Update game speed
        this.gameSpeed += 0.00002 * deltaTime;

        // Update score
        this.gameState.score += 0.0167 * this.gameSpeed;
        this.gameState.distance += this.gameSpeed * 0.016;

        // Update high score threshold for speed increase
        if (this.gameState.distance > 500 && this.gameSpeed < 15) {
          this.gameSpeed = 15;
        }

        // Update dino
        this.updateDino();

        // Update obstacles
        this.updateObstacles();

        // Update clouds
        this.updateClouds();

        // Spawn obstacles
        this.spawnCounter += deltaTime * 0.001;
        if (this.spawnCounter > this.spawnRate) {
          this.spawnObstacle();
          this.spawnRate = 0.5 + Math.random() * 0.5;
          this.spawnCounter = 0;
        }

        // Check collision
        this.checkCollision();
      }

      updateDino() {
        if (!this.dino.grounded) {
          this.dino.velocityY += this.GRAVITY;
          this.dino.y += this.dino.velocityY;

          if (this.dino.y >= this.GROUND_Y) {
            this.dino.y = this.GROUND_Y;
            this.dino.velocityY = 0;
            this.dino.grounded = true;
            this.dino.jumping = false;
          }
        }

        // Update running animation
        if (this.dino.grounded && this.dino.running) {
          this.dino.runningCycle += 0.2;
          if (this.dino.runningCycle > 2) {
            this.dino.runningCycle = 0;
          }
        }
      }

      updateObstacles() {
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
          this.obstacles[i].x -= this.gameSpeed;

          if (this.obstacles[i].x + this.obstacles[i].width < 0) {
            this.obstacles.splice(i, 1);
          }
        }
      }

      updateClouds() {
        for (let i = 0; i < this.clouds.length; i++) {
          this.clouds[i].x -= this.gameSpeed * 0.1;

          if (this.clouds[i].x + this.clouds[i].width < 0) {
            this.clouds[i].x = this.canvas.width;
            this.clouds[i].y = Math.random() * (this.canvas.height * 0.3) + 50;
          }
        }
      }

      spawnObstacle() {
        const type = Math.random() > 0.5 ? 'cactus' : 'pterodactyl';
        const variations = {
          cactus: [
            { width: 17, height: 35, type: 'small' },
            { width: 34, height: 35, type: 'medium' },
            { width: 51, height: 35, type: 'large' }
          ],
          pterodactyl: [
            { width: 46, height: 40, type: 'normal' }
          ]
        };

        const typeVariations = variations[type];
        const variation = typeVariations[Math.floor(Math.random() * typeVariations.length)];

        const y = type === 'pterodactyl' ? this.GROUND_Y - 60 : this.GROUND_Y - variation.height;

        this.obstacles.push({
          x: this.canvas.width,
          y: y,
          width: variation.width,
          height: variation.height,
          type: type,
          variation: variation.type,
          flying: type === 'pterodactyl'
        });
      }

      checkCollision() {
        for (const obstacle of this.obstacles) {
          if (this.isColliding(this.dino, obstacle)) {
            this.gameState.running = false;
            this.gameState.gameOver = true;

            if (this.gameState.score > this.gameState.highScore) {
              this.gameState.highScore = Math.floor(this.gameState.score);
              this.saveHighScore();
            }

            this.gameOverElement.classList.add('show');
            return;
          }
        }
      }

      isColliding(dino, obstacle) {
        return (
          dino.x < obstacle.x + obstacle.width &&
          dino.x + dino.width > obstacle.x &&
          dino.y < obstacle.y + obstacle.height &&
          dino.y + dino.height > obstacle.y
        );
      }

      jump() {
        if (!this.gameState.running) {
          this.init();
          return;
        }

        if (this.dino.grounded && !this.dino.jumping) {
          this.dino.velocityY = -this.dino.jumpPower;
          this.dino.grounded = false;
          this.dino.jumping = true;
        }
      }

      draw() {
        // Clear canvas
        this.ctx.fillStyle = '#f7f7f7';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        // Draw clouds
        this.drawClouds();

        // Draw score
        this.drawScore();

        // Draw ground
        this.drawGround();

        // Draw obstacles
        this.drawObstacles();

        // Draw dino
        this.drawDino();
      }

      drawGround() {
        this.ctx.fillStyle = '#ccc';
        this.ctx.fillRect(0, this.GROUND_Y + this.DINO_HEIGHT, this.canvas.width, this.GROUND_HEIGHT);

        // Ground pattern
        this.ctx.strokeStyle = '#bbb';
        this.ctx.lineWidth = 1;
        this.ctx.setLineDash([20, 20]);
        this.ctx.beginPath();
        this.ctx.moveTo(0, this.GROUND_Y + this.DINO_HEIGHT);
        this.ctx.lineTo(this.canvas.width, this.GROUND_Y + this.DINO_HEIGHT);
        this.ctx.stroke();
        this.ctx.setLineDash([]);
      }

      drawDino() {
        const x = this.dino.x;
        const y = this.dino.y;

        this.ctx.fillStyle = '#535353';

        if (this.dino.jumping) {
          // Jumping pose
          this.ctx.fillRect(x + 9, y + 8, 26, 18);  // body
          this.ctx.fillRect(x + 9, y + 8, 3, 18);   // front leg
          this.ctx.fillRect(x + 32, y + 22, 3, 4);  // back leg
          this.ctx.fillRect(x + 39, y, 5, 8);       // neck
          this.ctx.fillRect(x + 38, y, 6, 6);       // head
          this.ctx.fillRect(x + 44, y + 3, 4, 4);   // nose
        } else {
          // Running pose with animation
          const cycle = Math.floor(this.dino.runningCycle);

          // Body
          this.ctx.fillRect(x + 9, y + 8, 26, 18);

          // Legs (alternating)
          if (cycle === 0) {
            this.ctx.fillRect(x + 9, y + 26, 3, 13);    // front leg down
            this.ctx.fillRect(x + 32, y + 28, 3, 11);   // back leg up
          } else {
            this.ctx.fillRect(x + 9, y + 28, 3, 11);    // front leg up
            this.ctx.fillRect(x + 32, y + 26, 3, 13);   // back leg down
          }

          // Neck
          this.ctx.fillRect(x + 39, y + 3, 5, 8);

          // Head
          this.ctx.fillRect(x + 38, y, 6, 6);

          // Eye
          this.ctx.fillStyle = '#fff';
          this.ctx.fillRect(x + 42, y + 1, 2, 2);

          // Nose
          this.ctx.fillStyle = '#535353';
          this.ctx.fillRect(x + 44, y + 3, 4, 4);
        }
      }

      drawObstacles() {
        for (const obstacle of this.obstacles) {
          if (obstacle.type === 'cactus') {
            this.drawCactus(obstacle);
          } else if (obstacle.type === 'pterodactyl') {
            this.drawPterodactyl(obstacle);
          }
        }
      }

      drawCactus(obstacle) {
        this.ctx.fillStyle = '#535353';

        if (obstacle.variation === 'small') {
          this.ctx.fillRect(obstacle.x + 5, obstacle.y + 10, 7, 25);
          this.ctx.fillRect(obstacle.x, obstacle.y + 15, 5, 8);
          this.ctx.fillRect(obstacle.x + 12, obstacle.y + 15, 5, 8);
        } else if (obstacle.variation === 'medium') {
          this.ctx.fillRect(obstacle.x + 10, obstacle.y + 10, 7, 25);
          this.ctx.fillRect(obstacle.x + 5, obstacle.y + 15, 5, 8);
          this.ctx.fillRect(obstacle.x + 17, obstacle.y + 15, 5, 8);
          this.ctx.fillRect(obstacle.x + 30, obstacle.y + 20, 5, 8);
        } else {
          this.ctx.fillRect(obstacle.x + 15, obstacle.y + 10, 7, 25);
          this.ctx.fillRect(obstacle.x + 8, obstacle.y + 15, 5, 8);
          this.ctx.fillRect(obstacle.x + 22, obstacle.y + 15, 5, 8);
          this.ctx.fillRect(obstacle.x + 5, obstacle.y + 20, 5, 8);
          this.ctx.fillRect(obstacle.x + 35, obstacle.y + 20, 5, 8);
        }
      }

      drawPterodactyl(obstacle) {
        this.ctx.fillStyle = '#535353';

        // Body
        this.ctx.fillRect(obstacle.x + 10, obstacle.y + 12, 20, 12);

        // Head
        this.ctx.fillRect(obstacle.x + 30, obstacle.y + 8, 8, 12);

        // Wings
        this.ctx.fillRect(obstacle.x, obstacle.y + 15, 10, 4);
        this.ctx.fillRect(obstacle.x + 30, obstacle.y + 15, 10, 4);

        // Tail
        this.ctx.fillRect(obstacle.x + 30, obstacle.y + 20, 16, 3);
      }

      drawClouds() {
        this.ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';

        for (const cloud of this.clouds) {
          this.drawCloud(cloud.x, cloud.y, cloud.width, cloud.height);
        }
      }

      drawCloud(x, y, width, height) {
        this.ctx.beginPath();
        this.ctx.arc(x, y, 10, 0, Math.PI * 2);
        this.ctx.arc(x + 12, y, 12, 0, Math.PI * 2);
        this.ctx.arc(x + 24, y, 10, 0, Math.PI * 2);
        this.ctx.fill();
      }

      drawScore() {
        const score = Math.floor(this.gameState.score);
        const highScore = this.gameState.highScore;

        this.ctx.fillStyle = '#535353';
        this.ctx.font = 'bold 16px Arial';
        this.ctx.textAlign = 'right';

        this.ctx.fillText(`HI ${highScore}`, this.canvas.width - 30, 30);
        this.ctx.fillText(score, this.canvas.width - 30, 55);
      }

      gameLoop = () => {
        this.update();
        this.draw();
        requestAnimationFrame(this.gameLoop);
      };
    }

    // Initialize game
    const game = new DinoGame();

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        game.jump();
      }
      if (e.key === 'r' || e.key === 'R') {
        game.init();
      }
    });

    // Touch/Click controls
    document.getElementById('gameCanvas').addEventListener('click', () => {
      if (game.gameState.gameOver) {
        game.init();
      } else {
        game.jump();
      }
    });

    document.getElementById('gameCanvas').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (game.gameState.gameOver) {
        game.init();
      } else {
        game.jump();
      }
    });
  </script>
</body>
</html>
