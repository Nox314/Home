<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nicht verfügbar - nox!314</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root {
  --blue: #624aff;
  --blue-light: #8c7aff;
  --pink: #ff3366;
  --dark: #111218;
  --head: #292c35;
  --light: #f5f7fa;
  --text: #333;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;

  font-family: 'Inter', sans-serif;

  background:
    radial-gradient(
      circle at center,
      rgba(98, 74, 255, 0.08),
      transparent 45%
    ),
    var(--light);

  color: var(--text);

  display: flex;
  justify-content: center;
  align-items: center;

  overflow: hidden;
}

.error-container {
  width: 100%;
  max-width: 520px;

  padding: 30px;

  text-align: center;
}


/* =========================================
   ROBOT
========================================= */

.robot-area {
  position: relative;

  width: 220px;
  height: 220px;

  margin: 0 auto 25px;

  perspective: 800px;
}


/* Schatten unter dem Roboter */

.robot-shadow {
  position: absolute;

  bottom: 15px;
  left: 50%;

  width: 150px;
  height: 20px;

  transform: translateX(-50%);

  background: rgba(0,0,0,0.15);

  filter: blur(10px);

  border-radius: 50%;
}


/* Kopf */

.robot-head {

  position: absolute;

  width: 150px;
  height: 125px;

  left: 50%;
  top: 55px;

  transform: translateX(-50%);

  background:
    linear-gradient(
      145deg,
      #3a3e49 0%,
      #252832 45%,
      #15161b 100%
    );

  border-radius: 28px;

  border: 2px solid #4b4e58;

  box-shadow:

    inset 0 2px 4px rgba(255,255,255,0.12),

    inset 0 -8px 20px rgba(0,0,0,0.35),

    0 20px 40px rgba(0,0,0,0.20);

  animation: robotFloat 4s ease-in-out infinite;
}


/* =========================================
   NOX LOGO
========================================= */

.robot-logo {

  position: absolute;

  top: 12px;
  left: 50%;

  transform: translateX(-50%);

  font-size: 12px;
  font-weight: 800;

  letter-spacing: 2px;

  color: #e9e7ff;

  text-shadow:
    0 0 5px rgba(98,74,255,0.8),
    0 0 12px rgba(98,74,255,0.5);

  opacity: 0.95;

  z-index: 10;
}


/* kleiner Punkt neben dem Logo */

.robot-logo::before {

  content: "";

  display: inline-block;

  width: 5px;
  height: 5px;

  margin-right: 5px;

  vertical-align: middle;

  border-radius: 50%;

  background: var(--blue);

  box-shadow:
    0 0 6px var(--blue),
    0 0 12px var(--blue);
}


/* =========================================
   SEITLICHE MODULE
========================================= */

.side-module {

  position: absolute;

  top: 48px;

  width: 13px;
  height: 32px;

  background:
    linear-gradient(
      180deg,
      #806cff,
      #624aff
    );

  box-shadow:
    0 0 8px rgba(98,74,255,0.8);

  z-index: 5;
}


.side-module.left {

  left: -13px;

  border-radius: 7px 0 0 7px;
}


.side-module.right {

  right: -13px;

  border-radius: 0 7px 7px 0;
}


/* =========================================
   ANTENNE
========================================= */

.antenna {

  position: absolute;

  width: 4px;
  height: 30px;

  left: 50%;
  top: -30px;

  transform: translateX(-50%);

  background: #666;

  box-shadow:
    inset 1px 0 rgba(255,255,255,0.2);
}


.antenna-light {

  position: absolute;

  width: 15px;
  height: 15px;

  left: 50%;
  top: -43px;

  transform: translateX(-50%);

  border-radius: 50%;

  background: var(--pink);

  box-shadow:
    0 0 8px var(--pink),
    0 0 20px rgba(255,51,102,0.7);

  animation: antennaPulse 1.4s ease-in-out infinite alternate;
}


/* =========================================
   VISIER
========================================= */

.robot-visor {

  position: absolute;

  left: 15px;
  right: 15px;

  top: 42px;

  height: 38px;

  border-radius: 11px;

  background:
    linear-gradient(
      180deg,
      #11131a,
      #07080c
    );

  border: 1px solid #3c3e47;

  box-shadow:
    inset 0 3px 8px rgba(0,0,0,0.8),
    0 0 5px rgba(0,0,0,0.5);

  display: flex;

  align-items: center;
  justify-content: space-around;

  padding: 0 17px;
}


.robot-eye {

  width: 19px;
  height: 6px;

  border-radius: 5px;

  background: var(--blue);

  box-shadow:
    0 0 6px var(--blue),
    0 0 15px rgba(98,74,255,0.7);

  animation: blink 4s infinite;
}


/* =========================================
   MUND
========================================= */

.robot-mouth {

  position: absolute;

  left: 50%;
  bottom: 17px;

  transform: translateX(-50%);

  width: 48px;
  height: 7px;

  display: flex;

  justify-content: space-between;
  align-items: center;

  padding: 0 4px;

  background: #08090d;

  border-radius: 5px;

  border: 1px solid #292b32;
}


.mouth-line {

  width: 6px;
  height: 2px;

  background: var(--pink);

  box-shadow:
    0 0 5px var(--pink);
}


/* =========================================
   TEXT
========================================= */

h1 {

  margin: 0 0 10px;

  font-size: 30px;

  font-weight: 800;

  color: #18191e;
}


p {

  margin: 0 auto 28px;

  max-width: 420px;

  font-size: 15px;

  line-height: 1.6;

  color: #666;
}


/* =========================================
   BUTTON
========================================= */

.btn-home {

  display: inline-flex;

  align-items: center;
  justify-content: center;

  gap: 8px;

  padding: 13px 24px;

  border-radius: 12px;

  background:
    linear-gradient(
      135deg,
      #705cff,
      #543de8
    );

  color: white;

  font-size: 14px;
  font-weight: 700;

  text-decoration: none;

  box-shadow:
    0 7px 20px rgba(98,74,255,0.28);

  transition:
    transform 0.2s,
    box-shadow 0.2s,
    filter 0.2s;
}


.btn-home:hover {

  transform: translateY(-3px);

  filter: brightness(1.05);

  box-shadow:
    0 12px 28px rgba(98,74,255,0.38);
}


.btn-home::before {

  content: "←";

  font-size: 18px;
}


/* =========================================
   ANIMATIONEN
========================================= */

@keyframes robotFloat {

  0%, 100% {
    transform:
      translateX(-50%)
      translateY(0)
      rotate(0deg);
  }

  25% {
    transform:
      translateX(-50%)
      translateY(-4px)
      rotate(-2deg);
  }

  50% {
    transform:
      translateX(-50%)
      translateY(0)
      rotate(2deg);
  }

  75% {
    transform:
      translateX(-50%)
      translateY(-3px)
      rotate(-1deg);
  }
}


@keyframes antennaPulse {

  from {
    transform:
      translateX(-50%)
      scale(0.85);

    opacity: 0.65;
  }

  to {
    transform:
      translateX(-50%)
      scale(1.15);

    opacity: 1;
  }
}


@keyframes blink {

  0%, 92%, 100% {
    transform: scaleY(1);
  }

  95% {
    transform: scaleY(0.1);
  }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 500px) {

  .error-container {
    padding: 20px;
  }

  .robot-area {
    transform: scale(0.9);
    margin-bottom: 15px;
  }

  h1 {
    font-size: 26px;
  }

  p {
    font-size: 14px;
  }
}

</style>
</head>


<body>

<div class="error-container">

  <div class="robot-area">

    <div class="robot-shadow"></div>

    <div class="robot-head">

      <!-- Antenne -->
      <div class="antenna"></div>
      <div class="antenna-light"></div>

      <!-- nox!314 Logo -->
      <div class="robot-logo">
        nox!314
      </div>

      <!-- Seitliche Module -->
      <div class="side-module left"></div>
      <div class="side-module right"></div>

      <!-- Visier -->
      <div class="robot-visor">

        <div class="robot-eye"></div>

        <div class="robot-eye"></div>

      </div>

      <!-- Mund -->
      <div class="robot-mouth">

        <div class="mouth-line"></div>
        <div class="mouth-line"></div>
        <div class="mouth-line"></div>

      </div>

    </div>

  </div>


  <h1>Hoppla!</h1>

  <p>
    Diese Funktion ist leider noch nicht verfügbar
    oder wurde gelöscht.
  </p>

  <a href="index.html" class="btn-home">
    Zurück zur Startseite
  </a>

</div>

</body>
</html>
