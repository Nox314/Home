<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nicht verfügbar - nox!314</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --proton-blue: #624aff;
    --proton-dark: #1c1c1c;
    --proton-light: #f5f7fa;
    --proton-border: #e0e4eb;
    --proton-text: #333;
    --border-radius: 12px;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
    background-color: var(--proton-light);
    color: var(--proton-text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    overflow: hidden;
  }

  .error-container {
    padding: 20px;
    max-width: 500px;
  }

  /* Abgespaceter 3D-Roboter-Kopf Animation */
  .robot-head-wrapper {
    perspective: 800px;
    margin-bottom: 30px;
  }

  .robot-head {
    width: 140px;
    height: 120px;
    background: linear-gradient(135deg, #2c2f38, #1c1c1c);
    margin: 0 auto;
    border-radius: 24px;
    position: relative;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2), inset 0 2px 5px rgba(255, 255, 255, 0.1);
    border: 2px solid #444;
    animation: headShake 4s ease-in-out infinite;
    transform-origin: center bottom;
  }

  /* Ohren / Antennen */
  .robot-head::before {
    content: '';
    position: absolute;
    top: 45px;
    left: -12px;
    width: 12px;
    height: 30px;
    background: var(--proton-blue);
    border-radius: 6px 0 0 6px;
    box-shadow: 0 0 10px var(--proton-blue);
  }

  .robot-head::after {
    content: '';
    position: absolute;
    top: 45px;
    right: -12px;
    width: 12px;
    height: 30px;
    background: var(--proton-blue);
    border-radius: 0 6px 6px 0;
    box-shadow: 0 0 10px var(--proton-blue);
  }

  /* Antenne oben */
  .antenna {
    position: absolute;
    top: -25px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 25px;
    background: #666;
  }

  .antenna-ball {
    position: absolute;
    top: -35px;
    left: 50%;
    transform: translateX(-50%);
    width: 14px;
    height: 14px;
    background: #ff3366;
    border-radius: 50%;
    box-shadow: 0 0 12px #ff3366;
    animation: pulse 1.5s infinite alternate;
  }

  /* Augenbereich / Visier */
  .robot-visor {
    position: absolute;
    top: 35px;
    left: 15px;
    right: 15px;
    height: 35px;
    background: #090a0f;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 15px;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
    border: 1px solid #333;
  }

  .robot-eye {
    width: 18px;
    height: 6px;
    background: var(--proton-blue);
    border-radius: 3px;
    box-shadow: 0 0 10px var(--proton-blue);
    animation: blink 3s infinite;
  }

  /* Mund-LEDs */
  .robot-mouth {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 6px;
    background: #090a0f;
    border-radius: 3px;
    display: flex;
    justify-content: space-between;
    padding: 0 4px;
    align-items: center;
  }

  .mouth-line {
    width: 6px;
    height: 2px;
    background: #ff3366;
    box-shadow: 0 0 5px #ff3366;
  }

  /* Keyframe Animationen */
  @keyframes headShake {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-8deg); }
    40% { transform: rotate(8deg); }
    60% { transform: rotate(-5deg); }
    80% { transform: rotate(5deg); }
  }

  @keyframes pulse {
    0% { transform: translateX(-50%) scale(0.9); opacity: 0.7; }
    100% { transform: translateX(-50%) scale(1.2); opacity: 1; }
  }

  @keyframes blink {
    0%, 90%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  /* Typografie & Button */
  h1 {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--proton-dark);
    margin-bottom: 10px;
  }

  p {
    font-size: 1rem;
    color: #666;
    margin-bottom: 30px;
    line-height: 1.5;
  }

  .btn-home {
    display: inline-block;
    background-color: var(--proton-blue);
    color: white;
    padding: 12px 24px;
    border-radius: var(--border-radius);
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 14px rgba(98, 74, 255, 0.3);
  }

  .btn-home:hover {
    background-color: #5038e0;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(98, 74, 255, 0.4);
  }
</style>
</head>
<body>

  <div class="error-container">
    <!-- Abgespaceter 3D Roboter Kopf -->
    <div class="robot-head-wrapper">
      <div class="robot-head">
        <div class="antenna"></div>
        <div class="antenna-ball"></div>
        <div class="robot-visor">
          <div class="robot-eye"></div>
          <div class="robot-eye"></div>
        </div>
        <div class="robot-mouth">
          <div class="mouth-line"></div>
          <div class="mouth-line"></div>
          <div class="mouth-line"></div>
        </div>
      </div>
    </div>

    <h1>Hoppla!</h1>
    <p>Diese Funktion ist leider noch nicht verfügbar oder wurde gelöscht.</p>
    
    <a href="index.html" class="btn-home">Zurück zur Startseite</a>
  </div>

</body>
</html>
