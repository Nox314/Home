<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X!Math Calculator</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #AB61E4;
    min-height: 100vh;
    overflow: hidden;
    color: #fff;
    font-family: Arial, sans-serif;
  }

  .calculator {
    --header-bg: rgba(255,255,255,.2);
    --body-bg: rgba(255,255,255,.3);
    --button-bg: rgba(255,255,255,.2);
    --button-bg-hover: rgba(255,255,255,.3);
    --button-highlight-bg: rgba(255,255,255,.5);
    --button-highlight-bg-hover: rgba(255,255,255,.3);
    transition: all 0.8s cubic-bezier(0.075, 0.82, 0.165, 1) 0s;
    position: relative;
    width: 300px;
    box-shadow: rgba(24, 32, 79, 0.25) 0px 40px 80px, rgba(255, 255, 255, 0.5) 0px 0px 0px 0.5px inset;
    border-radius: 15px;
    z-index: 10;
  }
  .calculator:hover {
    margin-bottom: 5px;
  }
  .calculator.dark {
    --header-bg: rgba(2,14,39,.2);
    --body-bg: rgba(2,14,39,.3);
    --button-bg: rgba(2,14,39,.2);
    --button-bg-hover: rgba(255,255,255,.1);
    --button-highlight-bg: rgba(2,14,39,.5);
    --button-highlight-bg-hover: rgba(255,255,255,.15);
  }
  .calculator-header {
    position: relative;
    background-color: var(--header-bg);
    padding: 20px 20px 10px 20px;
    text-align: right;
    border-top-left-radius: 15px;
    border-top-right-radius: 15px;
    backdrop-filter: blur(40px);
    box-shadow: inset 0px 2px 1px rgba(255, 255, 255, 0.1);
  }
  .calculator-operation {
    font-size: 16px;
    margin-bottom: 4px;
    min-height: 20px;
    word-break: break-all;
  }
  .calculator-operation-result {
    font-size: 36px;
    font-weight: bold;
    word-break: break-all;
  }
  .calculator-button {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100%;
    border: 1px solid transparent;
    background-color: var(--button-bg);
    font-size: 18px;
    cursor: pointer;
    color: #fff;
    user-select: none;
    backdrop-filter: blur(6px);
    transition: all 0.2s ease-in-out;
    z-index: 2;
  }
  .calculator-button:hover, .calculator-button:focus {
    box-shadow: 0px 10px 25px rgba(4, 37, 100, 0.12);
    border-radius: 4px;
    background-color: var(--button-bg-hover);
    border-color: rgba(255, 255, 255, 0.15);
    z-index: 5;
    transform: scale(1.1);
  }
  .calculator-button:focus {
    outline: none;
  }
  .calculator-button.equal {
    grid-row-start: span 2;
    grid-column-start: 4;
  }
  .calculator-button.highlight {
    background-color: var(--button-highlight-bg);
  }
  .calculator-button.highlight:hover, .calculator-button.highlight:focus {
    background-color: var(--button-highlight-bg-hover);
  }
  .calculator-button-wrapper {
    position: relative;
    margin: 15px;
    display: grid;
    grid-gap: 5px;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 45px);
  }
  .calculator-back {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 85%;
    background-image: linear-gradient(#bd1d8c 0%, #7a41ce 100%);
    border-radius: 15px;
    transform: skewY(8deg);
    transform-origin: left top;
    z-index: 5;
  }
  .calculator-wrapper {
    position: relative;
  }
  .title {
    font-size: calc(62px + 1vw);
    font-weight: 900;
    color: #1f3e5a;
    letter-spacing: -0.065em;
    user-select: none;
  }
  .title-wrapper {
    position: absolute;
    top: 100%;
    left: 0;
    transform: rotate(-90deg) translate(-80px, -65px);
    mix-blend-mode: difference;
    z-index: 10;
  }
  .toggle-theme {
    position: absolute;
    top: 0;
    left: 0;
    font-size: 13px;
    padding: 8px 12px;
    background-color: var(--button-bg);
    border-top-left-radius: 15px;
    border-bottom-right-radius: 15px;
    color: #fff;
    cursor: pointer;
    border: none;
    outline: none;
    backdrop-filter: blur(4px);
    z-index: 5;
  }
  .toggle-theme:hover {
    background-color: var(--button-bg-hover);
  }
  .bg-item {
    position: absolute;
  }
</style>
</head>
<body>

<div id="bg-0" class="bg-item" style="top: 0; right: 0; bottom: 0; left: 0;">
  <svg width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect y="0.4375" width="100%" height="100%" fill="#AB61E4"/>
  </svg>
</div>

<main class="calculator-wrapper">
  <div class="title-wrapper">
    <div class="title">X!Math</div>
  </div>
  
  <section class="calculator">
    <button id="toggler" class="toggle-theme">Theme</button>
    
    <header class="calculator-header">
      <div class="calculator-operation" id="operation"></div>
      <div class="calculator-operation-result" id="result">0</div>
    </header>

    <div class="calculator-button-wrapper">
      <button type="button" class="calculator-button" data-action="clear">C</button>
      <button type="button" class="calculator-button" data-action="sqrt">√</button>
      <button type="button" class="calculator-button" data-action="power">^</button>
      <button type="button" class="calculator-button" data-action="divide">÷</button>
      
      <button type="button" class="calculator-button highlight" data-number="7">7</button>
      <button type="button" class="calculator-button highlight" data-number="8">8</button>
      <button type="button" class="calculator-button highlight" data-number="9">9</button>
      <button type="button" class="calculator-button" data-action="multiply">×</button>
      
      <button type="button" class="calculator-button highlight" data-number="4">4</button>
      <button type="button" class="calculator-button highlight" data-number="5">5</button>
      <button type="button" class="calculator-button highlight" data-number="6">6</button>
      <button type="button" class="calculator-button" data-action="subtract">-</button>
      
      <button type="button" class="calculator-button highlight" data-number="1">1</button>
      <button type="button" class="calculator-button highlight" data-number="2">2</button>
      <button type="button" class="calculator-button highlight" data-number="3">3</button>
      <button type="button" class="calculator-button equal" data-action="calculate">=</button>
      
      <button type="button" class="calculator-button highlight" data-action="sign">±</button>
      <button type="button" class="calculator-button highlight" data-number="0">0</button>
      <button type="button" class="calculator-button highlight" data-action="decimal">.</button>
      <button type="button" class="calculator-button" data-action="add">+</button>
    </div>
  </section>
  
  <div class="calculator-back"></div>
</main>

<script>
  const calculator = document.querySelector('.calculator');
  const toggler = document.getElementById('toggler');
  const operationEl = document.getElementById('operation');
  const resultEl = document.getElementById('result');

  let currentInput = '0';
  let previousInput = '';
  let operation = null;

  // Theme Toggler
  toggler.addEventListener('click', () => {
    calculator.classList.toggle('dark');
  });

  function updateDisplay() {
    resultEl.textContent = currentInput;
    if (operation !== null) {
      operationEl.textContent = `${previousInput} ${operation}`;
    } else {
      operationEl.textContent = '';
    }
  }

  // Handle Button Clicks
  document.querySelectorAll('.calculator-button').forEach(button => {
    button.addEventListener('click', () => {
      const number = button.getAttribute('data-number');
      const action = button.getAttribute('data-action');

      if (number !== null) {
        if (currentInput === '0') {
          currentInput = number;
        } else {
          currentInput += number;
        }
      }

      if (action === 'clear') {
        currentInput = '0';
        previousInput = '';
        operation = null;
      }

      if (['add', 'subtract', 'multiply', 'divide', 'power'].includes(action)) {
        const symbols = { add: '+', subtract: '-', multiply: '×', divide: '÷', power: '^' };
        previousInput = currentInput;
        operation = symbols[action];
        currentInput = '0';
      }

      if (action === 'decimal') {
        if (!currentInput.includes('.')) {
          currentInput += '.';
        }
      }

      if (action === 'sign') {
        currentInput = (parseFloat(currentInput) * -1).toString();
      }

      if (action === 'sqrt') {
        currentInput = Math.sqrt(parseFloat(currentInput)).toString();
      }

      if (action === 'calculate') {
        if (operation && previousInput !== '') {
          let prev = parseFloat(previousInput);
          let curr = parseFloat(currentInput);
          let res = 0;

          switch (operation) {
            case '+': res = prev + curr; break;
            case '-': res = prev - curr; break;
            case '×': res = prev * curr; break;
            case '÷': res = curr !== 0 ? prev / curr : 'Error'; break;
            case '^': res = Math.pow(prev, curr); break;
          }

          currentInput = res.toString();
          previousInput = '';
          operation = null;
        }
      }

      updateDisplay();
    });
  });
</script>

</body>
</html>
