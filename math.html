<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X!Math Calculator Pro</title>
<style>
  :root {
    --bg-color: #0f172a;
    --panel-bg: rgba(30, 41, 59, 0.7);
    --header-bg: rgba(15, 23, 42, 0.4);
    --button-bg: rgba(255, 255, 255, 0.05);
    --button-bg-hover: rgba(255, 255, 255, 0.12);
    --button-highlight-bg: rgba(255, 255, 255, 0.08);
    --text-color: #f8fafc;
    --text-muted: #94a3b8;
    --accent-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
    --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
  }

  .light {
    --bg-color: #f1f5f9;
    --panel-bg: rgba(255, 255, 255, 0.8);
    --header-bg: rgba(241, 245, 249, 0.6);
    --button-bg: rgba(0, 0, 0, 0.03);
    --button-bg-hover: rgba(0, 0, 0, 0.08);
    --button-highlight-bg: rgba(0, 0, 0, 0.05);
    --text-color: #1e293b;
    --text-muted: #64748b;
    --shadow: 0 20px 40px -15px rgba(148, 163, 184, 0.4);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--bg-color);
    min-height: 100vh;
    color: var(--text-color);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background-color 0.4s ease;
  }

  .main-container {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .calculator-wrapper {
    position: relative;
  }

  .calculator {
    position: relative;
    width: 340px;
    background: var(--panel-bg);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    z-index: 10;
    overflow: hidden;
  }

  .calculator-header {
    background-color: var(--header-bg);
    padding: 24px 20px 16px 20px;
    text-align: right;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  }

  .calculator-operation {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 6px;
    min-height: 18px;
    word-break: break-all;
  }

  .calculator-operation-result {
    font-size: 40px;
    font-weight: 700;
    word-break: break-all;
    letter-spacing: -0.5px;
  }

  .calculator-button-wrapper {
    margin: 16px;
    display: grid;
    grid-gap: 8px;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 52px);
  }

  .calculator-button {
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.05);
    background-color: var(--button-bg);
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-color);
    user-select: none;
    border-radius: 14px;
    transition: all 0.15s ease;
  }

  .calculator-button:hover {
    background-color: var(--button-bg-hover);
    transform: translateY(-1px);
  }

  .calculator-button:active {
    transform: translateY(1px) scale(0.97);
  }

  .calculator-button.equal {
    grid-row: span 2;
    grid-column: 4;
    height: 112px;
    background-image: var(--accent-gradient);
    color: #fff;
    border: none;
    box-shadow: 0 8px 20px -4px rgba(139, 92, 246, 0.4);
  }

  .calculator-button.equal:hover {
    opacity: 0.9;
  }

  .calculator-button.highlight {
    background-color: var(--button-highlight-bg);
    color: #ec4899;
    font-weight: 600;
  }

  /* History Panel */
  .history-panel {
    width: 220px;
    background: var(--panel-bg);
    backdrop-filter: blur(25px);
    border-radius: 24px;
    padding: 20px;
    box-shadow: var(--shadow);
    max-height: 395px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .history-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .clear-history {
    background: none;
    border: none;
    color: #ec4899;
    cursor: pointer;
    font-size: 12px;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-item {
    font-size: 13px;
    padding: 8px 10px;
    background: var(--button-bg);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .history-item:hover {
    background: var(--button-bg-hover);
  }

  .history-expr {
    color: var(--text-muted);
    font-size: 11px;
  }

  .history-res {
    font-weight: 600;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 0 16px;
  }

  .app-title {
    font-size: 14px;
    font-weight: 700;
    background: var(--accent-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }

  .toggle-theme {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    background-color: var(--button-bg);
    border-radius: 20px;
    color: var(--text-color);
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.05);
    transition: background-color 0.2s;
  }

  .toggle-theme:hover {
    background-color: var(--button-bg-hover);
  }

  @media(max-width: 600px) {
    .main-container {
      flex-direction: column;
      align-items: center;
    }
    .history-panel {
      width: 340px;
      max-height: 180px;
    }
  }
</style>
</head>
<body>

<div class="main-container">
  <main class="calculator-wrapper">
    <section class="calculator">
      <div class="top-bar">
        <span class="app-title">X!Math Pro</span>
        <button id="toggler" class="toggle-theme">Theme</button>
      </div>
      
      <header class="calculator-header">
        <div class="calculator-operation" id="operation"></div>
        <div class="calculator-operation-result" id="result">0</div>
      </header>

      <div class="calculator-button-wrapper">
        <button type="button" class="calculator-button highlight" data-action="clear">C</button>
        <button type="button" class="calculator-button highlight" data-action="backspace">⌫</button>
        <button type="button" class="calculator-button highlight" data-action="percent">%</button>
        <button type="button" class="calculator-button highlight" data-action="divide">÷</button>
        
        <button type="button" class="calculator-button" data-number="7">7</button>
        <button type="button" class="calculator-button" data-number="8">8</button>
        <button type="button" class="calculator-button" data-number="9">9</button>
        <button type="button" class="calculator-button highlight" data-action="multiply">×</button>
        
        <button type="button" class="calculator-button" data-number="4">4</button>
        <button type="button" class="calculator-button" data-number="5">5</button>
        <button type="button" class="calculator-button" data-number="6">6</button>
        <button type="button" class="calculator-button highlight" data-action="subtract">-</button>
        
        <button type="button" class="calculator-button" data-number="1">1</button>
        <button type="button" class="calculator-button" data-number="2">2</button>
        <button type="button" class="calculator-button" data-number="3">3</button>
        <button type="button" class="calculator-button equal" data-action="calculate">=</button>
        
        <button type="button" class="calculator-button" data-action="sign">±</button>
        <button type="button" class="calculator-button" data-number="0">0</button>
        <button type="button" class="calculator-button" data-action="decimal">.</button>
        <button type="button" class="calculator-button highlight" data-action="add">+</button>
      </div>
    </section>
  </main>

  <!-- History Panel Sidebar -->
  <aside class="history-panel">
    <div class="history-title">
      History 
      <button class="clear-history" id="clearHistory">Clear</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="history-item" style="opacity: 0.6; cursor: default;">No history yet</div>
    </div>
  </aside>
</div>

<script>
  const toggler = document.getElementById('toggler');
  const operationEl = document.getElementById('operation');
  const resultEl = document.getElementById('result');
  const historyList = document.getElementById('historyList');
  const clearHistoryBtn = document.getElementById('clearHistory');

  let currentInput = '0';
  let previousInput = '';
  let operation = null;
  let resetNextInput = false;
  let historyData = [];

  // Theme Toggler
  toggler.addEventListener('click', () => {
    document.body.classList.toggle('light');
  });

  function updateDisplay() {
    resultEl.textContent = currentInput;
    operationEl.textContent = operation !== null ? `${previousInput} ${operation}` : '';
  }

  function handleNumber(num) {
    if (currentInput === '0' || resetNextInput) {
      currentInput = num;
      resetNextInput = false;
    } else {
      currentInput += num;
    }
  }

  function handleOperator(action) {
    const symbols = { add: '+', subtract: '-', multiply: '×', divide: '÷' };
    
    if (operation !== null && !resetNextInput) {
      calculate();
    }
    
    previousInput = currentInput;
    operation = symbols[action];
    resetNextInput = true;
  }

  function calculate() {
    if (operation === null || previousInput === '') return;

    let prev = parseFloat(previousInput);
    let curr = parseFloat(currentInput);
    let res = 0;
    let exprString = `${prev} ${operation} ${curr}`;

    switch (operation) {
      case '+': res = prev + curr; break;
      case '-': res = prev - curr; break;
      case '×': res = prev * curr; break;
      case '÷': res = curr !== 0 ? prev / curr : 'Error'; break;
    }

    if (res !== 'Error') {
      res = Number.isInteger(res) ? res : parseFloat(res.toFixed(8));
      addHistory(exprString, res);
    }

    currentInput = res.toString();
    operation = null;
    previousInput = '';
    resetNextInput = true;
  }

  function addHistory(expression, result) {
    if (historyData.length === 0) historyList.innerHTML = '';
    historyData.unshift({ expression, result });
    if (historyData.length > 10) historyData.pop();
    
    renderHistory();
  }

  function renderHistory() {
    if (historyData.length === 0) {
      historyList.innerHTML = '<div class="history-item" style="opacity: 0.6; cursor: default;">No history yet</div>';
      return;
    }

    historyList.innerHTML = '';
    historyData.forEach((item) => {
      const historyItemEl = document.createElement('div');
      historyItemEl.className = 'history-item';
      historyItemEl.innerHTML = `
        <div class="history-expr">${item.expression}</div>
        <div class="history-res">${item.result}</div>
      `;
      historyItemEl.addEventListener('click', () => {
        currentInput = item.result.toString();
        resetNextInput = true;
        updateDisplay();
      });
      historyList.appendChild(historyItemEl);
    });
  }

  clearHistoryBtn.addEventListener('click', () => {
    historyData = [];
    renderHistory();
  });

  // Button Listeners
  document.querySelectorAll('.calculator-button').forEach(button => {
    button.addEventListener('click', () => {
      const number = button.getAttribute('data-number');
      const action = button.getAttribute('data-action');

      if (number !== null) {
        handleNumber(number);
      } else if (['add', 'subtract', 'multiply', 'divide'].includes(action)) {
        handleOperator(action);
      } else if (action === 'clear') {
        currentInput = '0';
        previousInput = '';
        operation = null;
        resetNextInput = false;
      } else if (action === 'backspace') {
        if (currentInput.length > 1 && !resetNextInput) {
          currentInput = currentInput.slice(0, -1);
        } else {
          currentInput = '0';
        }
      } else if (action === 'percent') {
        currentInput = (parseFloat(currentInput) / 100).toString();
      } else if (action === 'decimal') {
        if (resetNextInput) {
          currentInput = '0.';
          resetNextInput = false;
        } else if (!currentInput.includes('.')) {
          currentInput += '.';
        }
      } else if (action === 'sign') {
        currentInput = (parseFloat(currentInput) * -1).toString();
      } else if (action === 'calculate') {
        calculate();
      }

      updateDisplay();
    });
  });

  // Keyboard Support
  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') handleNumber(e.key);
    if (e.key === '.') document.querySelector('[data-action="decimal"]').click();
    if (e.key === '+') handleOperator('add');
    if (e.key === '-') handleOperator('subtract');
    if (e.key === '*') handleOperator('multiply');
    if (e.key === '/') handleOperator('divide');
    if (e.key === 'Enter' || e.key === '=') calculate();
    if (e.key === 'Backspace') document.querySelector('[data-action="backspace"]').click();
    if (e.key === 'Escape') document.querySelector('[data-action="clear"]').click();
    updateDisplay();
  });
</script>

</body>
</html>
