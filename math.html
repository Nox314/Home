<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X!Math</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {

    --proton-blue: #624aff;
    --proton-blue-hover: #4f37e0;
    --proton-dark: #1c1c1c;
    --proton-light: #f5f7fa;
    --proton-border: #e0e4eb;
    --proton-text: #333333;
    --bg-color: #f5f7fa;
    --panel-bg: #ffffff;
    --header-bg: #f5f7fa;
    --button-bg: rgba(0, 0, 0, 0.03);
    --button-bg-hover: rgba(98, 74, 255, 0.08);
    --button-highlight-bg: rgba(98, 74, 255, 0.1);
    --border-color: #e0e4eb;
    --text-color: #333333;
    --text-muted: #666666;
    --accent-gradient: linear-gradient(135deg, #624aff, #8a7bff);
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    --radius: 12px;
  }

  .dark {
    --bg-color: #1c1c1c;
    --panel-bg: #242424;
    --header-bg: #2b2b2b;
    --button-bg: rgba(255, 255, 255, 0.05);
    --button-bg-hover: rgba(255, 255, 255, 0.12);
    --button-highlight-bg: rgba(255, 255, 255, 0.08);
    --border-color: rgba(255, 255, 255, 0.08);
    --text-color: #f5f7fa;
    --text-muted: #9aa0ab;
    --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Inter', sans-serif;
    background-color: var(--bg-color);
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background-color 0.4s ease;
  }

  /* ===== NAVIGATION (aus nox!314 index.html) ===== */
  #topMenu {
    background-color: var(--panel-bg);
    box-shadow: var(--shadow-sm);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .wrap {
    margin: 0 auto;
    padding: 0 20px;
    max-width: 1200px;
  }

  #topMenu .wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 70px;
  }

  .logo {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 24px;
    color: var(--proton-dark);
    text-decoration: none;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--proton-blue); }

  .nav-links {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--proton-text);
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .nav-links a:hover, .nav-links a.active {
    background-color: rgba(98, 74, 255, 0.1);
    color: var(--proton-blue);
  }

  .btn-register {
    background-color: var(--proton-blue);
    color: white !important;
    padding: 10px 20px !important;
    border-radius: 8px !important;
    font-weight: 600 !important;
    box-shadow: 0 4px 12px rgba(98, 74, 255, 0.2);
  }

  .btn-register:hover {
    background-color: var(--proton-blue-hover) !important;
    transform: translateY(-1px);
    box-shadow: 0 6px 16px rgba(98, 74, 255, 0.3);
  }

  /* ===== MAIN CONTENT ===== */
  .main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
  }

  .main-container {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .calculator-wrapper {
    position: relative;
  }

  .calculator {
    position: relative;
    width: 440px;
    background: var(--panel-bg);
    box-shadow: var(--shadow-md);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    z-index: 10;
    overflow: hidden;
  }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 0 20px;
  }

  .app-title {
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #1c1c1c;
    letter-spacing: -0.5px;
  }

  .app-title span { color: var(--proton-blue); }

  .mode-switch {
    display: flex;
    gap: 5px;
    background: var(--button-bg);
    padding: 3px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
  }

  .mode-btn {
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-btn.active {
    background: var(--proton-blue);
    color: #fff;
    box-shadow: 0 4px 12px rgba(98, 74, 255, 0.2);
  }

  .toggle-theme {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    background-color: var(--button-bg);
    border-radius: 8px;
    color: var(--text-color);
    cursor: pointer;
    border: 1px solid var(--border-color);
    transition: all 0.2s;
  }

  .toggle-theme:hover {
    background-color: var(--button-bg-hover);
    color: var(--proton-blue);
  }

  .calculator-header {
    background-color: var(--header-bg);
    padding: 20px;
    text-align: right;
    border-bottom: 1px solid var(--border-color);
  }

  .calculator-operation {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 6px;
    min-height: 18px;
    word-break: break-all;
  }

  .calculator-operation-result {
    font-size: 36px;
    font-weight: 700;
    word-break: break-all;
    letter-spacing: -0.5px;
    color: #1c1c1c;
  }

  .calculator-button-wrapper {
    margin: 16px;
    display: grid;
    grid-gap: 8px;
    grid-template-columns: repeat(5, 1fr);
  }

  .calculator-button {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 48px;
    border: 1px solid var(--border-color);
    background-color: var(--button-bg);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-color);
    user-select: none;
    border-radius: 8px;
    transition: all 0.2s;
  }

  .calculator-button:hover {
    background-color: var(--button-bg-hover);
    border-color: rgba(98, 74, 255, 0.2);
    transform: translateY(-1px);
  }

  .calculator-button:active {
    transform: translateY(1px) scale(0.97);
  }

  .calculator-button.equal {
    background: var(--accent-gradient);
    color: #fff;
    border: none;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(98, 74, 255, 0.3);
  }

  .calculator-button.equal:hover {
    background: var(--proton-blue-hover);
    opacity: 1;
  }

  .calculator-button.highlight {
    background-color: var(--button-highlight-bg);
    color: var(--proton-blue);
    font-weight: 600;
  }

  /* Unit Converter Panel View */
  .converter-view {
    display: none;
    padding: 20px;
    flex-direction: column;
    gap: 15px;
  }

  .converter-view.active {
    display: flex;
  }

  .calculator-view {
    display: block;
  }

  .calculator-view.hidden {
    display: none;
  }

  .converter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .converter-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
  }

  .converter-select, .converter-input {
    width: 100%;
    padding: 12px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-color);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .converter-select:focus, .converter-input:focus {
    border-color: var(--proton-blue);
    box-shadow: 0 0 0 3px rgba(98, 74, 255, 0.1);
  }

  .converter-select option {
    background: var(--panel-bg);
    color: var(--text-color);
  }

  .converter-output-box {
    background: var(--header-bg);
    padding: 16px;
    border-radius: 8px;
    text-align: right;
    border: 1px solid var(--border-color);
  }

  .converter-output-title {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .converter-output-value {
    font-size: 28px;
    font-weight: 700;
    word-break: break-all;
    color: var(--proton-blue);
  }

  /* History Panels */
  .history-panel {
    width: 220px;
    background: var(--panel-bg);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border-color);
    max-height: 480px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .history-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .clear-history {
    background: none;
    border: none;
    color: var(--proton-blue);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 600;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-item {
    font-size: 13px;
    padding: 8px 10px;
    background: var(--button-bg);
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .history-item:hover {
    background: var(--button-highlight-bg);
    border-color: rgba(98, 74, 255, 0.2);
  }

  .history-expr {
    color: var(--text-muted);
    font-size: 11px;
  }

  .history-res {
    font-weight: 600;
  }

  /* ===== FOOTER (aus nox!314 index.html) ===== */
  footer {
    background-color: var(--panel-bg);
    padding: 30px 0;
    margin-top: auto;
    border-top: 1px solid var(--proton-border);
    text-align: center;
    color: #666666;
    font-size: 14px;
  }

  .footer-links {
    margin-top: 15px;
  }

  .footer-links a {
    color: var(--proton-blue);
    text-decoration: none;
    margin: 0 10px;
    font-weight: 500;
  }

  .footer-links a:hover { text-decoration: underline; }

  .dark footer {
    border-top-color: var(--border-color);
    color: var(--text-muted);
  }

  /* ===== RESPONSIVE ===== */
  @media(max-width: 700px) {
    .main-content {
      padding: 30px 10px;
    }
    .main-container {
      flex-direction: column;
      align-items: center;
    }
    .calculator {
      width: 340px;
    }
    .history-panel {
      width: 340px;
      max-height: 180px;
    }
  }

  @media (max-width: 768px) {
    #topMenu .wrap {
      flex-direction: column;
      height: auto;
      padding: 15px 0;
    }
    .nav-links {
      margin-top: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-register {
      width: 100%;
      text-align: center;
      box-sizing: border-box;
    }
  }
</style>
</head>

<!-- ===== TOP MENU ===== -->
<nav id="topMenu">

        </div>
    </div>
</nav>

<!-- ===== MAIN ===== -->
<div class="main-content">
  <div class="main-container">
    <main class="calculator-wrapper">
      <section class="calculator">
        <div class="top-bar">
          <span class="app-title" id="appTitle">X!<span style="color: var(--proton-blue);">Math</span> Pro</span>
          <div class="mode-switch">
            <button class="mode-btn active" id="calcModeBtn">Calc</button>
            <button class="mode-btn" id="unitModeBtn">Units</button>
          </div>
          <button id="toggler" class="toggle-theme">Theme</button>
        </div>

        <!-- Calculator View -->
        <div id="calculatorView" class="calculator-view">
          <header class="calculator-header">
            <div class="calculator-operation" id="operation"></div>
            <div class="calculator-operation-result" id="result">0</div>
          </header>

          <div class="calculator-button-wrapper">
            <button type="button" class="calculator-button highlight" data-action="clear">C</button>
            <button type="button" class="calculator-button highlight" data-action="backspace">⌫</button>
            <button type="button" class="calculator-button" data-action="pi">π</button>
            <button type="button" class="calculator-button" data-action="e">e</button>
            <button type="button" class="calculator-button highlight" data-action="percent">%</button>

            <button type="button" class="calculator-button" data-action="sqrt">√</button>
            <button type="button" class="calculator-button" data-action="sqr">x²</button>
            <button type="button" class="calculator-button" data-number="7">7</button>
            <button type="button" class="calculator-button" data-number="8">8</button>
            <button type="button" class="calculator-button" data-number="9">9</button>

            <button type="button" class="calculator-button" data-action="cube">x³</button>
            <button type="button" class="calculator-button" data-action="inverse">1/x</button>
            <button type="button" class="calculator-button" data-number="4">4</button>
            <button type="button" class="calculator-button" data-number="5">5</button>
            <button type="button" class="calculator-button" data-number="6">6</button>

            <button type="button" class="calculator-button" data-action="sin">sin</button>
            <button type="button" class="calculator-button" data-action="cos">cos</button>
            <button type="button" class="calculator-button" data-number="1">1</button>
            <button type="button" class="calculator-button" data-number="2">2</button>
            <button type="button" class="calculator-button" data-number="3">3</button>

            <button type="button" class="calculator-button" data-action="tan">tan</button>
            <button type="button" class="calculator-button" data-action="log">log</button>
            <button type="button" class="calculator-button" data-action="sign">±</button>
            <button type="button" class="calculator-button" data-number="0">0</button>
            <button type="button" class="calculator-button" data-action="decimal">.</button>

            <button type="button" class="calculator-button highlight" data-action="divide">÷</button>
            <button type="button" class="calculator-button highlight" data-action="multiply">×</button>
            <button type="button" class="calculator-button highlight" data-action="subtract">-</button>
            <button type="button" class="calculator-button highlight" data-action="add">+</button>
            <button type="button" class="calculator-button equal" data-action="calculate">=</button>
          </div>
        </div>

        <!-- Unit Converter View -->
        <div id="converterView" class="converter-view">
          <div class="converter-group">
            <label class="converter-label">Kategorie</label>
            <select id="unitCategory" class="converter-select">
              <option value="length">Länge</option>
              <option value="weight">Gewicht & Masse</option>
              <option value="temperature">Temperatur</option>
              <option value="volume">Volumen</option>
              <option value="area">Fläche</option>
              <option value="time">Zeit</option>
              <option value="speed">Geschwindigkeit</option>
              <option value="data">Datengröße</option>
              <option value="energy">Energie & Arbeit</option>
              <option value="pressure">Druck</option>
            </select>
          </div>

          <div class="converter-group">
            <label class="converter-label">Von</label>
            <select id="unitFrom" class="converter-select"></select>
            <input type="number" id="unitInputVal" class="converter-input" value="1" placeholder="Wert eingeben...">
          </div>

          <div class="converter-group">
            <label class="converter-label">Zu</label>
            <select id="unitTo" class="converter-select"></select>
          </div>

          <div class="converter-output-box">
            <div class="converter-output-title">Ergebnis</div>

          </div>

      </section>
    </main>

    <!-- Dynamic History Sidebar -->
    <aside class="history-panel">
      <div class="history-title">

      </div>

<script>
  // --- UI SWITCHING LOGIC ---
  const toggler = document.getElementById('toggler');
  const calcModeBtn = document.getElementById('calcModeBtn');
  const unitModeBtn = document.getElementById('unitModeBtn');
  const calculatorView = document.getElementById('calculatorView');
  const converterView = document.getElementById('converterView');
  const historyTitleText = document.getElementById('historyTitleText');
  const historyList = document.getElementById('historyList');
  const clearHistoryBtn = document.getElementById('clearHistory');
  const appTitle = document.getElementById('appTitle');

  let currentMode = 'calc'; // 'calc' or 'unit'

  toggler.addEventListener('click', () => {
    document.body.classList.toggle('dark');
  });

  calcModeBtn.addEventListener('click', () => {
    currentMode = 'calc';
    calcModeBtn.classList.add('active');
    unitModeBtn.classList.remove('active');
    calculatorView.classList.remove('hidden');
    converterView.classList.remove('active');
    appTitle.innerHTML = 'X!<span style="color: var(--proton-blue);">Math</span> Pro';
    historyTitleText.textContent = "History";
    renderHistory();
  });

  unitModeBtn.addEventListener('click', () => {
    currentMode = 'unit';
    unitModeBtn.classList.add('active');
    calcModeBtn.classList.remove('active');
    calculatorView.classList.add('hidden');
    converterView.classList.add('active');
    appTitle.innerHTML = 'Unit Converter';
    historyTitleText.textContent = "Unit History";
    renderHistory();
  });

  // --- CALCULATOR LOGIC ---
  const operationEl = document.getElementById('operation');
  const resultEl = document.getElementById('result');

  let currentInput = '0';
  let previousInput = '';
  let operation = null;
  let resetNextInput = false;
  let calcHistory = [];

  function updateDisplay() {
    resultEl.textContent = currentInput;
    operationEl.textContent = operation !== null ? `${previousInput} ${operation}` : '';
  }

  function handleNumber(num) {
    if (currentInput === '0' || resetNextInput) {
      currentInput = num;
      resetNextInput = false;
    } else {
      currentInput += num;
    }
  }

  function handleOperator(action) {
    const symbols = { add: '+', subtract: '-', multiply: '×', divide: '÷' };
    if (operation !== null && !resetNextInput) {
      calculate();
    }
    previousInput = currentInput;
    operation = symbols[action];
    resetNextInput = true;
  }

  function calculate() {
    if (operation === null || previousInput === '') return;
    let prev = parseFloat(previousInput);
    let curr = parseFloat(currentInput);
    let res = 0;
    let exprString = `${prev} ${operation} ${curr}`;

    switch (operation) {
      case '+': res = prev + curr; break;
      case '-': res = prev - curr; break;
      case '×': res = prev * curr; break;
      case '÷': res = curr !== 0 ? prev / curr : 'Error'; break;
    }

    if (res !== 'Error') {
      res = Number.isInteger(res) ? res : parseFloat(res.toFixed(8));
      addCalcHistory(exprString, res);
    }
    currentInput = res.toString();
    operation = null;
    previousInput = '';
    resetNextInput = true;
  }

  function handleAdvanced(action) {
    let val = parseFloat(currentInput);
    let res = 0;
    let expr = '';

    switch(action) {
      case 'sqrt': res = val >= 0 ? Math.sqrt(val) : 'Error'; expr = `√(${val})`; break;
      case 'sqr': res = val * val; expr = `${val}²`; break;
      case 'cube': res = val * val * val; expr = `${val}³`; break;
      case 'inverse': res = val !== 0 ? 1 / val : 'Error'; expr = `1/${val}`; break;
      case 'sin': res = Math.sin(val * Math.PI / 180); expr = `sin(${val}°)`; break;
      case 'cos': res = Math.cos(val * Math.PI / 180); expr = `cos(${val}°)`; break;
      case 'tan': res = Math.tan(val * Math.PI / 180); expr = `tan(${val}°)`; break;
      case 'log': res = val > 0 ? Math.log10(val) : 'Error'; expr = `log(${val})`; break;
      case 'pi': res = Math.PI; expr = 'π'; break;
      case 'e': res = Math.E; expr = 'e'; break;
    }

    if (res !== 'Error') {
      res = Number.isInteger(res) ? res : parseFloat(res.toFixed(8));
      addCalcHistory(expr, res);
      currentInput = res.toString();
    } else {
      currentInput = 'Error';
    }
    resetNextInput = true;
  }

  function addCalcHistory(expression, result) {
    calcHistory.unshift({ expression, result });
    if (calcHistory.length > 10) calcHistory.pop();
    if (currentMode === 'calc') renderHistory();
  }

  // --- UNIT CONVERTER DATA & LOGIC (> 100 Units) ---
  const unitsData = {
    length: {
      name: "Länge",
      base: "meter",
      units: {
        meter: { name: "Meter (m)", factor: 1 },
        kilometer: { name: "Kilometer (km)", factor: 1000 },
        centimeter: { name: "Zentimeter (cm)", factor: 0.01 },
        millimeter: { name: "Millimeter (mm)", factor: 0.001 },
        micrometer: { name: "Mikrometer (µm)", factor: 0.000001 },

  const unitCategorySelect = document.getElementById('unitCategory');
  const unitFromSelect = document.getElementById('unitFrom');
  const unitToSelect = document.getElementById('unitTo');
  const unitInputVal = document.getElementById('unitInputVal');
  const unitOutputVal = document.getElementById('unitOutputVal');
  let unitHistory = [];

  function populateUnitDropdowns() {
    const cat = unitCategorySelect.value;
    const unitsObj = unitsData[cat].units;
    unitFromSelect.innerHTML = '';
    unitToSelect.innerHTML = '';

    let keys = Object.keys(unitsObj);
    keys.forEach((key, index) => {
      let opt1 = document.createElement('option');
      opt1.value = key;
      opt1.textContent = unitsObj[key].name;
      unitFromSelect.appendChild(opt1);

      let opt2 = document.createElement('option');
      opt2.value = key;
      opt2.textContent = unitsObj[key].name;
      unitToSelect.appendChild(opt2);
    });

    if (keys.length > 1) {
      unitToSelect.selectedIndex = 1;
    }
    convertUnits();
  }

  function convertUnits() {
    const cat = unitCategorySelect.value;
    const fromKey = unitFromSelect.value;
    const toKey = unitToSelect.value;
    const val = parseFloat(unitInputVal.value);

    if (isNaN(val)) {
      unitOutputVal.textContent = "0";
      return;
    }

    let result = 0;
    if (cat === 'temperature') {
      // Temperature conversion logic
      let celsiusVal = val;
      if (fromKey === 'fahrenheit') celsiusVal = (val - 32) * 5/9;
      if (fromKey === 'kelvin') celsiusVal = val - 273.15;

      let targetVal = celsiusVal;
      if (toKey === 'fahrenheit') targetVal = celsiusVal * 9/5 + 32;
      if (toKey === 'kelvin') targetVal = celsiusVal + 273.15;
      result = targetVal;
    } else {
      const unitsObj = unitsData[cat].units;
      const baseVal = val * unitsObj[fromKey].factor;
      result = baseVal / unitsObj[toKey].factor;
    }

    result = Number.isInteger(result) ? result : parseFloat(result.toFixed(6));
    unitOutputVal.textContent = result;

    // Add to unit history automatically on change
    const fromName = unitsData[cat].units[fromKey].name.split(' ')[0];
    const toName = unitsData[cat].units[toKey].name.split(' ')[0];
    addUnitHistory(`${val} ${fromName} → ${toName}`, result);
  }

  function addUnitHistory(expression, result) {
    unitHistory.unshift({ expression, result });
    if (unitHistory.length > 10) unitHistory.pop();
    if (currentMode === 'unit') renderHistory();
  }

  unitCategorySelect.addEventListener('change', populateUnitDropdowns);
  unitFromSelect.addEventListener('change', convertUnits);
  unitToSelect.addEventListener('change', convertUnits);
  unitInputVal.addEventListener('input', convertUnits);

  // --- GENERAL HISTORY RENDERING ---
  function renderHistory() {
    const targetHistory = currentMode === 'calc' ? calcHistory : unitHistory;

    if (targetHistory.length === 0) {
      historyList.innerHTML = '<div class="history-item" style="opacity: 0.6; cursor: default;">No history yet</div>';
      return;
    }

    historyList.innerHTML = '';
    targetHistory.forEach((item) => {
      const historyItemEl = document.createElement('div');
      historyItemEl.className = 'history-item';
      historyItemEl.innerHTML = `
        <div class="history-expr">${item.expression}</div>
        <div class="history-res">${item.result}</div>
      `;
      historyItemEl.addEventListener('click', () => {
        if (currentMode === 'calc') {
          currentInput = item.result.toString();
          resetNextInput = true;
          updateDisplay();
        } else {
          unitInputVal.value = item.result;
          convertUnits();
        }
      });
      historyList.appendChild(historyItemEl);
    });
  }

  clearHistoryBtn.addEventListener('click', () => {
    if (currentMode === 'calc') {
      calcHistory = [];
    } else {
      unitHistory = [];
    }
    renderHistory();
  });

  // --- BUTTON LISTENERS & KEYBOARD SUPPORT ---
  document.querySelectorAll('.calculator-button').forEach(button => {
    button.addEventListener('click', () => {
      const number = button.getAttribute('data-number');
      const action = button.getAttribute('data-action');

      if (number !== null) {
        handleNumber(number);
      } else if (['add', 'subtract', 'multiply', 'divide'].includes(action)) {
        handleOperator(action);
      } else if (['sqrt', 'sqr', 'cube', 'inverse', 'sin', 'cos', 'tan', 'log', 'pi', 'e'].includes(action)) {
        handleAdvanced(action);
      } else if (action === 'clear') {
        currentInput = '0';
        previousInput = '';
        operation = null;
        resetNextInput = false;
      } else if (action === 'backspace') {
        if (currentInput.length > 1 && !resetNextInput) {
          currentInput = currentInput.slice(0, -1);
        } else {
          currentInput = '0';
        }
      } else if (action === 'percent') {
        currentInput = (parseFloat(currentInput) / 100).toString();
      } else if (action === 'decimal') {
        if (resetNextInput) {
          currentInput = '0.';
          resetNextInput = false;
        } else if (!currentInput.includes('.')) {
          currentInput += '.';
        }
      } else if (action === 'sign') {
        currentInput = (parseFloat(currentInput) * -1).toString();
      } else if (action === 'calculate') {
        calculate();
      }
      updateDisplay();
    });
  });

  window.addEventListener('keydown', (e) => {
    if (currentMode !== 'calc') return;
    if (e.key >= '0' && e.key <= '9') handleNumber(e.key);
    if (e.key === '.') document.querySelector('[data-action="decimal"]').click();
    if (e.key === '+') handleOperator('add');
    if (e.key === '-') handleOperator('subtract');
    if (e.key === '*') handleOperator('multiply');
    if (e.key === '/') handleOperator('divide');
    if (e.key === 'Enter' || e.key === '=') calculate();
    if (e.key === 'Backspace') document.querySelector('[data-action="backspace"]').click();
    if (e.key === 'Escape') document.querySelector('[data-action="clear"]').click();
    updateDisplay();
  });

  // Init unit converter select fields on startup
  populateUnitDropdowns();
</script>
