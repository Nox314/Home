<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X!Math Calculator</title>
<style>
  :root {
    --bg-color: #AB61E4;
    --header-bg: rgba(255, 255, 255, 0.2);
    --button-bg: rgba(255, 255, 255, 0.2);
    --button-bg-hover: rgba(255, 255, 255, 0.35);
    --button-highlight-bg: rgba(255, 255, 255, 0.35);
    --text-color: #fff;
    --title-color: #1f3e5a;
  }

  .dark {
    --header-bg: rgba(2, 14, 39, 0.3);
    --button-bg: rgba(2, 14, 39, 0.25);
    --button-bg-hover: rgba(255, 255, 255, 0.15);
    --button-highlight-bg: rgba(2, 14, 39, 0.4);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: var(--bg-color);
    min-height: 100vh;
    overflow: hidden;
    color: var(--text-color);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    transition: background-color 0.5s ease;
  }

  .calculator-wrapper {
    position: relative;
  }

  .calculator {
    position: relative;
    width: 320px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 60px rgba(24, 32, 79, 0.3), inset 0 0 0 1px rgba(255, 255, 255, 0.4);
    border-radius: 20px;
    z-index: 10;
    overflow: hidden;
    transition: transform 0.3s ease;
  }

  .calculator:hover {
    transform: translateY(-3px);
  }

  .calculator-header {
    background-color: var(--header-bg);
    padding: 24px 20px 16px 20px;
    text-align: right;
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  }

  .calculator-operation {
    font-size: 14px;
    opacity: 0.8;
    margin-bottom: 6px;
    min-height: 18px;
    word-break: break-all;
  }

  .calculator-operation-result {
    font-size: 38px;
    font-weight: 700;
    word-break: break-all;
    letter-spacing: -0.5px;
  }

  .calculator-button-wrapper {
    margin: 16px;
    display: grid;
    grid-gap: 8px;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 50px);
  }

  .calculator-button {
    display: flex;
    justify-content: center;
    align-items: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background-color: var(--button-bg);
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text-color);
    user-select: none;
    border-radius: 12px;
    backdrop-filter: blur(10px);
    transition: all 0.15s ease-in-out;
  }

  .calculator-button:hover {
    background-color: var(--button-bg-hover);
    transform: scale(1.04);
    border-color: rgba(255, 255, 255, 0.25);
  }

  .calculator-button:active {
    transform: scale(0.96);
  }

  .calculator-button.equal {
    grid-row: span 2;
    grid-column: 4;
    height: 108px;
    background-image: linear-gradient(135deg, #bd1d8c 0%, #7a41ce 100%);
    border: none;
  }

  .calculator-button.highlight {
    background-color: var(--button-highlight-bg);
  }

  .calculator-back {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    width: 85%;
    background-image: linear-gradient(135deg, #bd1d8c 0%, #7a41ce 100%);
    border-radius: 20px;
    transform: skewY(6deg);
    transform-origin: left top;
    z-index: 5;
    opacity: 0.8;
  }

  .title-wrapper {
    position: absolute;
    top: 100%;
    left: 0;
    transform: rotate(-90deg) translate(-70px, -65px);
    z-index: 10;
  }

  .title {
    font-size: 54px;
    font-weight: 900;
    color: var(--title-color);
    letter-spacing: -0.05em;
    user-select: none;
  }

  .toggle-theme {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    background-color: var(--button-bg);
    border-radius: 20px;
    color: var(--text-color);
    cursor: pointer;
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(4px);
    z-index: 15;
    transition: background-color 0.2s;
  }

  .toggle-theme:hover {
    background-color: var(--button-bg-hover);
  }
</style>
</head>
<body>

<main class="calculator-wrapper">
  <div class="title-wrapper">
    <div class="title">X!Math</div>
  </div>
  
  <section class="calculator">
    <button id="toggler" class="toggle-theme">Theme</button>
    
    <header class="calculator-header">
      <div class="calculator-operation" id="operation"></div>
      <div class="calculator-operation-result" id="result">0</div>
    </header>

    <div class="calculator-button-wrapper">
      <button type="button" class="calculator-button" data-action="clear">C</button>
      <button type="button" class="calculator-button" data-action="sqrt">√</button>
      <button type="button" class="calculator-button" data-action="power">^</button>
      <button type="button" class="calculator-button" data-action="divide">÷</button>
      
      <button type="button" class="calculator-button highlight" data-number="7">7</button>
      <button type="button" class="calculator-button highlight" data-number="8">8</button>
      <button type="button" class="calculator-button highlight" data-number="9">9</button>
      <button type="button" class="calculator-button" data-action="multiply">×</button>
      
      <button type="button" class="calculator-button highlight" data-number="4">4</button>
      <button type="button" class="calculator-button highlight" data-number="5">5</button>
      <button type="button" class="calculator-button highlight" data-number="6">6</button>
      <button type="button" class="calculator-button" data-action="subtract">-</button>
      
      <button type="button" class="calculator-button highlight" data-number="1">1</button>
      <button type="button" class="calculator-button highlight" data-number="2">2</button>
      <button type="button" class="calculator-button highlight" data-number="3">3</button>
      <button type="button" class="calculator-button equal" data-action="calculate">=</button>
      
      <button type="button" class="calculator-button highlight" data-action="sign">±</button>
      <button type="button" class="calculator-button highlight" data-number="0">0</button>
      <button type="button" class="calculator-button highlight" data-action="decimal">.</button>
      <button type="button" class="calculator-button" data-action="add">+</button>
    </div>
  </section>
  
  <div class="calculator-back"></div>
</main>

<script>
  const calculator = document.querySelector('.calculator');
  const toggler = document.getElementById('toggler');
  const operationEl = document.getElementById('operation');
  const resultEl = document.getElementById('result');

  let currentInput = '0';
  let previousInput = '';
  let operation = null;
  let resetNextInput = false;

  // Theme Toggler
  toggler.addEventListener('click', () => {
    document.body.classList.toggle('dark');
  });

  function updateDisplay() {
    resultEl.textContent = currentInput;
    operationEl.textContent = operation !== null ? `${previousInput} ${operation}` : '';
  }

  function handleNumber(num) {
    if (currentInput === '0' || resetNextInput) {
      currentInput = num;
      resetNextInput = false;
    } else {
      currentInput += num;
    }
  }

  function handleOperator(action) {
    const symbols = { add: '+', subtract: '-', multiply: '×', divide: '÷', power: '^' };
    
    if (operation !== null && !resetNextInput) {
      calculate();
    }
    
    previousInput = currentInput;
    operation = symbols[action];
    resetNextInput = true;
  }

  function calculate() {
    if (operation === null || previousInput === '') return;

    let prev = parseFloat(previousInput);
    let curr = parseFloat(currentInput);
    let res = 0;

    switch (operation) {
      case '+': res = prev + curr; break;
      case '-': res = prev - curr; break;
      case '×': res = prev * curr; break;
      case '÷': res = curr !== 0 ? prev / curr : 'Error'; break;
      case '^': res = Math.pow(prev, curr); break;
    }

    currentInput = typeof res === 'number' && !Number.isInteger(res) ? parseFloat(res.toFixed(8)).toString() : res.toString();
    operation = null;
    previousInput = '';
    resetNextInput = true;
  }

  // Button Event Listeners
  document.querySelectorAll('.calculator-button').forEach(button => {
    button.addEventListener('click', () => {
      const number = button.getAttribute('data-number');
      const action = button.getAttribute('data-action');

      if (number !== null) {
        handleNumber(number);
      } else if (['add', 'subtract', 'multiply', 'divide', 'power'].includes(action)) {
        handleOperator(action);
      } else if (action === 'clear') {
        currentInput = '0';
        previousInput = '';
        operation = null;
        resetNextInput = false;
      } else if (action === 'decimal') {
        if (resetNextInput) {
          currentInput = '0.';
          resetNextInput = false;
        } else if (!currentInput.includes('.')) {
          currentInput += '.';
        }
      } else if (action === 'sign') {
        currentInput = (parseFloat(currentInput) * -1).toString();
      } else if (action === 'sqrt') {
        let val = parseFloat(currentInput);
        currentInput = val >= 0 ? Math.sqrt(val).toString() : 'Error';
        resetNextInput = true;
      } else if (action === 'calculate') {
        calculate();
      }

      updateDisplay();
    });
  });

  // Optional: Keyboard Support
  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') handleNumber(e.key);
    if (e.key === '.') document.querySelector('[data-action="decimal"]').click();
    if (e.key === '+') handleOperator('add');
    if (e.key === '-') handleOperator('subtract');
    if (e.key === '*') handleOperator('multiply');
    if (e.key === '/') handleOperator('divide');
    if (e.key === 'Enter' || e.key === '=') calculate();
    if (e.key === 'Escape') document.querySelector('[data-action="clear"]').click();
    updateDisplay();
  });
</script>

</body>
</html>
