<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X!Registrieren - nox!314</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #624aff;
      --blue-dark: #4f37e0;
      --dark: #1c1c1c;
      --light: #f5f7fa;
      --line: #e0e4eb;
      --text: #333333;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #f5f7fa, #eef1ff);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { text-decoration: none; }
    #topMenu {
      background: white;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    #topMenu .wrap { display: flex; align-items: center; justify-content: space-between; height: 70px; }
    .logo { font-weight: 700; font-size: 24px; color: var(--dark); }
    .logo span { color: var(--blue); }
    .nav-links { display: flex; align-items: center; gap: 18px; }
    .nav-links a {
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: 500;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--blue); background: rgba(98,74,255,0.08); }
    .btn-register {
      background: var(--blue);
      color: white !important;
      border-radius: 8px;
      padding: 10px 20px !important;
      box-shadow: 0 4px 12px rgba(98,74,255,0.2);
    }
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
    }
    .register-box {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      width: min(980px, 100%);
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      overflow: hidden;
    }
    .form-side {
      padding: 52px 42px;
    }
    .title {
      text-align: center;
      margin-bottom: 28px;
    }
    .title h1 {
      margin: 0 0 10px;
      font-size: 2rem;
      color: var(--dark);
    }
    .title p {
      margin: 0;
      color: #666;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(98,74,255,0.1);
    }
    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 18px 0 22px;
      color: #555;
      font-size: 0.95rem;
    }
    .checkbox-row input { margin-top: 3px; }
    .primary-btn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, var(--blue), #8a7bff);
      color: white;
      font-weight: 700;
      padding: 14px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(98,74,255,0.2);
    }
    .muted {
      text-align: center;
      margin-top: 18px;
      color: #666;
      font-size: 0.95rem;
    }
    .muted a { color: var(--blue); font-weight: 600; }
    .socials {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 10px;
    }
    .socials button {
      border: 1px solid var(--line);
      background: white;
      border-radius: 8px;
      padding: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
    }
    .alt-text {
      text-align: center;
      color: #666;
      margin: 22px 0 14px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .alt-text::before, .alt-text::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .visual-side {
      background: linear-gradient(180deg, #f3f5ff, #eef2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 440px;
    }
    .robot {
      position: relative;
      width: 240px;
      height: 220px;
      border-radius: 32px;
      background: linear-gradient(145deg, #3b4048, #252a33 45%, #11151b);
      border: 2px solid #4a5364;
      box-shadow: inset 0 2px 8px rgba(255,255,255,0.1), 0 18px 40px rgba(42,45,65,0.2);
    }
    .robot::before, .robot::after {
      content: '';
      position: absolute;
      top: 36px;
      width: 12px;
      height: 52px;
      background: linear-gradient(180deg, #8e7dff, var(--blue));
      border-radius: 10px;
    }
    .robot::before { left: -12px; }
    .robot::after { right: -12px; }
    .robot-face {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 48px;
      height: 54px;
      border-radius: 12px;
      background: #0d1118;
      border: 1px solid #3d4652;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
    }
    .eye {
      width: 18px;
      height: 6px;
      border-radius: 999px;
      background: var(--blue);
    }
    .robot-mouth {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      width: 64px;
      height: 10px;
      border-radius: 999px;
      background: #0a0d12;
      border: 1px solid #292f39;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }
    .robot-mouth span {
      width: 6px;
      height: 2px;
      border-radius: 99px;
      background: #ff4d7d;
      display: block;
    }
    footer {
      background: white;
      border-top: 1px solid var(--line);
      padding: 26px 0;
      text-align: center;
      color: #666;
    }
    .footer-links {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .footer-links a {
      color: var(--blue);
      font-weight: 500;
    }
    @media (max-width: 768px) {
      .register-box { grid-template-columns: 1fr; }
      .visual-side { min-height: 260px; }
      .nav-links { display: none; }
      .hamburger { display: flex; flex-direction: column; gap: 6px; background: none; border: none; padding: 8px; cursor: pointer; }
      .hamburger span { width: 24px; height: 3px; border-radius: 2px; background: var(--dark); }
      .nav-links.mobile-open { display: flex; position: absolute; top: 70px; left: 0; right: 0; flex-direction: column; background: white; padding: 16px 20px; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <nav id="topMenu">
    <div class="wrap">
      <a href="/Home/index.html" class="logo">nox<span>!</span>314</a>
      <button class="hamburger" id="hamburger" aria-label="Menü öffnen">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="navLinks">
        <a href="/Home/index.html">Start</a>
        <a href="/Home/date.html">Weltuhr</a>
        <a href="/Home/iss.html">Iss</a>
        <a href="/Home/info.html">Info</a>
        <a href="/Home/auth/login/index.html">Login</a>
        <a href="/Home/auth/register/index.html" class="active btn-register">Registrieren</a>
      </div>
    </div>
  </nav>

  <main class="main-container">
    <div class="register-box">
      <div class="form-side">
        <div class="title">
          <h1>Willkommen bei X!314</h1>
          <p>Erstelle ein kostenloses Konto und nutze alle X!Apps.</p>
        </div>

        <div class="socials">
          <button type="button">Google</button>
          <button type="button">Apple</button>
        </div>

        <div class="alt-text">oder mit E-Mail registrieren</div>

        <form id="registerForm">
          <div class="form-group">
            <label for="fullname">Vollständiger Name</label>
            <input id="fullname" name="fullname" type="text" placeholder="Max Mustermann" required />
          </div>

          <div class="form-group">
            <label for="email">E-Mail</label>
            <input id="email" name="email" type="email" placeholder="ihre@email.com" required />
          </div>

          <div class="form-group">
            <label for="password">Passwort</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required />
          </div>

          <div class="form-group">
            <label for="passwordConfirm">Passwort bestätigen</label>
            <input id="passwordConfirm" name="passwordConfirm" type="password" placeholder="••••••••" required />
          </div>

          <div class="checkbox-row">
            <input type="checkbox" id="terms" required />
            <label for="terms">Ich akzeptiere die Nutzungsbedingungen und Datenschutzerklärung.</label>
          </div>

          <button class="primary-btn" type="submit">Kostenlos registrieren</button>
        </form>

        <div class="muted">Du hast schon ein Konto? <a href="/Home/auth/login/index.html">Jetzt anmelden</a></div>
      </div>

      <div class="visual-side">
        <div class="robot">
          <div class="robot-face">
            <span class="eye"></span>
            <span class="eye"></span>
          </div>
          <div class="robot-mouth"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div>© 2026 nox!314</div>
      <div class="footer-links">
        <a href="/Home/sourcecodes.html">Quellcode</a>
        <a href="/Home/news.html">News</a>
        <a href="/Home/sitemap.html">Sitemap</a>
      </div>
    </div>
  </footer>

  <script src="/Home/auth/auth.js"></script>
  <script>
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');
    const registerForm = document.getElementById('registerForm');

    hamburger.addEventListener('click', () => navLinks.classList.toggle('mobile-open'));
    navLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', () => navLinks.classList.remove('mobile-open')));

    async function redirectIfLoggedIn() {
      const user = await window.auth.getCurrentUser();
      if (user) {
        window.location.href = '/Home/profile.html';
      }
    }

    registerForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;
      const terms = document.getElementById('terms').checked;

      if (!terms) {
        alert('Bitte akzeptiere die Nutzungsbedingungen.');
        return;
      }

      if (password !== passwordConfirm) {
        alert('Die Passwörter stimmen nicht überein.');
        return;
      }

      const result = await window.auth.register(fullname, email, password);
      if (!result.success) {
        alert(result.message || 'Registrierung fehlgeschlagen');
        return;
      }

      alert('Registrierung erfolgreich. Du kannst dich jetzt anmelden.');
      window.location.href = '/Home/auth/login/index.html';
    });

    redirectIfLoggedIn();
  </script>
</body>
</html>
