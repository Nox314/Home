<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X!Search – nox!314</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --blue: #624aff;
        --blue-hover: #4f37e0;
        --dark: #1c1c1c;
        --light: #f5f7fa;
        --border: #e0e4eb;
        --text: #333;
        --radius: 14px;
        --shadow: 0 6px 20px rgba(0,0,0,0.08);
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background: var(--light);
        color: var(--text);
        transition: 0.3s;
    }

    .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 30px;
    }

    h1 {
        text-align: center;
        font-size: 46px;
        font-weight: 700;
        margin-top: 20px;
        color: var(--dark);
    }

    h1 span {
        color: var(--blue);
    }

    .search-box {
        margin: 40px auto;
        max-width: 500px;
        text-align: center;
    }

    .search-box input {
        width: 100%;
        padding: 16px;
        border-radius: var(--radius);
        border: 2px solid var(--border);
        font-size: 17px;
        background: white;
        transition: 0.2s;
    }

    .search-box input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(98,74,255,0.15);
        outline: none;
    }

    .search-box button {
        margin-top: 14px;
        width: 100%;
        padding: 16px;
        border-radius: var(--radius);
        border: none;
        background: var(--blue);
        color: white;
        font-weight: 600;
        font-size: 17px;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 4px 14px rgba(98,74,255,0.25);
    }

    .search-box button:hover {
        background: var(--blue-hover);
        transform: translateY(-2px);
    }

    #results {
        margin-top: 20px;
    }

    .result-card {
        background: white;
        border-radius: var(--radius);
        padding: 22px;
        margin: 18px 0;
        box-shadow: var(--shadow);
        transition: 0.2s;
    }

    .result-card:hover {
        transform: translateY(-3px);
    }

    .result-card h3 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
        color: var(--dark);
    }

    .result-card a {
        color: var(--blue);
        font-weight: 600;
        text-decoration: none;
    }

    .result-card p {
        margin-top: 10px;
        color: #555;
        line-height: 1.6;
    }

    .result-card img {
        width: 100%;
        border-radius: 12px;
        margin-top: 12px;
    }

    .import-box {
        margin-top: 40px;
        background: white;
        padding: 22px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        max-width: 420px;
        margin-left: auto;
        margin-right: auto;
    }

    .import-box h2 {
        text-align: center;
        color: var(--blue);
        font-size: 22px;
        margin-bottom: 12px;
    }

    .import-box input {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: var(--radius);
        border: 2px solid var(--border);
        font-size: 15px;
        background: white;
    }

    .import-box button {
        width: 100%;
        margin-top: 14px;
        padding: 14px;
        border-radius: var(--radius);
        border: none;
        background: var(--blue);
        color: white;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    .import-box button:hover {
        background: var(--blue-hover);
    }
</style>
</head>
<body>

<div class="wrap">

    <h1>X!<span>Search</span></h1>

    <div class="search-box">
        <input id="query" placeholder="Suchbegriff eingeben...">
        <button onclick="search()">Suchen</button>
    </div>

    <div id="results"></div>

    <div class="import-box">
        <h2>Import</h2>
        <input id="importUrl" placeholder="Domain (example.com)">
        <button onclick="importEntry()">Hinzufügen</button>
    </div>

</div>

<script>
let entries = [];
let githubUser = "nox314";
let githubRepo = "Home";
let githubFile = "websites.txt";
// HIER deinen Token wieder einsetzen:
let githubToken = "DEIN_GITHUB_TOKEN_HIER";

// Deep Mode Easter Egg
window.XSEARCH_DEEP = false;

// TXT laden: jede Zeile = URL
fetch(`https://raw.githubusercontent.com/${githubUser}/${githubRepo}/main/${githubFile}`)
    .then(r => r.text())
    .then(text => {
        text.split("\n").forEach(line => {
            const url = line.trim();
            if (url.length > 0) entries.push({ url });
        });
    });

// Metadaten aus Website extrahieren
async function extractMeta(url) {
    try {
        const html = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent("https://" + url))
            .then(r => r.json())
            .then(d => d.contents);

        const doc = new DOMParser().parseFromString(html, "text/html");

        const title = doc.querySelector("title")?.innerText || url;
        const desc =
            doc.querySelector('meta[name="description"]')?.content ||
            doc.querySelector('meta[property="og:description"]')?.content ||
            "Keine Beschreibung gefunden";

        const preview =
            doc.querySelector('meta[property="og:image"]')?.content ||
            doc.querySelector('meta[name="twitter:image"]')?.content ||
            null;

        return { title, desc, preview };

    } catch (e) {
        return {
            title: url,
            desc: "Die Website konnte nicht analysiert werden.",
            preview: null
        };
    }
}

// Deep Crawler (Depth bis maxDepth)
async function deepCrawler(domain, maxPages = 50, maxDepth = 3) {
    const visited = new Set();
    const queue = [{ url: "https://" + domain, depth: 1 }];
    const found = [];

    while (queue.length > 0 && found.length < maxPages) {
        const { url, depth } = queue.shift();

        if (visited.has(url)) continue;
        visited.add(url);

        try {
            const html = await fetch("https://api.allorigins.win/get?url=" + encodeURIComponent(url))
                .then(r => r.json())
                .then(d => d.contents);

            found.push(url);

            if (depth < maxDepth) {
                const doc = new DOMParser().parseFromString(html, "text/html");
                const anchors = Array.from(doc.querySelectorAll("a[href]"));

                anchors.forEach(a => {
                    let href = a.getAttribute("href");
                    if (!href) return;

                    try {
                        const full = new URL(href, url).href;
                        const host = new URL(full).hostname;

                        if (host === domain && !visited.has(full)) {
                            queue.push({ url: full, depth: depth + 1 });
                        }
                    } catch {}
                });
            }

        } catch (e) {
            console.log("Crawler error:", e);
        }
    }

    // zurück zu „domain/pfad“ ohne https://
    return found.map(u => u.replace("https://", ""));
}

// Import mit Deep Crawl
async function importEntry() {
    const url = document.getElementById("importUrl").value.trim();
    if (!url) return alert("Bitte Domain eingeben!");

    if (entries.some(e => e.url.toLowerCase() === url.toLowerCase())) {
        alert("Diese Website existiert bereits!");
        return;
    }

    const depth = window.XSEARCH_DEEP ? 5 : 3;
    const maxPages = window.XSEARCH_DEEP ? 200 : 80;

    const crawled = await deepCrawler(url, maxPages, depth);

    crawled.forEach(link => {
        if (!entries.some(e => e.url.toLowerCase() === link.toLowerCase())) {
            entries.push({ url: link });
        }
    });

    const newTXT = entries.map(e => e.url).join("\n");

    // TXT in GitHub aktualisieren
    try {
        const fileInfo = await fetch(`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${githubFile}`)
            .then(r => r.json());

        await fetch(`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${githubFile}`, {
            method: "PUT",
            headers: {
                "Authorization": `Bearer ${githubToken}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: "X!Search deep crawl update",
                content: btoa(newTXT),
                sha: fileInfo.sha
            })
        });

        alert(`Import abgeschlossen: ${crawled.length} Seiten gefunden und TXT aktualisiert!`);
    } catch (e) {
        console.log(e);
        alert("Fehler beim Aktualisieren der TXT in GitHub.");
    }
}

// Easter Egg: „nox314“ im Suchfeld → Deep Mode
function triggerDeepMode() {
    document.body.style.background = "#000";
    document.body.style.color = "#0f0";
    window.XSEARCH_DEEP = true;

    const msg = document.createElement("div");
    msg.style.position = "fixed";
    msg.style.bottom = "20px";
    msg.style.right = "20px";
    msg.style.padding = "12px 18px";
    msg.style.borderRadius = "10px";
    msg.style.background = "rgba(0,0,0,0.8)";
    msg.style.color = "#0f0";
    msg.style.fontFamily = "monospace";
    msg.style.zIndex = "9999";
    msg.textContent = "X!Search Deep Mode – nox314";

    document.body.appendChild(msg);

    setTimeout(() => {
        document.body.style.background = "";
        document.body.style.color = "";
        msg.remove();
    }, 5000);
}

// Suche
async function search() {
    const q = document.getElementById("query").value.toLowerCase();
    const out = document.getElementById("results");
    out.innerHTML = "";

    // Easter Egg
    if (q === "nox314") {
        triggerDeepMode();
        return;
    }

    const results = entries.filter(e =>
        e.url.toLowerCase().includes(q)
    );

    if (!results.length) {
        out.innerHTML = "<p style='text-align:center;color:#624aff;font-weight:600;'>Keine Ergebnisse gefunden.</p>";
        return;
    }

    for (const e of results) {
        const meta = await extractMeta(e.url);

        const div = document.createElement("div");
        div.className = "result-card";

        div.innerHTML = `
            <h3>${meta.title}</h3>
            <a href="https://${e.url}" target="_blank">${e.url}</a>
            <p><strong>Beschreibung:</strong> ${meta.desc}</p>
            ${meta.preview ? `<img src="${meta.preview}" alt="Preview">` : ""}
        `;

        out.appendChild(div);
    }
}
</script>

</body>
</html>
