<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>x!search – nox!314</title>
<link href="https://fonts.googleapis.com/css2?family=inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #624aff; --blue-hover: #4f37e0; --dark: #1c1c1c; --light: #f5f7fa;
  --border: #e0e4eb; --text: #333; --radius: 14px;
  --shadow: 0 6px 20px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; }
body { margin:0; font-family:'Inter',sans-serif; background:var(--light); color:var(--text); }

/* Topbar */
.topbar {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 30px; background:white; border-bottom:1px solid var(--border);
}
.topbar .logo { font-size:26px; font-weight:700; color:var(--dark); }
.topbar .logo span { color:var(--blue); }
.topbar .nav-links { display:flex; align-items:center; gap:18px; font-size:14px; }
.topbar .nav-links a { text-decoration:none; color:#555; }
.topbar .nav-links a:hover { color:var(--blue); }
.topbar .user-pill {
  padding:6px 12px; border-radius:999px; background:#eee; font-size:13px;
}

/* Layout */
.main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 30px 40px;
  display:grid;
  grid-template-columns: minmax(0, 2.5fr) minmax(260px, 1fr);
  gap:24px;
}

/* Search area */
.search-area h1 {
  font-size:40px; font-weight:700; margin:10px 0 6px; color:var(--dark);
}
.search-area h1 span { color:var(--blue); }

.search-box { margin:10px auto 6px; max-width:620px; position:relative; display:flex; gap:8px; }
.search-box-inner { position:relative; flex:1; }
.search-box input {
  width:100%; padding:12px 40px 12px 14px; border-radius:28px;
  border:2px solid var(--border); font-size:16px; background:white; transition:0.2s;
}
.search-box input:focus {
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(98,74,255,0.15);
  outline:none;
}
.search-box .count {
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  font-size:12px; color:#999;
}
.search-buttons {
  display:flex; flex-direction:column; gap:6px;
}
.search-buttons button {
  border:none; border-radius:999px; padding:8px 14px;
  font-size:13px; cursor:pointer; background:white; box-shadow:var(--shadow);
}
.search-buttons button:hover { background:#f0f0ff; }

/* Filterbar */
.filterbar {
  display:flex; gap:20px; margin:8px auto 4px; max-width:620px;
  color:#666; font-size:14px;
}
.filterbar span { cursor:pointer; padding-bottom:6px; }
.filterbar .active { border-bottom:2px solid var(--blue); color:var(--blue); }

/* Suggestions */
.suggestions {
  list-style:none; margin:0; padding:0;
  background:white; border-radius:12px;
  box-shadow:var(--shadow); position:absolute;
  width:100%; top:40px; left:0; z-index:20;
}
.suggestions li {
  padding:8px 14px; cursor:pointer; border-bottom:1px solid #eee;
  font-size:14px;
}
.suggestions li:last-child { border-bottom:none; }
.suggestions li span.hint { color:#999; font-size:12px; margin-left:6px; }
.suggestions li:hover { background:#f3f3f3; }

/* Stats & trending */
.stats { color:#888; font-size:13px; min-height:20px; margin:6px 0 4px; }
.trending {
  margin-top:4px; font-size:13px; color:#666;
}
.trending span.tag {
  display:inline-block; margin:2px 4px 0 0; padding:4px 10px;
  border-radius:999px; background:white; box-shadow:0 2px 6px rgba(0,0,0,0.05);
  cursor:pointer;
}

/* Results */
#results { margin-top:10px; }
.result-card {
  background:white; border-radius:var(--radius); padding:16px 20px; margin:10px 0;
  box-shadow:var(--shadow); transition:0.15s; cursor:pointer;
}
.result-card:hover, .result-card.active {
  transform:translateY(-2px); border:1px solid var(--blue);
}
.result-header {
  display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
}
.result-card h3 {
  margin:0; font-size:18px; font-weight:600; color:var(--dark); overflow-wrap:anywhere;
}
.result-card h3 mark, .result-card .snippet mark {
  background:rgba(98,74,255,0.15); color:var(--blue);
  border-radius:3px; padding:0 2px;
}
.result-card a {
  color:var(--blue); font-weight:600; text-decoration:none; font-size:13px;
  display:block; margin-top:2px; overflow-wrap:anywhere;
}
.result-card .snippet {
  margin-top:6px; color:#555; line-height:1.6; font-size:13px;
  word-break:break-all;
}
.badges {
  display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;
}
.badge {
  font-size:11px; padding:3px 8px; border-radius:999px;
  background:#f0f2ff; color:#555;
}

/* Pagination */
.pagination {
  display:flex; gap:6px; margin-top:12px; font-size:13px;
}
.pagination button {
  border:none; background:white; padding:6px 10px; border-radius:999px;
  cursor:pointer; box-shadow:var(--shadow);
}
.pagination button.active { background:var(--blue); color:white; }

/* Sidepanel */
.sidepanel {
  background:white; padding:16px 18px; border-radius:var(--radius);
  box-shadow:var(--shadow); min-height:120px;
}
.sidepanel h2 { margin:0 0 6px; font-size:18px; }
.sidepanel p { font-size:13px; color:#555; margin:4px 0; }
.sidepanel .meta { font-size:12px; color:#888; margin-top:8px; }
.sidepanel .history-title { margin-top:12px; font-size:13px; font-weight:600; }
.sidepanel ul { list-style:none; padding-left:0; margin:4px 0; }
.sidepanel li { font-size:12px; color:#555; cursor:pointer; padding:2px 0; }
.sidepanel li:hover { color:var(--blue); }

/* Settings */
.settings {
  margin-top:14px; font-size:12px; color:#666;
}
.settings label { display:block; margin-bottom:4px; }

/* Footer */
.footer {
  margin-top:20px; padding:16px 30px; text-align:center;
  color:#777; font-size:13px; border-top:1px solid var(--border);
}
.footer .links a {
  margin:0 8px; color:#555; text-decoration:none;
}
.footer .links a:hover { color:var(--blue); }

.loading { text-align:center; color:var(--blue); font-weight:600; padding:20px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">x!<span>search</span></div>
  <div class="nav-links">
    <a href="#">Web</a>
    <a href="#">Images</a>
    <a href="#">News</a>
    <a href="#">Labs</a>
    <span class="user-pill">nox!314</span>
  </div>
</div>

<div class="main">
  <div class="search-area">
    <h1>x!<span>search</span></h1>

    <div class="search-box">
      <div class="search-box-inner">
        <input id="query" placeholder="Suchbegriff eingeben…" autofocus autocomplete="off">
        <span class="count" id="count"></span>
        <ul id="suggestions" class="suggestions"></ul>
      </div>
      <div class="search-buttons">
        <button id="btn-search">Suche</button>
        <button id="btn-lucky">I’m feeling lucky</button>
      </div>
    </div>

    <div class="filterbar">
      <span class="active">Web</span>
      <span>Bilder</span>
      <span>News</span>
      <span>Videos</span>
      <span>Code</span>
    </div>

    <div class="stats" id="stats"></div>
    <div class="trending" id="trending"></div>

    <div id="results"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="sidepanel" id="sidepanel">
    <h2>x!search Info</h2>
    <p>Tippe, drücke <b>Enter</b> oder klicke auf „Suche“.</p>
    <p><b>Shortcuts:</b> <code>/</code> Fokus · <code>↑/↓</code> Vorschläge · <code>Esc</code> leeren.</p>
    <div class="meta" id="meta-info"></div>

    <div class="settings">
      <label>
        Ergebnisse pro Seite:
        <input type="number" id="pageSize" min="5" max="50" value="10" style="width:60px;">
      </label>
    </div>

    <div class="history">
      <div class="history-title">Letzte Suchen</div>
      <ul id="history-list"></ul>
    </div>
  </div>
</div>

<footer class="footer">
  <div>Deutschland</div>
  <div class="links">
    <a href="#">Über</a>
    <a href="#">Datenschutz</a>
    <a href="#">Einstellungen</a>
    <a href="#">Feedback</a>
  </div>
</footer>

<script>
const githubuser = "nox314";
const githubrepo = "home";
const githubfile = "websites.txt";

function tokenize(text) {
  return text
    .toLowerCase()
    .replace(/https?:\/\//g, "")
    .split(/[\/\.\-\_\?\&\=\#\+\~\:]+/)
    .flatMap(t => t.split(/(?=[A-Z])/))
    .filter(t => t.length > 1 && !/^\d+$/.test(t));
}

function normalize(word) {
  return word
    .replace(/ä/g, "a").replace(/ö/g, "o")
    .replace(/ü/g, "u").replace(/ß/g, "ss");
}

function stem(w) {
  const endings = ["ungen", "eren", "isch", "lich", "heit", "keit", "ung", "ern", "em",
                   "en", "er", "es", "st", "e", "n", "s"];
  for (const end of endings) {
    if (w.length > end.length + 3 && w.endsWith(end)) return w.slice(0, -end.length);
  }
  return w;
}

function analyze(text) {
  return [...new Set(tokenize(normalize(text)).map(stem))];
}

const entries = [];
const index = new Map();
const df = new Map();
let builtAt = 0;

function buildIndex() {
  index.clear(); df.clear();
  entries.forEach((e, i) => {
    const terms = analyze(e.url);
    e._terms = terms;
    const freq = new Map();
    terms.forEach(t => freq.set(t, (freq.get(t) || 0) + 1));
    freq.forEach((tf, term) => {
      if (!index.has(term)) index.set(term, new Map());
      index.get(term).set(i, tf);
      df.set(term, (df.get(term) || 0) + 1);
    });
  });
  builtAt = performance.now();
  renderTrending();
}

function levenshtein(a, b) {
  const dp = Array.from({length: a.length + 1}, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = Math.min(
        dp[i-1][j] + 1,
        dp[i][j-1] + 1,
        dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)
      );
  return dp[a.length][b.length];
}

function expandTerm(term, tolerance = 2) {
  if (index.has(term)) return [term];
  const candidates = [];
  for (const t of index.keys()) {
    if (Math.abs(t.length - term.length) <= tolerance && levenshtein(term, t) <= tolerance) {
      candidates.push(t);
    }
  }
  return candidates;
}

function doSearch(query) {
  const t0 = performance.now();
  const queryTerms = analyze(query);
  if (!queryTerms.length) return { results: [], ms: 0, matchedTerms: [] };

  const scores = new Map();
  const matchedTerms = [];

  for (const qt of queryTerms) {
    const variants = expandTerm(qt, qt.length > 5 ? 2 : 1);
    for (const v of variants) {
      const postings = index.get(v);
      if (!postings) continue;
      matchedTerms.push(v);

      const idf = Math.log(1 + entries.length / postings.size);
      const isFuzzy = (v !== qt) ? 0.5 : 1;

      postings.forEach((tf, i) => {
        const score = idf * (1 + Math.log(tf)) * isFuzzy;
        scores.set(i, (scores.get(i) || 0) + score);
      });
    }
  }

  const final = [...scores.entries()].map(([i, score]) => {
    const e = entries[i];
    const domain = e.url.split("/")[0].toLowerCase();
    let bonus = 1;
    queryTerms.forEach(qt => { if (domain.includes(qt)) bonus *= 1.6; });
    if (queryTerms.every(qt => e._terms.includes(qt))) bonus *= 1.3;
    bonus *= 1 / (1 + e.url.length / 200);
    return { e, score: score * bonus };
  });

  final.sort((a, b) => b.score - a.score);
  return { results: final, ms: (performance.now() - t0), matchedTerms };
}

const input = document.getElementById("query");
const out = document.getElementById("results");
const statsEl = document.getElementById("stats");
const countEl = document.getElementById("count");
const suggestionsEl = document.getElementById("suggestions");
const trendingEl = document.getElementById("trending");
const sidepanel = document.getElementById("sidepanel");
const metaInfo = document.getElementById("meta-info");
const historyList = document.getElementById("history-list");
const paginationEl = document.getElementById("pagination");
const pageSizeInput = document.getElementById("pageSize");

let debounceTimer;
let lastResults = [];
let lastMatchedTerms = [];
let currentPage = 1;

function escapeHtml(s) {
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}

function highlight(text, terms) {
  let html = escapeHtml(text);
  terms.forEach(t => {
    const frag = t.slice(0, Math.max(3, t.length - 1));
    const re = new RegExp("(" + frag.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-zäöüß0-9]*)", "gi");
    html = html.replace(re, "<mark>$1</mark>");
  });
  return html;
}

function renderTrending() {
  if (!entries.length) return;
  const termCounts = [];
  index.forEach((map, term) => {
    termCounts.push({ term, count: map.size });
  });
  termCounts.sort((a,b) => b.count - a.count);
  const top = termCounts.slice(0, 8);
  if (!top.length) return;
  trendingEl.innerHTML = "Trending: " + top.map(t =>
    `<span class="tag" data-term="${escapeHtml(t.term)}">${escapeHtml(t.term)}</span>`
  ).join("");
  trendingEl.querySelectorAll(".tag").forEach(tag => {
    tag.onclick = () => {
      input.value = tag.dataset.term;
      runSearch();
    };
  });
}

function saveHistory(q) {
  if (!q) return;
  const key = "xsearch_history";
  const raw = localStorage.getItem(key);
  let arr = raw ? JSON.parse(raw) : [];
  arr = arr.filter(x => x !== q);
  arr.unshift(q);
  if (arr.length > 10) arr = arr.slice(0,10);
  localStorage.setItem(key, JSON.stringify(arr));
  renderHistory();
}

function renderHistory() {
  const key = "xsearch_history";
  const raw = localStorage.getItem(key);
  let arr = raw ? JSON.parse(raw) : [];
  historyList.innerHTML = arr.map(q => `<li>${escapeHtml(q)}</li>`).join("");
  historyList.querySelectorAll("li").forEach(li => {
    li.onclick = () => {
      input.value = li.textContent;
      runSearch();
    };
  });
}

function renderSuggestions() {
  const q = input.value.trim().toLowerCase();
  if (!q) { suggestionsEl.innerHTML = ""; return; }

  const fromEntries = entries
    .map(e => e.url)
    .filter(u => u.toLowerCase().includes(q))
    .slice(0, 6);

  const key = "xsearch_history";
  const raw = localStorage.getItem(key);
  let hist = raw ? JSON.parse(raw) : [];
  hist = hist.filter(h => h.toLowerCase().includes(q)).slice(0,4);

  const items = [];
  fromEntries.forEach(u => items.push({ text: u, hint: "Treffer" }));
  hist.forEach(h => items.push({ text: h, hint: "Verlauf" }));

  if (!items.length) { suggestionsEl.innerHTML = ""; return; }

  suggestionsEl.innerHTML = items.map(it =>
    `<li><span>${escapeHtml(it.text)}</span><span class="hint">${escapeHtml(it.hint)}</span></li>`
  ).join("");

  suggestionsEl.querySelectorAll("li").forEach(li => {
    li.onclick = () => {
      input.value = li.querySelector("span").textContent;
      suggestionsEl.innerHTML = "";
      runSearch();
    };
  });
}

function showPanel(domain, url) {
  sidepanel.innerHTML = `
    <h2>${escapeHtml(domain)}</h2>
    <p>Gefundene Seite aus deinem GitHub-Index.</p>
    <p><b>URL:</b> ${escapeHtml(url)}</p>
    <div class="meta">
      Index: ${entries.length} Seiten · Begriffe: ${index.size} · aufgebaut in ${builtAt.toFixed(0)}ms
    </div>
    <div class="settings">
      <label>
        Ergebnisse pro Seite:
        <input type="number" id="pageSize" min="5" max="50" value="${pageSizeInput.value}" style="width:60px;">
      </label>
    </div>
    <div class="history">
      <div class="history-title">Letzte Suchen</div>
      <ul id="history-list"></ul>
    </div>
  `;
  // re-bind pageSize and history
  const newPageSizeInput = document.getElementById("pageSize");
  newPageSizeInput.onchange = () => {
    pageSizeInput.value = newPageSizeInput.value;
    renderResults();
  };
  const newHistoryList = document.getElementById("history-list");
  const key = "xsearch_history";
  const raw = localStorage.getItem(key);
  let arr = raw ? JSON.parse(raw) : [];
  newHistoryList.innerHTML = arr.map(q => `<li>${escapeHtml(q)}</li>`).join("");
  newHistoryList.querySelectorAll("li").forEach(li => {
    li.onclick = () => {
      input.value = li.textContent;
      runSearch();
    };
  });
}

function renderResults() {
  const pageSize = parseInt(pageSizeInput.value || "10", 10);
  const total = lastResults.length;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  if (currentPage > pages) currentPage = pages;

  const start = (currentPage - 1) * pageSize;
  const slice = lastResults.slice(start, start + pageSize);

  countEl.textContent = total || "";
  if (total) {
    statsEl.innerHTML = `Ungefähr <b>${total}</b> Ergebnisse (Seite ${currentPage}/${pages})`;
  } else {
    statsEl.innerHTML = "";
  }

  if (!slice.length) {
    out.innerHTML = "<p style='text-align:center;color:#624aff;font-weight:600;'>Keine Ergebnisse gefunden.</p>";
    paginationEl.innerHTML = "";
    return;
  }

  const frag = document.createDocumentFragment();
  slice.forEach(({ e }, idx) => {
    const parts = e.url.split("/");
    const domain = parts[0];
    const path = parts.slice(1).join(" › ") || "Startseite";

    const card = document.createElement("div");
    card.className = "result-card";
    card.innerHTML = `
      <div class="result-header">
        <div>
          <h3>${highlight(domain, lastMatchedTerms)}</h3>
          <a href="https://${escapeHtml(e.url)}" target="_blank" rel="noopener">${escapeHtml(domain)}</a>
        </div>
      </div>
      <div class="snippet">${path ? highlight(path, lastMatchedTerms) : ""}</div>
      <div class="badges">
        <span class="badge">${e.url.length < 40 ? "Kurz" : "Lang"}e URL</span>
        <span class="badge">${path === "Startseite" ? "Startseite" : "Pfad vorhanden"}</span>
        <span class="badge">Index-Eintrag #${entries.indexOf(e)+1}</span>
      </div>
    `;
    card.addEventListener("click", () => showPanel(domain, e.url));
    frag.appendChild(card);
  });
  out.innerHTML = "";
  out.appendChild(frag);

  // Pagination
  paginationEl.innerHTML = "";
  if (pages > 1) {
    for (let p = 1; p <= pages; p++) {
      const btn = document.createElement("button");
      btn.textContent = p;
      if (p === currentPage) btn.classList.add("active");
      btn.onclick = () => { currentPage = p; renderResults(); };
      paginationEl.appendChild(btn);
    }
  }
}

function runSearch() {
  const q = input.value.trim();

  if (q.toLowerCase() === "nox314") {
    document.body.style.background = "#000";
    document.body.style.color = "#0f0";
    setTimeout(() => { document.body.style.background=""; document.body.style.color=""; }, 5000);
    out.innerHTML = "<p style='text-align:center;color:#624aff;font-weight:600;'>Deep Mode!</p>";
    return;
  }

  if (!q) {
    out.innerHTML = "";
    statsEl.innerHTML = "";
    countEl.textContent = "";
    suggestionsEl.innerHTML = "";
    return;
  }

  const { results, ms, matchedTerms } = doSearch(q);
  lastResults = results;
  lastMatchedTerms = matchedTerms;
  currentPage = 1;

  statsEl.innerHTML = results.length
    ? `Ungefähr <b>${results.length}</b> Ergebnisse (<b>${ms.toFixed(1)}</b> ms)`
    : "";

  saveHistory(q);
  renderResults();
}

input.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    renderSuggestions();
  }, 60);
});

document.getElementById("btn-search").onclick = () => runSearch();
document.getElementById("btn-lucky").onclick = () => {
  const q = input.value.trim();
  const { results } = doSearch(q || "");
  if (results.length) window.open("https://" + results[0].e.url, "_blank");
};

pageSizeInput.onchange = () => {
  currentPage = 1;
  renderResults();
};

// Keyboard shortcuts
document.addEventListener("keydown", (e) => {
  if (e.key === "/") {
    e.preventDefault();
    input.focus();
  }
  if (e.key === "Escape") {
    input.value = "";
    suggestionsEl.innerHTML = "";
    out.innerHTML = "";
    statsEl.innerHTML = "";
    countEl.textContent = "";
  }
  if (e.key === "Enter" && document.activeElement === input) {
    runSearch();
  }
});

// Daten laden
fetch(`https://raw.githubusercontent.com/${githubuser}/${githubrepo}/main/${githubfile}`)
  .then(r => r.text())
  .then(text => {
    text.split("\n").forEach(line => {
      const url = line.trim();
      if (url.length > 0) entries.push({ url });
    });
    buildIndex();
    statsEl.innerHTML = `Index bereit: <b>${entries.length}</b> Seiten · <b>${index.size}</b> eindeutige Begriffe · aufgebaut in ${(builtAt - 0).toFixed(0)}ms`;
    renderHistory();
  })
  .catch(() => {
    statsEl.innerHTML = "Daten konnten nicht geladen werden.";
  });
</script>
</body>
</html>
