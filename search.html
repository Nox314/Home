<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X!Search – nox!314</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
    :root {
        --proton-blue: #624aff;
        --proton-blue-hover: #4f37e0;
        --proton-dark: #1c1c1c;
        --proton-light: #f5f7fa;
        --proton-border: #e0e4eb;
        --proton-text: #333333;
        --radius: 12px;
        --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
        --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        background-color: var(--proton-light);
        color: var(--proton-text);
    }

    .wrap {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        font-size: 42px;
        font-weight: 700;
        color: var(--proton-dark);
        margin-top: 40px;
    }

    h1 span {
        color: var(--proton-blue);
    }

    .search-box {
        margin: 30px auto;
        max-width: 500px;
        text-align: center;
    }

    .search-box input {
        width: 100%;
        padding: 14px;
        border-radius: var(--radius);
        border: 2px solid var(--proton-border);
        font-size: 16px;
        background: white;
        outline: none;
        transition: 0.2s;
    }

    .search-box input:focus {
        border-color: var(--proton-blue);
        box-shadow: 0 0 0 3px rgba(98,74,255,0.15);
    }

    .search-box button {
        margin-top: 12px;
        width: 100%;
        padding: 14px;
        border-radius: var(--radius);
        border: none;
        background: var(--proton-blue);
        color: white;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 4px 12px rgba(98,74,255,0.25);
    }

    .search-box button:hover {
        background: var(--proton-blue-hover);
        transform: translateY(-2px);
    }

    .result-card {
        background: white;
        border-radius: var(--radius);
        padding: 20px;
        margin: 15px 0;
        box-shadow: var(--shadow-sm);
        border: 1px solid transparent;
        transition: 0.2s;
    }

    .result-card:hover {
        box-shadow: var(--shadow-md);
        border-color: rgba(98,74,255,0.2);
        transform: translateY(-2px);
    }

    .result-card h3 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: var(--proton-dark);
    }

    .result-card a {
        color: var(--proton-blue);
        font-weight: 600;
        text-decoration: none;
    }

    .result-card p {
        margin-top: 8px;
        color: #666;
        line-height: 1.5;
    }

    .import-box {
        margin-top: 30px;
        background: white;
        padding: 18px;
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--proton-border);
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
    }

    .import-box h2 {
        text-align: center;
        color: var(--proton-blue);
        font-size: 20px;
        margin-bottom: 10px;
    }

    .import-box input {
        width: 100%;
        padding: 10px;
        margin-top: 8px;
        border-radius: var(--radius);
        border: 2px solid var(--proton-border);
        font-size: 14px;
        background: white;
    }

    .import-box button {
        width: 100%;
        margin-top: 12px;
        padding: 12px;
        border-radius: var(--radius);
        border: none;
        background: var(--proton-blue);
        color: white;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
    }

    .import-box button:hover {
        background: var(--proton-blue-hover);
    }
</style>
</head>
<body>

<div class="wrap">

    <h1>X!<span>Search</span></h1>

    <div class="search-box">
        <input id="query" placeholder="Suchbegriff eingeben...">
        <button onclick="search()">Suchen</button>
    </div>

    <div id="results"></div>

    <div class="import-box">
        <h2>Import</h2>

        <input id="importUrl" placeholder="Domain (example.com)">
        <input id="importDesc" placeholder="Beschreibung">
        <input id="importPrev" placeholder="Vorschau">

        <button onclick="importEntry()">Hinzufügen</button>
    </div>

</div>

<script>
let entries = [];
let githubToken = "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";
let githubUser = "nox314";
let githubRepo = "Home";
let githubFile = "websites.txt";

// TXT laden
fetch(`https://raw.githubusercontent.com/${githubUser}/${githubRepo}/main/${githubFile}`)
    .then(r => r.text())
    .then(text => {
        text.split("\n").forEach(line => {
            const m = line.match(/(.*?)="(.*?)"\/"(.*?)"/);
            if (m) entries.push({ url: m[1].trim(), description: m[2].trim(), preview: m[3].trim() });
        });
    });

// Import-Funktion → schreibt in GitHub TXT
async function importEntry() {
    const url = document.getElementById("importUrl").value.trim();
    const desc = document.getElementById("importDesc").value.trim();
    const prev = document.getElementById("importPrev").value.trim();

    if (!url || !desc || !prev) return alert("Bitte alle Felder ausfüllen!");

    if (entries.some(e => e.url.toLowerCase() === url.toLowerCase())) {
        alert("Diese Website existiert bereits!");
        return;
    }

    const entry = { url, description: desc, preview: prev };
    entries.push(entry);

    let newTXT = entries
        .map(e => `${e.url}="${e.description}"/"${e.preview}"`)
        .join("\n");

    // SHA der Datei holen
    const fileInfo = await fetch(`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${githubFile}`)
        .then(r => r.json());

    // Datei aktualisieren
    await fetch(`https://api.github.com/repos/${githubUser}/${githubRepo}/contents/${githubFile}`, {
        method: "PUT",
        headers: {
            "Authorization": `Bearer ${githubToken}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: "X!Search update",
            content: btoa(newTXT),
            sha: fileInfo.sha
        })
    });

    alert("Website hinzugefügt und TXT aktualisiert!");
}

// Rechtschreibtoleranz
function fuzzyMatch(text, query) {
    text = text.toLowerCase();
    query = query.toLowerCase();

    if (text.includes(query)) return true;

    let dp = Array(query.length + 1).fill(null).map(() =>
        Array(text.length + 1).fill(0)
    );

    for (let i = 0; i <= query.length; i++) dp[i][0] = i;
    for (let j = 0; j <= text.length; j++) dp[0][j] = j;

    for (let i = 1; i <= query.length; i++) {
        for (let j = 1; j <= text.length; j++) {
            dp[i][j] = Math.min(
                dp[i - 1][j] + 1,
                dp[i][j - 1] + 1,
                dp[i - 1][j - 1] + (query[i - 1] === text[j - 1] ? 0 : 1)
            );
        }
    }

    return dp[query.length][text.length] <= 2;
}

function search() {
    const q = document.getElementById("query").value.toLowerCase();
    const out = document.getElementById("results");
    out.innerHTML = "";

    const results = entries.filter(e =>
        fuzzyMatch(e.url, q) ||
        fuzzyMatch(e.description, q) ||
        fuzzyMatch(e.preview, q)
    );

    if (!results.length) {
        out.innerHTML = "<p style='text-align:center;color:#624aff;font-weight:600;'>Keine Ergebnisse gefunden.</p>";
        return;
    }

    results.forEach(e => {
        const div = document.createElement("div");
        div.className = "result-card";
        div.innerHTML = `
            <h3>${e.url}</h3>
            <a href="https://${e.url}" target="_blank">${e.url}</a>
            <p><strong>Beschreibung:</strong> ${e.description}</p>
            <p><strong>Vorschau:</strong> ${e.preview}</p>
        `;
        out.appendChild(div);
    });
}
</script>

</body>
</html>
