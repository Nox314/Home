<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>x!search – nox!314</title>
<link href="https://fonts.googleapis.com/css2?family=inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #624aff; --blue-hover: #4f37e0; --dark: #1c1c1c; --light: #f5f7fa;
  --border: #e0e4eb; --text: #333; --radius: 14px;
  --shadow: 0 6px 20px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; }
body { margin:0; font-family:'Inter',sans-serif; background:var(--light); color:var(--text); }
.wrap { max-width: 900px; margin: 0 auto; padding: 30px; }
h1 { text-align:center; font-size:46px; font-weight:700; margin-top:20px; color:var(--dark); }
h1 span { color:var(--blue); }
.search-box { margin:30px auto 10px; max-width:560px; position:relative; }
.search-box input { width:100%; padding:16px 46px 16px 16px; border-radius:28px;
  border:2px solid var(--border); font-size:17px; background:white; transition:0.2s; }
.search-box input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(98,74,255,0.15); outline:none; }
.search-box .count { position:absolute; right:16px; top:50%; transform:translateY(-50%);
  font-size:13px; color:#999; }
.stats { text-align:center; color:#888; font-size:14px; min-height:20px; margin-bottom:6px; }
#results { margin-top:10px; }
.result-card { background:white; border-radius:var(--radius); padding:18px 22px; margin:14px 0;
  box-shadow:var(--shadow); transition:0.15s; }
.result-card:hover, .result-card.active { transform:translateY(-2px); border:1px solid var(--blue); }
.result-card h3 { margin:0; font-size:19px; font-weight:600; color:var(--dark); overflow-wrap:anywhere; }
.result-card h3 mark, .result-card .snippet mark { background:rgba(98,74,255,0.15); color:var(--blue);
  border-radius:3px; padding:0 2px; }
.result-card a { color:var(--blue); font-weight:600; text-decoration:none; font-size:14px;
  display:block; margin-top:2px; overflow-wrap:anywhere; }
.result-card .snippet { margin-top:8px; color:#555; line-height:1.6; font-size:14px;
  word-break:break-all; }
.loading { text-align:center; color:var(--blue); font-weight:600; padding:20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>x!<span>search</span></h1>
  <div class="search-box">
    <input id="query" placeholder="Suchbegriff eingeben…" autofocus autocomplete="off">
    <span class="count" id="count"></span>
  </div>
  <div class="stats" id="stats"></div>
  <div id="results"></div>
</div>

<script>

const githubuser = "nox314";
const githubrepo = "home";
const githubfile = "websites.txt";

function tokenize(text) {
  return text
    .toLowerCase()
    .replace(/https?:\/\//g, "")
    .split(/[\/\.\-\_\?\&\=\#\+\~\:]+/)
    .flatMap(t => t.split(/(?=[A-Z])/))       // camelCase trennen (fallback)
    .filter(t => t.length > 1 && !/^\d+$/.test(t));
}

function normalize(word) {
  return word
    .replace(/ä/g, "a").replace(/ö/g, "o")
    .replace(/ü/g, "u").replace(/ß/g, "ss");
}

function stem(w) {
  const endings = ["ungen", "eren", "isch", "lich", "heit", "keit", "ung", "ern", "em",
                   "en", "er", "es", "st", "e", "n", "s"];
  for (const end of endings) {
    if (w.length > end.length + 3 && w.endsWith(end)) return w.slice(0, -end.length);
  }
  return w;
}

function analyze(text) {
  return [...new Set(tokenize(normalize(text)).map(stem))];
}

const entries = [];
const index = new Map()
const df = new Map();      
let builtAt = 0;

function buildIndex() {
  index.clear(); df.clear();
  entries.forEach((e, i) => {
    const terms = analyze(e.url);
    e._terms = terms;
    const freq = new Map();
    terms.forEach(t => freq.set(t, (freq.get(t) || 0) + 1));
    freq.forEach((tf, term) => {
      if (!index.has(term)) index.set(term, new Map());
      index.get(term).set(i, tf);
      df.set(term, (df.get(term) || 0) + 1);
    });
  });
  builtAt = performance.now();
}

function levenshtein(a, b) {
  const dp = Array.from({length: a.length + 1}, (_, i) => [i, ...Array(b.length).fill(0)]);
  for (let j = 0; j <= b.length; j++) dp[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      dp[i][j] = Math.min(
        dp[i-1][j] + 1,
        dp[i][j-1] + 1,
        dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)
      );
  return dp[a.length][b.length];
}


function expandTerm(term, tolerance = 2) {
  if (index.has(term)) return [term];
  const candidates = [];
  for (const t of index.keys()) {
    if (Math.abs(t.length - term.length) <= tolerance && levenshtein(term, t) <= tolerance) {
      candidates.push(t);
    }
  }
  return candidates;
}

function doSearch(query) {
  const t0 = performance.now();
  const queryTerms = analyze(query);
  if (!queryTerms.length) return { results: [], ms: 0 };

  const scores = new Map(); // rowIndex -> score
  const matchedTerms = [];

  for (const qt of queryTerms) {
    // Original-Term + Tippfehler-Varianten
    const variants = expandTerm(qt, qt.length > 5 ? 2 : 1);
    for (const v of variants) {
      const postings = index.get(v);
      if (!postings) continue;
      matchedTerms.push(v);

      const idf = Math.log(1 + entries.length / postings.size);
      const isFuzzy = (v !== qt) ? 0.5 : 1; // exakte Treffer doppelt gewichten

      postings.forEach((tf, i) => {
        const score = idf * (1 + Math.log(tf)) * isFuzzy;
        scores.set(i, (scores.get(i) || 0) + score);
      });
    }
  }

  // Bonus: Treffer in der Domain (nicht nur im Pfad) = wichtiger
  const final = [...scores.entries()].map(([i, score]) => {
    const e = entries[i];
    const domain = e.url.split("/")[0].toLowerCase();
    let bonus = 1;
    queryTerms.forEach(qt => { if (domain.includes(qt)) bonus *= 1.6; });
    if (queryTerms.every(qt => e._terms.includes(qt))) bonus *= 1.3; // Alle Begriffe da
    bonus *= 1 / (1 + e.url.length / 200);                           // kürzere URLs leicht bevorzugen
    return { e, score: score * bonus };
  });

  final.sort((a, b) => b.score - a.score);
  return { results: final.slice(0, 30), ms: (performance.now() - t0), matchedTerms };
}

// ---------- 5. UI: INSTANT-SEARCH BEIM TIPPEN ----------
const input = document.getElementById("query");
const out = document.getElementById("results");
const statsEl = document.getElementById("stats");
const countEl = document.getElementById("count");
let debounceTimer;

function escapeHtml(s) {
  const d = document.createElement("div"); d.textContent = s; return d.innerHTML;
}

// Treffer im Text hervorheben
function highlight(text, terms) {
  let html = escapeHtml(text);
  terms.forEach(t => {
    // auch Wortstamm-Treffer markieren (erste 5 Zeichen des Stemms)
    const frag = t.slice(0, Math.max(3, t.length - 1));
    const re = new RegExp("(" + frag.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-zäöüß0-9]*)", "gi");
    html = html.replace(re, "<mark>$1</mark>");
  });
  return html;
}

function render() {
  const q = input.value.trim();

  if (q.toLowerCase() === "nox314") {
    document.body.style.background = "#000"; document.body.style.color = "#0f0";
    setTimeout(() => { document.body.style.background=""; document.body.style.color=""; }, 5000);
    out.innerHTML = "<p style='text-align:center;color:#624aff;font-weight:600;'>Deep Mode!</p>";
    return;
  }

  if (!q) { out.innerHTML = ""; statsEl.innerHTML = ""; countEl.textContent = ""; return; }

  const { results, ms, matchedTerms } = doSearch(q);
  countEl.textContent = results.length || "";
  statsEl.innerHTML = results.length
    ? `Ungefähr <b>${results.length}</b> Ergebnisse (<b>${ms.toFixed(1)}</b> Millisekunden)`
    : "";

  if (!results.length) {
    out.innerHTML = "<p style='text-align:center;color:#624aff;font-weight:600;'>Keine Ergebnisse gefunden.</p>";
    return;
  }

  const frag = document.createDocumentFragment();
  for (const { e } of results) {
    // Snippet aus URL-Pfad generieren (wie Google: Ausschnitt mit Kontext)
    const parts = e.url.split("/");
    const domain = parts[0];
    const path = parts.slice(1).join(" › ") || "Startseite";

    const card = document.createElement("div");
    card.className = "result-card";
    card.innerHTML = `
      <h3>${highlight(domain, matchedTerms)}</h3>
      <a href="https://${escapeHtml(e.url)}" target="_blank" rel="noopener">${escapeHtml(domain)}</a>
      <div class="snippet">${path ? highlight(path, matchedTerms) : ""}</div>
    `;
    frag.appendChild(card);
  }
  out.innerHTML = "";
  out.appendChild(frag);
}

input.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(render, 40); // Praktisch instant
});

// Enter öffnet das beste Ergebnis direkt (wie "I'm feeling lucky")
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    const { results } = doSearch(input.value.trim());
    if (results.length) window.open("https://" + results[0].e.url, "_blank");
  }
});

// ---------- 6. DATEN LADEN (einmalig) ----------
fetch(`https://raw.githubusercontent.com/${githubuser}/${githubrepo}/main/${githubfile}`)
  .then(r => r.text())
  .then(text => {
    text.split("\n").forEach(line => {
      const url = line.trim();
      if (url.length > 0) entries.push({ url });
    });
    buildIndex();
    statsEl.innerHTML = `Index bereit: <b>${entries.length}</b> Seiten · <b>${index.size}</b> eindeutige Begriffe · aufgebaut in ${(builtAt - 0).toFixed(0)}ms`;
  })
  .catch(() => {
    statsEl.innerHTML = "Daten konnten nicht geladen werden.";
  });
</script>
</body>
</html>
