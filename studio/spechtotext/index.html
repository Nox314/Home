<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X!Studio - Speech to Text</title>
    <style src="./style.css"></style>
</head>
<body>

    <nav id="topMenu">
        <div class="wrap">
            <a href="index.html" class="logo">nox<span>!</span>314</a>
            <div class="nav-links">
                <a href="index.html">Start</a>
                <a href="date.html">Weltuhr</a>
                <a href="iss.html">Iss</a>
                <a href="info.html">Info</a>
                <a href="login.html">Login</a>
                <a href="register.html" class="btn-register">Registrieren</a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <div class="wrap">
            <div class="speech-container">
                <div class="speech-header">
                    <h2>🎤 Sprach-zu-Text Converter</h2>
                    <p>Sprache auswählen und aufnehmen für präzise Texterkennung in mehreren Sprachen</p>
                </div>

                <div class="language-select">
                    <label for="languageSelect">Sprache wählen:</label>
                    <select id="languageSelect" class="language-dropdown">
                        <option value="de-DE">Deutsch</option>
                        <option value="en-US">English (US)</option>
                        <option value="en-GB">English (UK)</option>
                        <option value="zh-CN">中文 (简体中文)</option>
                        <option value="zh-TW">繁體中文 (Türkisch)</option>
                        <option value="ja-JP">日本語</option>
                        <option value="ko-KR">한국어</option>
                        <option value="es-ES">Español</option>
                        <option value="fr-FR">Français</option>
                        <option value="it-IT">Italiano</option>
                        <option value="pt-BR">Português (Brasil)</option>
                        <option value="ru-RU">Русский</option>
                        <option value="ar-SA">العربية</option>
                        <option value="hi-IN">हिन्दी</option>
                        <option value="tr-TR">Türkçe</option>
                        <option value="nl-NL">Nederlands</option>
                        <option value="sv-SE">Svenska</option>
                        <option value="pl-PL">Polski</option>
                    </select>
                </div>

                <div class="recording-area">
                    <button id="startButton">
                        <img src="https://cdn-icons-png.flaticon.com/512/25/25682.png" alt="Mikrofon">
                    </button>
                    <p class="status-text" id="statusText">Tippe zum Aufnehmen</p>
                </div>

                <div id="output">Deine transkribierte Sprache erscheint hier...</div>

                <div class="control-buttons">
                    <button id="copyButton" class="btn btn-copy">📋 Kopieren</button>
                    <button id="clearButton" class="btn btn-clear">🗑️ Löschen</button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="wrap">
            <div>&copy; 2026 nox!314</div>
        </div>
    </footer>

    <script src="./script.js"></script>
</body>
</html>
