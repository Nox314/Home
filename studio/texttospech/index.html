<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X!Studio - Text to Speech</title>

    <!-- Style CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="main">
        <div class="container">
            <h1>X!Studio - Text to Speech</h1>
            
            <div class="tts-controls">
                <div class="control-group">
                    <label for="language">Sprache:</label>
                    <select id="language"></select>
                </div>
                <div class="control-group">
                    <label for="voice">Stimme:</label>
                    <select id="voice"></select>
                </div>
            </div>

            <div class="tts-sliders">
                <div class="slider-group">
                    <label for="rate">Tempo: <span id="rateValue">1.0</span></label>
                    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div class="slider-group">
                    <label for="pitch">Tonhöhe: <span id="pitchValue">1.0</span></label>
                    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
                </div>
                <div class="slider-group">
                    <label for="volume">Lautstärke: <span id="volumeValue">1.0</span></label>
                    <input type="range" id="volume" min="0" max="1" step="0.1" value="1">
                </div>
            </div>

            <div class="button">
                <button id="speakButton"><img src="https://cdn-icons-png.flaticon.com/512/744/744974.png" alt="" width="50" height="50"></button>
                <small>Klicken zum Vorlesen</small>
            </div>
            
            <div id="output"></div>
            
            <div class="buttons">
                <button id="pauseButton">Pause</button>
                <button id="stopButton">Stop</button>
                <button id="clearButton">Clear Text</button>
            </div>

            <div id="status"></div>
        </div>
    </div>

    <!-- Script JS -->
    <script src="./script.js"></script>
</body>
</html>
